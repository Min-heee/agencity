<style>
/* 에이전시티 도시: 등록한 사람마다 건물 하나. 높이는 토큰 작업량(로그 눈금), 금빛 띠는 공개한 층(팀).

:root{
  --sky-1:#0B1222; --sky-2:#1B2742; --ground:#121A2B; --street:#1A2438;
  --panel:#FFFFFF; --panel-2:#F2F4F8; --ink:#172030; --ink-2:#4F5D72; --ink-3:#8591A3; --line:#D6DDE7;
  --gold:#F4C35A; --lit:#FFD27A; --focus:#2563EB; --err:#C42730;
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#171E28; --panel-2:#1F2834; --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --focus:#7AA7FF; --err:#FF8A8E; }
}
:root[data-theme="dark"]{ --panel:#171E28; --panel-2:#1F2834; --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --focus:#7AA7FF; --err:#FF8A8E; }
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--sky-1); color:var(--ink); font:14px/1.5 var(--font-body); -webkit-font-smoothing:antialiased; overflow:hidden}

:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.top{position:fixed; z-index:5; left:0; right:0; top:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); pointer-events:none}

.plate{margin:0; font:400 26px/1 var(--font-display); color:#F3F5F8; background:#0A0E14; padding:9px 16px 7px; border-radius:6px; box-shadow:inset 0 0 0 2px #3A4659}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:6px; background:rgba(10,14,20,.72); color:#E4E8EE; border:1px solid #3A4659; font-size:12.5px; text-decoration:none}

.sp{flex:1}
#stage{position:fixed; inset:0; background:linear-gradient(var(--sky-1), var(--sky-2) 60%, var(--ground)); touch-action:none; cursor:grab}

#city{width:100%; height:100%; display:block}
.bld{cursor:pointer}
.bld:focus{outline:none}

.hint{position:fixed; z-index:4; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); color:#A9B4C3; font-size:12px; background:rgba(10,14,20,.6); padding:5px 10px; border-radius:6px; white-space:nowrap}
.hint a, .msg a{color:#E4E8EE}
/* 공개 도시에서만 보이는 것(설치·참가 안내). 내 컴퓨터의 앱에서는 숨겨요. */
:root:not(.visit) .visit-only{display:none}
.zoom{position:fixed; z-index:7; right:max(16px, env(safe-area-inset-right)); bottom:max(48px, calc(env(safe-area-inset-bottom) + 40px)); display:flex; flex-direction:column; gap:6px}
.zoom button{width:38px; height:38px; border-radius:8px; border:1px solid #3A4659; background:rgba(10,14,20,.85); color:#E4E8EE; font-size:18px; cursor:pointer}

.msg h2{font:400 24px var(--font-display); margin:0 0 6px; color:#F3F5F8}
/* 카드 */
.card{position:fixed; z-index:6; top:64px; right:max(16px, env(safe-area-inset-right)); width:min(380px, calc(100% - 32px)); max-height:calc(100% - 84px); overflow:auto; background:var(--panel); color:var(--ink); border-radius:12px; box-shadow:0 18px 50px -20px rgba(0,0,0,.6); padding:16px 18px 18px}
.card[hidden]{display:none}
.card-head{display:flex; align-items:center; gap:12px}
.card-head img{width:44px; height:44px; border-radius:50%; background:var(--panel-2)}
.card-head h2{margin:0; font:400 24px/1.1 var(--font-display); overflow-wrap:anywhere}
.card-head small{display:block; color:var(--ink-3); font-size:12px}
.x{margin-left:auto; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:5px 10px; cursor:pointer}
.stats{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin:14px 0 0}

.sec{margin:16px 0 6px; font-size:13px; font-weight:600}
.floors{list-style:none; margin:0; padding:0}

.floors li:first-child{border-top:0}
.floors b{font-family:var(--font-mono); font-size:12px; margin-right:6px}
.floors p{margin:2px 0 0; color:var(--ink-2); font-size:12.5px}
.u{unicode-bidi:isolate}
.note{margin:12px 0 0; font-size:12px; color:var(--ink-3)}
.btn{display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:8px 13px; border-radius:7px; border:1px solid var(--ink); background:var(--ink); color:var(--panel); font-size:13px; font-weight:600; cursor:pointer; text-decoration:none}
.btn.ghost{background:var(--panel); color:var(--ink); border-color:var(--line)}
/* 둘러보기 */
.tour{position:fixed; z-index:8; inset:0; background:rgba(5,8,14,.72); display:flex; align-items:center; justify-content:center; padding:16px}
.tour[hidden]{display:none}
.tour-box{width:min(760px, 100%); max-height:100%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:14px; padding:18px 20px}
.tour-box h2{margin:0; font:400 26px var(--font-display); overflow-wrap:anywhere}
.tf{margin-top:14px; border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.tf h3{margin:0 0 6px; font:400 19px var(--font-display)}
.tf h3 small{font:500 12px var(--font-body); color:var(--ink-3); margin-left:6px}
.desks{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:8px}
.desk{background:var(--panel-2); border-radius:8px; padding:8px 10px; font-size:12.5px}
.desk b{display:block; font:400 16px var(--font-display)}
.st{display:inline-block; margin-top:2px; padding:0 6px; border-radius:3px; font-size:11px; font-weight:600; background:var(--line); color:var(--ink)}
.st.work{background:#FFB224; color:#1C2330}
.st.meet{background:#A68BEA; color:#1C2330}
.st.block{background:#FF6369; color:#1C2330}
.boardl{margin:8px 0 0; padding-left:18px; font-size:12.5px; color:var(--ink-2)}
@media (max-width:620px){
  .card{top:auto; bottom:0; right:0; width:100%; max-height:58%; border-radius:14px 14px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  body.carded .zoom{bottom:calc(58% + 12px)}
  .plate{font-size:22px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

<body>
<header class="top">
  <h1 class="plate">에이전시티 도시</h1>
  <span class="chip" id="count" role="status">불러오는 중</span>
  <span class="sp"></span>
  <a class="chip" id="home" href="./" hidden>← 내 사무실</a>
  <a class="chip" id="build" href="./?setup=4" hidden>내 건물 세우기 →</a>
  <a class="chip" href="https://github.com/Min-heee/agencity/blob/main/docs/VISION.md" target="_blank" rel="noopener">도시 규칙</a>

<div id="stage" aria-label="에이전시티 도시 지도"><svg id="city" role="group" aria-label="건물들"></svg></div>
<div class="msg" id="msg" hidden></div>
<div class="zoom"><button type="button" id="zin" aria-label="가까이">+</button><button type="button" id="zout" aria-label="멀리">−</button><button type="button" id="zfit" aria-label="전체 보기">⌂</button></div>
<p class="hint">끌어서 둘러보고, 건물이나 이름을 누르면 그 사람이 공개한 것만 보여요<span class="visit-only"><br><span id="join">내 건물은 <a href="https://github.com/Min-heee/agencity/blob/main/docs/GUIDE.md#에이전시티-도시" target="_blank" rel="noopener">에이전시티</a>를 설치하고 설정에서 세워요. <a href="https://github.com/Min-heee/token-meter#참가하기" target="_blank" rel="noopener">직접 참가</a>해도 돼요</span></span></p>
<aside class="card" id="card" hidden aria-live="polite"></aside>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tourTitle"><div class="tour-box" id="tourBox"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 설정 ---------- */
// 기본: token-meter 공개 명단. 로컬 사무실 서버에서는 org.json의 city 칸으로 바꿀 수 있어요({registry, me}).
const CONFIG = { registry: 'https://min-heee.github.io/token-meter/', gistRaw: 'https://gist.githubusercontent.com/', meterFile: 'token-meter.json', officeFile: 'agencity.json', oldOfficeFile: 'claude-office.json', me: '' };
const params = new URLSearchParams(location.search);
const LOCAL = !document.documentElement.classList.contains('visit');   // 내 컴퓨터의 앱(127.0.0.1)인지, 머리에서 정했어요
const DEMO = params.has('demo');
const DEMO_NOW = new Date('2026-10-21T09:00:00+09:00');   // 예시 데이터의 기준 날짜(언제 열어도 같은 모습)
const now = () => DEMO ? DEMO_NOW : new Date();
const LOGIN_RE = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}$/;
const GIST_RE = /^[0-9a-f]{5,64}$/i;
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
const TZ_RE = /^[A-Za-z0-9_+\-/]{1,64}$/;
const MAX_BYTES = 256 * 1024, MEMBERS_BYTES = 4 * 1024 * 1024, MAX_MEMBERS = 2000, TIMEOUT = 12000, DEADLINE = 25000, CONC = 8;
const TOOLS = { claude: '#E0895A', codex: '#6FB6A0', gemini: '#7A9BE0' };
const DISTRICTS = { app: '앱', web: '웹', data: '데이터', content: '콘텐츠', tool: '개발 도구', game: '게임', etc: '기타' };
const STATES = ['일하는 중', '대기', '회의 중', '막힘'];

/* ---------- 받기 (남이 만든 데이터라 크기·모양을 엄격히 확인) ---------- */
async function getCapped(url, cap = MAX_BYTES, fresh = false) {
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), TIMEOUT);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: fresh ? 'no-store' : 'default', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }
    const len = Number(r.headers.get('content-length'));
    if (len && len > cap) { ctl.abort(); throw new Error('too_large'); }
    if (!r.body || !r.body.getReader) { const t = await r.text(); if (t.length > cap) throw new Error('too_large'); return t; }
    const reader = r.body.getReader(), parts = [];
    let n = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      n += value.byteLength;
      if (n > cap) { ctl.abort(); throw new Error('too_large'); }
      parts.push(value);
    }
    const all = new Uint8Array(n); let o = 0;
    for (const p of parts) { all.set(p, o); o += p.byteLength; }
    return new TextDecoder().decode(all);
  } finally { clearTimeout(tm); }
}
const num = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= Number.MAX_SAFE_INTEGER) ? v : 0;
// 제어·방향 바꾸기·보이지 않는 글자는 빼요(남의 글이 화면을 속이지 못하게).
const str = (v, n) => typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f\u2028\u2029]|\p{Cf}/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, n) : '';

function cleanMeter(doc, login) {
  if (!doc || typeof doc !== 'object' || doc.schema !== 1 || doc.app !== 'token-meter' || String(doc.login).toLowerCase() !== login.toLowerCase() || !Array.isArray(doc.entries)) return null;
  const tools = Object.create(null), days = Object.create(null), models = Object.create(null);
  let tz = '';
  for (const e of doc.entries.slice(0, 3)) {
    if (!e || typeof e !== 'object' || typeof e.tool !== 'string' || !own(TOOLS, e.tool) || !e.totals || typeof e.totals !== 'object') continue;
    const t = e.totals;
    tools[e.tool] = { input: num(t.input), output: num(t.output), cacheWrite: num(t.cacheWrite), cacheRead: num(t.cacheRead), total: num(t.total) };
    if (!tz && typeof e.tz === 'string' && TZ_RE.test(e.tz)) { try { new Intl.DateTimeFormat('en-CA', { timeZone: e.tz }); tz = e.tz; } catch (x) {} }
    if (e.byDay && typeof e.byDay === 'object') {
      for (const [d, v] of Object.entries(e.byDay).slice(-400)) if (DAY_RE.test(d) && Array.isArray(v) && num(v[0]) > 0) days[d] = (days[d] || 0) + num(v[0]);
    }
    if (e.byModel && typeof e.byModel === 'object') {
      for (const [m, v] of Object.entries(e.byModel).slice(0, 100)) { const f = family(m); models[f] = (models[f] || 0) + num(v && v.total); }
    }
  }
  if (!Object.keys(tools).length) return null;
  return { tools, days, models, tz, updatedAt: str(doc.updatedAt, 40) };
}
// 모델 이름은 계열로만 묶어요(사내 배포 이름 같은 게 보이지 않게).
function family(m) {
  m = String(m).toLowerCase();
  if (m.includes('opus')) return 'Opus';
  if (m.includes('sonnet')) return 'Sonnet';
  if (m.includes('haiku')) return 'Haiku';
  if (m.includes('fable')) return 'Fable';
  if (m.includes('gemini')) return 'Gemini';
  if (m.includes('gpt') || m.includes('codex') || /^o\d/.test(m)) return 'GPT';
  return '기타';
}
const district = v => (typeof v === 'string' && own(DISTRICTS, v)) ? v : '';
function cleanOffice(doc, login, app = 'agencity') {
  if (!doc || typeof doc !== 'object' || doc.schema !== 1 || doc.app !== app || String(doc.login).toLowerCase() !== login.toLowerCase()) return null;
  const p = doc.profile && typeof doc.profile === 'object' ? doc.profile : {};
  const floors = (Array.isArray(doc.floors) ? doc.floors : []).slice(0, 20).map(f => {
    if (!f || typeof f !== 'object') return null;
    const level = f.public === 'tour' ? 'tour' : f.public === 'name' ? 'name' : null;
    if (!level) return null;
    return {
      floor: Math.max(1, Math.min(99, Math.round(num(f.floor)) || 1)), name: str(f.name, 40) || '이름 없는 층', level,
      summary: str(f.summary, 200), district: district(f.district),
      desks: level === 'tour' && Array.isArray(f.desks) ? f.desks.slice(0, 8).map(d => d && typeof d === 'object' && ({ role: str(d.role, 10), state: STATES.includes(d.state) ? d.state : '', task: str(d.task, 80) })).filter(d => d && d.role) : [],
      board: level === 'tour' && Array.isArray(f.board) ? f.board.slice(0, 10).map(b => str(b, 80)).filter(Boolean) : [],
    };
  }).filter(Boolean).sort((a, b) => a.floor - b.floor);
  return { intro: str(p.intro, 120), district: district(p.district), floors, updatedAt: str(doc.updatedAt, 40) };
}

// onPerson: 한 사람씩 도착할 때마다 불러요(먼저 온 건물부터 그려요).
async function loadMembers(onPerson) {
  if (DEMO) {
    const doc = JSON.parse(await getCapped('examples/city/demo.json'));
    const ppl = (Array.isArray(doc.people) ? doc.people : []).slice(0, 200);
    for (const p of ppl) {
      const login = String(p && p.login || '');
      if (!LOGIN_RE.test(login)) continue;
      const meter = cleanMeter(p.meter, login);
      if (meter) onPerson({ login, demo: true, meter, office: cleanOffice(p.office, login) });
    }
    return { listed: ppl.length, failed: 0, logins: [] };
  }
  const doc = JSON.parse(await getCapped(new URL('members.json', new URL(CONFIG.registry)).href, MEMBERS_BYTES, true));
  const list = (Array.isArray(doc.members) ? doc.members : []).slice(0, MAX_MEMBERS).filter(m => m && LOGIN_RE.test(m.login) && GIST_RE.test(m.gist));
  let i = 0, failed = 0;
  const stopAt = Date.now() + DEADLINE;
  async function worker() {
    while (i < list.length && Date.now() < stopAt) {
      const m = list[i++];
      const raw = `${CONFIG.gistRaw}${encodeURIComponent(m.login)}/${encodeURIComponent(m.gist)}/raw/`;
      let meter = null, office = null;
      try { meter = cleanMeter(JSON.parse(await getCapped(raw + CONFIG.meterFile)), m.login); } catch (e) {}

  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!wasMove && Math.hypot(dx, dy) < drag.slop) return;
  if (!wasMove) stage.classList.add('drag');
  wasMove = true; moved = true;
  view.x = drag.vx + dx; view.y = drag.vy + dy; applyView();
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && e.pointerId === drag.id) drag = null;
  if (!ptrs.size) stage.classList.remove('drag');
}
stage.addEventListener('pointerup', e => {
  const tap = drag && e.pointerId === drag.id && !wasMove && ptrs.size === 1;
  endPtr(e);
  if (!tap) return;
  const p = findPerson(document.elementFromPoint(e.clientX, e.clientY));
  if (p) card(p); else if (!$('#card').hidden) closeCard();
});
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('lostpointercapture', e => { if (ptrs.has(e.pointerId)) endPtr(e); });
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
$('#zin').addEventListener('click', () => zoomAt(1.25, innerWidth / 2, innerHeight / 2));
$('#zout').addEventListener('click', () => zoomAt(0.8, innerWidth / 2, innerHeight / 2));
$('#zfit').addEventListener('click', () => fit());
svg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const p = findPerson(e.target);
  if (p) { e.preventDefault(); card(p); }
});
// 키보드로 건물에 오면 그 건물이 화면에 보이게
svg.addEventListener('focusin', e => {
  const p = findPerson(e.target);
  if (!p || !p.box) return;
  const W = svg.clientWidth || innerWidth, H = svg.clientHeight || innerHeight;
  const sx = p.box.cx * view.k + view.x, sy = ((p.box.top + p.box.maxY) / 2) * view.k + view.y;
  if (sx < 40 || sx > W - 40 || sy < 80 || sy > H - 60) { view.x += W / 2 - sx; view.y += H / 2 - sy; moved = true; applyView(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !$('#tour').hidden) {          // 둘러보기 창 안에서만 돌아요
    const f = [...$('#tourBox').querySelectorAll('button, a[href]')];
    if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
  }
  if (e.key !== 'Escape') return;
  if (!$('#tour').hidden) { closeTour(); return; }
  if (!$('#card').hidden) closeCard();
});
$('#tour').addEventListener('click', e => { if (e.target.id === 'tour') closeTour(); });
// 창 크기가 바뀌면: 직접 움직이지 않았으면 다시 맞추고, 움직였으면 가운데 있던 곳을 그대로 가운데에
let lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  if (!bounds) return;
  if (!moved) fit();
  else { view.x += (innerWidth - lastW) / 2; view.y += (innerHeight - lastH) / 2; applyView(); }
  lastW = innerWidth; lastH = innerHeight;
});

/* ---------- 시작 ---------- */
// html: 페이지에 미리 적어 둔 글(#join이나 고정 링크)만 넘겨요. 남이 만든 글은 body로(esc).
function message(title, body, html) { const m = $('#msg'); m.innerHTML = `<h2>${esc(title)}</h2><p>${html || esc(body)}</p>`; m.hidden = false; }
function addPerson(m) {
  const w = work(m.meter), h = hash(m.login);
  people.push(Object.assign(m, { w, floors: floorsOf(w), level: levelOf(w), recent: recentDays(m.meter), stale: daysAgo(m.meter.updatedAt),
    size: Math.max(2, Math.min(4, 2 + Math.floor(activeDays(m.meter) / 120))), hsl: [h % 360, 22 + (h >>> 9) % 18, 42 + (h >>> 17) % 12] }));
  $('#count').innerHTML = `건물 <b>${people.length}</b>채 · 불러오는 중`;
  scheduleDraw();
}
(async () => {
  // 로컬 사무실 서버라면 org.json의 city 설정(registry, me)을 써요. 공개 도시·정적 호스팅이면 읽지 않고 그냥 기본값.
  if (LOCAL) try {
    const org = JSON.parse(await getCapped('org.json', MAX_BYTES, true));
    if (org && org.city && typeof org.city === 'object') {
      if (typeof org.city.registry === 'string' && /^https:\/\//.test(org.city.registry)) CONFIG.registry = org.city.registry;
      if (typeof org.city.me === 'string' && LOGIN_RE.test(org.city.me)) CONFIG.me = org.city.me;
    }
    $('#home').hidden = false;
  } catch (e) {}
  // 이 맥의 사무실에 GitHub로 로그인했으면 그 아이디(서버가 알려 줘요). 명단에 없으면 설정 4단계(내 건물 세우기)로 이어 줘요.
  let me = '';
  if (LOCAL && !DEMO) try {
    const st = JSON.parse(await getCapped('api/state', MAX_BYTES, true));
    if (st && typeof st.github === 'string' && LOGIN_RE.test(st.github)) { me = st.github; if (!CONFIG.me) CONFIG.me = me; }
  } catch (e) {}
  try {
    const res = await loadMembers(addPerson);
    const extra = [res.failed ? `${res.failed}명 못 불러옴` : '', res.cut ? `${res.cut}명은 시간이 걸려 뺐어요` : '', DEMO ? '예시' : ''].filter(Boolean).join(' · ');
    $('#count').innerHTML = `건물 <b>${people.length}</b>채${extra ? ' · ' + esc(extra) : ''}`;
    if (res.failed || res.cut) $('#count').classList.add('warn');
    const missing = !!me && !res.logins.includes(me.toLowerCase());
    if (missing) $('#build').hidden = false;
    if (!people.length) {
      if (res.listed) message('건물을 불러오지 못했어요', `명단의 ${res.listed}명 중 아무도 불러오지 못했어요. 인터넷 연결을 확인하거나 잠시 뒤에 다시 열어 주세요.`);
      else message('아직 건물이 없어요', '내 숫자를 올리고 참가하면 첫 건물이 서요.', LOCAL ? (missing ? '<a href="./?setup=4">설정 4단계</a>에서 내 건물을 세우면 첫 건물이 서요.' : '') : $('#join').innerHTML);
      return;
    }
    layout(); draw();
    const want = params.get('who');
    const p = want && people.find(x => x.login.toLowerCase() === want.toLowerCase());
    if (!moved) fit(p || undefined);
    if (p) card(p);
  } catch (e) {
    $('#count').textContent = '불러오지 못함';
    $('#count').classList.add('warn');
    message('명단을 불러오지 못했어요', '인터넷 연결을 확인하거나 잠시 뒤에 다시 열어 주세요.');
  }
})();
})();
</script>
</body>
