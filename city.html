<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에이전시티 · 도시</title>
<meta name="description" content="참가한 사람마다 총 토큰만큼 높은 건물이 나라별 구역에 서요. 순위표로도 봐요. · Everyone who joins gets a building as tall as their total tokens, in their country's zone.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://min-heee.github.io/agencity/">
<meta property="og:title" content="에이전시티 도시 · Agencity City">
<meta property="og:description" content="AI 토큰 쓴 만큼 건물이 올라가는 도시 · A city where buildings grow with AI token usage.">
<meta property="og:image" content="https://min-heee.github.io/agencity/city.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<script>
// 내 컴퓨터의 에이전시티 앱(127.0.0.1)이 아니면 공개 도시예요: 설치·참가 안내를 보여요.
// 그리기 전에 정해서 깜빡이지 않아요(글꼴 스타일시트보다 먼저라 기다리지도 않아요).
if (!(location.protocol.startsWith('http') && /^(127\.0\.0\.1|localhost)$/.test(location.hostname))) document.documentElement.classList.add('visit');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 에이전시티 도시: 등록한 사람마다 건물 하나. 높이는 총 토큰(로그 눈금)이라 가장 높은 건물이 1등이에요. 금빛 띠는 공개한 층(팀).
   건물은 본인이 고른 나라의 구역에 서요(agencity.json의 profile.country, 안 골랐으면 맨 끝 '나라 안 고름' 구역).
   [빌딩]/[숫자] 보기: 숫자 보기는 총 토큰 순위표(순위·아이디·나라·총 토큰). 숫자가 서로 맞지 않으면 '확인 안 됨'으로 순위에서 빼요.
   [한국어 | English]로 화면 글을 바꿔요.
   숫자는 token-meter 공개 gist(token-meter.json), 공개한 사무실 요약과 나라는 같은 gist의 agencity.json에서 읽어요
   (그 파일이 없으면 예전 이름 때 올린 claude-office.json). 나라 코드 목록은 city/countries.json(앱·설치 없이 올리는 명령과 같은 파일).
   이 페이지는 열쇠가 없는 보기 전용 페이지예요(사무실 API를 부르지 않아요).
   공개 도시 https://min-heee.github.io/agencity/ 도 이 파일이에요(.github/workflows/city.yml이 올려요).
   주소: ?view=buildings|numbers  ?country=all|KR|none  ?lang=ko|en  ?who=<아이디>  ?demo=1
   ?who=<아이디>#me: 참가 명령이 여는 주소에만 붙어요. 그 아이디를 이 브라우저의 '나'로 기억하고 #me는 바로 지워요(공유 주소에는 없어요). */
:root{
  --sky-1:#0B1222; --sky-2:#1B2742; --ground:#121A2B; --street:#1A2438;
  --panel:#FFFFFF; --panel-2:#F2F4F8; --ink:#172030; --ink-2:#4F5D72; --ink-3:#8591A3; --line:#D6DDE7;
  --gold:#F4C35A; --lit:#FFD27A; --focus:#2563EB; --err:#C42730; --bar:#3C6FC4; --me:#FFF4D6;
  --top:64px;   /* 위 막대 높이(줄이 넘어가면 스크립트가 고쳐요) */
  --ctl:#0B111B;   /* 위 막대 칸 바탕: 불투명이라 지도·이름판·순위표가 뒤로 비치지 않아요(밝은·어두운 테마 같아요) */
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#171E28; --panel-2:#1F2834; --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --focus:#7AA7FF; --err:#FF8A8E; --bar:#6F9BE0; --me:#3A3220; }
}
:root[data-theme="dark"]{ --panel:#171E28; --panel-2:#1F2834; --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --focus:#7AA7FF; --err:#FF8A8E; --bar:#6F9BE0; --me:#3A3220; }
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--sky-1); color:var(--ink); font:14px/1.5 var(--font-body); -webkit-font-smoothing:antialiased; overflow:hidden}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
/* 위 막대: 왼쪽은 이름과 개수, 오른쪽은 [보기] [나라] [언어] */
.top{position:fixed; z-index:5; left:0; right:0; top:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); pointer-events:none}
.top > *{pointer-events:auto}
.plate{margin:0; font:400 26px/1 var(--font-display); color:#F3F5F8; background:#0A0E14; padding:9px 16px 7px; border-radius:6px; box-shadow:inset 0 0 0 2px #3A4659; white-space:nowrap}
.chip{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 11px; border-radius:6px; background:var(--ctl); color:#E4E8EE; border:1px solid #3A4659; font-size:12.5px; text-decoration:none; white-space:nowrap}
.chip[hidden]{display:none}   /* 위의 display가 hidden을 덮지 않게(공개 도시에서는 ‘← 내 사무실’이 없어요) */
.chip b{font-family:var(--font-mono); font-weight:500}
.chip.warn{border-color:#FFB224; color:#FFD27A}
/* 방문자 첫 단추: 내 토큰 세어 보기(참가 창 열기) */
button.chip{cursor:pointer; font-family:inherit}
.chip.cta{background:var(--gold); border-color:var(--gold); color:#1C2330; font-size:13.5px; font-weight:700}
.chip.cta:hover{background:#FFD27A}
.sp{flex:1}
/* 아이디 찾기 */
.find{position:relative; display:inline-flex; margin:0}
.find input{height:34px; width:178px; padding:0 10px 0 30px; border-radius:6px; background:var(--ctl); color:#E4E8EE; border:1px solid #3A4659; font-size:13px; -webkit-appearance:none; appearance:none}
.find input::placeholder{color:#9AA5B5}
.find svg{position:absolute; left:10px; top:50%; width:14px; height:14px; margin-top:-7px; color:#9AA5B5; pointer-events:none}
.ctl{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
/* 두 칸짜리 고르기(보기·언어): 고른 칸만 밝게 */
.seg{display:inline-flex; height:34px; padding:3px; border-radius:7px; background:var(--ctl); border:1px solid #3A4659}
.seg button{display:inline-flex; align-items:center; gap:6px; padding:0 12px; border:0; border-radius:5px; background:none; color:#C8D0DC; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap}
.seg button:hover{color:#FFFFFF}
.seg button[aria-pressed="true"]{background:#E4E8EE; color:#0B1222}
.seg svg{width:15px; height:15px; flex:none}
.pick{position:relative; display:inline-flex}
.pick select{appearance:none; -webkit-appearance:none; height:34px; padding:0 30px 0 11px; border-radius:6px; background:var(--ctl); color:#E4E8EE; border:1px solid #3A4659; font-size:13px; font-weight:600; cursor:pointer; max-width:220px}
.pick::after{content:""; position:absolute; right:12px; top:50%; width:7px; height:7px; margin-top:-6px; border-right:1.6px solid #C8D0DC; border-bottom:1.6px solid #C8D0DC; transform:rotate(45deg); pointer-events:none}
.pick select option{color:#172030; background:#FFFFFF}
/* 빌딩 보기 */
#stage{position:fixed; inset:0; background:linear-gradient(var(--sky-1), var(--sky-2) 60%, var(--ground)); touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none}   /* 끌어 고르기가 지도 이름판·건물 이름까지 번지지 않게(숫자 보기에서는 지도가 뒤에 숨어 있어요) */
#stage.drag{cursor:grabbing}
#city{width:100%; height:100%; display:block}
.bld{cursor:pointer}
.bld:focus{outline:none}
.bld:focus-visible .b-top,.bld.sel .b-top{stroke:var(--gold); stroke-width:2.4}
.dim{opacity:.24}
/* 나라 이름판과 건물 이름은 확대와 상관없이 같은 크기(화면 좌표에 따로 그려요) */
.name{font:600 12px var(--font-body); fill:#EEF2F7; paint-order:stroke; stroke:#0B1222; stroke-width:3.4px; cursor:pointer}
.name.sel{fill:var(--gold)}
.zone-plate{stroke-width:1.4}
.zone-sign{font:400 17px var(--font-display); fill:#F3F5F8}
.zone-sign.compact{font-size:14px}
.zone-n{font:600 12px var(--font-body); fill:#C8D0DC}
.zone-tag{cursor:pointer}
.zone-tag:hover rect,.zone-tag:focus-visible rect{stroke:var(--gold)}
.zone-tag:focus{outline:none}
.hint{position:fixed; z-index:4; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); margin:0; color:#C8D0DC; font-size:12.5px; background:rgba(10,14,20,.72); padding:5px 12px; border-radius:6px; white-space:nowrap}
.hint[hidden]{display:none}
.hint.big{padding:9px 16px; border:1px solid var(--gold); color:#F3F5F8; font-size:14.5px}
.hint.big small{font-size:12.5px}
.hint a{color:#E4E8EE}
.hint button,.msg button{padding:0; border:0; background:none; color:#FFFFFF; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.hint a.go,.msg a.go{color:#FFFFFF; font-weight:700; text-underline-offset:3px}
/* 공개 도시에서만 보이는 것(설치·참가 안내). 내 컴퓨터의 앱에서는 숨겨요. */
:root:not(.visit) .visit-only{display:none}
.zoom{position:fixed; z-index:7; right:max(16px, env(safe-area-inset-right)); bottom:max(48px, calc(env(safe-area-inset-bottom) + 40px)); display:flex; flex-direction:column; gap:6px}
.zoom[hidden]{display:none}
.zoom button{width:38px; height:38px; border-radius:8px; border:1px solid #3A4659; background:rgba(10,14,20,.85); color:#E4E8EE; font-size:18px; cursor:pointer}
.msg{position:fixed; z-index:4; left:50%; top:46%; transform:translate(-50%,-50%); color:#C8D0DC; text-align:center; max-width:min(520px, calc(100% - 32px))}
.msg[hidden]{display:none}
.msg h2{font:400 24px var(--font-display); margin:0 0 6px; color:#F3F5F8}
.msg p{margin:0}
/* 숫자 보기: 같은 하늘 위에 순위표 한 장. 도시 지도의 글자 대안이기도 해요.
   순위표는 위 막대 아래에서 스크롤해요(줄이 막대 칸 사이로 지나가지 않게). 막대 자리는 불투명 띠로 덮어요(body.numview) */
.numbers{position:fixed; z-index:4; inset:var(--top) 0 0 0; overflow:auto; padding:8px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); background:rgba(11,18,34,.78); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.numbers[hidden]{display:none}
body.numview .top{background:var(--sky-1); box-shadow:0 1px 0 #2A3443; pointer-events:auto; -webkit-user-select:none; user-select:none}   /* 띠의 빈 곳을 눌러도 뒤의 지도(건물 카드·끌기·휠)에 닿지 않게, 끌어도 막대 글자가 골라지지 않게 */
body.numview .top input{-webkit-user-select:text; user-select:text}
@media (min-width:761px){ body.carded .numbers{padding-right:412px} }   /* 카드가 열리면 순위표가 왼쪽으로 비켜요 */
.num-box{max-width:880px; margin:0 auto; background:var(--panel); color:var(--ink); border-radius:14px; padding:18px 20px 16px; box-shadow:0 18px 50px -20px rgba(0,0,0,.6)}
.num-head h2{margin:0; font:400 26px/1.1 var(--font-display)}
.num-head h2:focus{outline:none}
.num-head p{margin:4px 0 0; color:var(--ink-2); font-size:13px}
.few{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 14px; margin-top:14px; padding:14px 16px; border-radius:10px; background:color-mix(in srgb, var(--gold) 18%, var(--panel)); border:1px solid color-mix(in srgb, var(--gold) 55%, var(--line))}
.few b{font:400 22px var(--font-display)}
.few[hidden]{display:none}
.num-head p.self{color:var(--ink-3); font-size:12px}
.num-foot{margin:14px 0 0; font-size:12px; color:var(--ink-2)}
.num-foot a{color:inherit}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:8px; margin-top:14px}
.tiles[hidden]{display:none}
.tile{background:var(--panel-2); border-radius:8px; padding:8px 12px}
.tile span{display:block; font-size:12px; color:var(--ink-2)}
.tile b{font:600 18px var(--font-body); font-variant-numeric:tabular-nums}
.tile small{color:var(--ink-2); font-size:12px; margin-left:4px}
.rank{width:100%; margin-top:14px; border-collapse:collapse; font-size:13.5px}
.rank th{padding:6px 8px; border-bottom:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-2); text-align:left; white-space:nowrap}
.rank td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle}
.rank .r{text-align:right; font-variant-numeric:tabular-nums}
.rank tr.me td{background:var(--me)}
.rank tr.sel td{box-shadow:inset 0 2px 0 var(--gold), inset 0 -2px 0 var(--gold)}
.rank tr.old td:not(.c-rk){opacity:.55}   /* 30일 넘게 안 올린 사람 */
.rank tr.gap td{padding:2px 8px; border-bottom:0; color:var(--ink-3); text-align:center}
.rank tr.sep td{padding:14px 8px 6px; font-size:12px; color:var(--ink-2)}
.rank tr.sep b{color:var(--ink)}
.rank tr.bad td:not(.c-rk){opacity:.6}   /* 확인 안 됨: 등수 없이 아래에 흐리게 */
.rk{display:inline-grid; place-items:center; min-width:28px; height:24px; padding:0 6px; border-radius:5px; background:var(--panel-2); font:600 13px var(--font-mono)}
.rk.medal{background:var(--gold); color:#1C2330}
.rk-all{display:block; margin-top:2px; font-size:11px; color:var(--ink-2); white-space:nowrap}
.who{display:inline-flex; align-items:center; gap:6px; padding:0; border:0; background:none; color:var(--ink); font:600 14px var(--font-body); text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; overflow-wrap:anywhere}
.who:hover{text-decoration-color:var(--ink-2)}
.av-s{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--panel-2); font:400 12px var(--font-display); text-decoration:none; flex:none; overflow:hidden}
.av-s img{width:22px; height:22px; display:block}
.you{padding:0 6px; border-radius:3px; background:var(--gold); color:#1C2330; font-size:11px; font-weight:700; text-decoration:none}
.ctry{white-space:nowrap; color:var(--ink-2)}
.flag{font-size:16px; line-height:1; vertical-align:-1px; margin-right:6px}
.tot{display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:120px}
.tot b{font:600 14px var(--font-body)}
.tbar{display:block; width:100%; height:5px; border-radius:3px; background:var(--panel-2); overflow:hidden}
.tbar i{display:block; height:100%; background:var(--bar)}
.none{color:var(--ink-3)}
.empty{margin:14px 0 0; padding:22px 14px; border:1px dashed var(--line); border-radius:10px; text-align:center; color:var(--ink-2)}
.empty b{display:block; margin-bottom:4px; color:var(--ink); font:400 20px var(--font-display)}
.morebox{margin-top:10px; text-align:center}
/* 카드 */
.card{position:fixed; z-index:6; top:calc(var(--top) + 6px); right:max(16px, env(safe-area-inset-right)); width:min(380px, calc(100% - 32px)); max-height:calc(100% - var(--top) - 22px); overflow:auto; background:var(--panel); color:var(--ink); border-radius:12px; box-shadow:0 18px 50px -20px rgba(0,0,0,.6); padding:16px 18px 18px}
.card[hidden]{display:none}
.card-head{display:flex; align-items:center; gap:12px}
.card-head img,.card-head .av{width:44px; height:44px; border-radius:50%; background:var(--panel-2); flex:none}
.card-head .av{display:grid; place-items:center; font:400 20px var(--font-display)}
.card-head h2{margin:0; font:400 24px/1.1 var(--font-display); overflow-wrap:anywhere}
.card-head small{display:block; color:var(--ink-2); font-size:12.5px}
.x{flex:none; white-space:nowrap; margin-left:auto; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:5px 10px; cursor:pointer}
/* 카드의 한 숫자: 총 토큰을 가장 크게, 그 아래 캐시 읽기 비율을 작게(.cbig: 아래 안내 줄의 .hint.big과 이름이 겹치지 않게) */
.cbig{margin:14px 0 0; padding:12px 14px; border-radius:10px; background:var(--panel-2)}
.cbig span{display:block; font-size:12px; color:var(--ink-2)}
.cbig b{display:block; font:400 40px/1.1 var(--font-display); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.cbig small{display:block; margin-top:2px; font-size:12.5px; color:var(--ink-2)}
.cbig.bad b{font-size:26px; color:var(--ink-2)}
/* 순위 줄(R2): 굵은 첫 줄과 작은 둘째 줄 */
.rl{margin:10px 0 0; font-size:14px}
.rl b{display:block; font-weight:600}
.rl span{display:block; margin-top:2px; font-size:12.5px; color:var(--ink-2)}
.wait{margin:14px 0 0; padding:12px 14px; border-radius:10px; background:var(--panel-2); font-size:14px; font-weight:600}
.bar{display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:10px; background:var(--panel-2)}
.bar i{display:block}
.legend{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:6px; font-size:12px; color:var(--ink-2)}
.legend em{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px}
.sec{margin:16px 0 6px; font-size:13px; font-weight:600}
.floors{list-style:none; margin:0; padding:0}
.floors li{padding:8px 0; border-top:1px solid var(--line); font-size:13px}
.floors li:first-child{border-top:0}
.floors b{font-family:var(--font-mono); font-size:12px; margin-right:6px}
.floors p{margin:2px 0 0; color:var(--ink-2); font-size:12.5px}
.u{unicode-bidi:isolate}
.note{margin:12px 0 0; font-size:12px; color:var(--ink-2)}
.btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:7px; border:1px solid var(--ink); background:var(--ink); color:var(--panel); font-size:13px; font-weight:600; cursor:pointer; text-decoration:none}
.btn.ghost{background:var(--panel); color:var(--ink); border-color:var(--line)}
.btn[disabled]{opacity:.65; cursor:progress}
/* 둘러보기 */
.tour,.join{position:fixed; z-index:8; inset:0; background:rgba(5,8,14,.72); display:flex; align-items:center; justify-content:center; padding:16px}
.tour[hidden],.join[hidden]{display:none}
.tour-box,.join-box{width:min(760px, 100%); max-height:100%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:14px; padding:18px 20px}
.join-box{width:min(580px, 100%)}
.tour-box h2,.join-box h2{margin:0; font:400 26px var(--font-display); overflow-wrap:anywhere}
.join-box h2{font-size:24px; line-height:1.15}
.join-box h2 small{display:block; margin-top:3px; font:500 13px/1.3 var(--font-body); color:var(--ink-2)}
.join-box .first{margin:10px 0 0; font-size:13.5px; font-weight:600}
.join-box h2:focus{outline:none}
.tf{margin-top:14px; border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.tf h3{margin:0 0 6px; font:400 19px var(--font-display)}
.tf h3 small{font:500 12px var(--font-body); color:var(--ink-3); margin-left:6px}
.desks{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:8px}
.desk{background:var(--panel-2); border-radius:8px; padding:8px 10px; font-size:12.5px}
.desk b{display:block; font:400 16px var(--font-display)}
.st{display:inline-block; margin-top:2px; padding:0 6px; border-radius:3px; font-size:11px; font-weight:600; background:var(--line); color:var(--ink)}
.st.work{background:#FFB224; color:#1C2330}
.st.meet{background:#A68BEA; color:#1C2330}
.st.block{background:#FF6369; color:#1C2330}
.boardl{margin:8px 0 0; padding-left:18px; font-size:12.5px; color:var(--ink-2)}
/* 내 토큰 세어 보기 패널(설치 없이): 나라 고르기 → 명령 한 줄 → 복사, 나머지는 '자세히' */
.fld{display:flex; flex-direction:column; gap:4px; margin-top:14px}
.fld label,.fld .lb{font-size:13px; font-weight:600}
.fld label small{font-weight:400; color:var(--ink-2)}
.fld select,.fld input{height:38px; padding:0 10px; border-radius:7px; border:1px solid var(--ink-3); background:var(--panel); color:var(--ink); font-size:14px}
.fld .note{margin-top:2px}
.cmd{display:flex; align-items:stretch; gap:8px; margin-top:6px}
.cmd code{flex:1; min-width:0; padding:10px 12px; border-radius:8px; background:#0A0E14; color:#E4E8EE; font:500 12.5px/1.5 var(--font-mono); overflow-wrap:anywhere; -webkit-user-select:all; user-select:all}
.cmd .btn{flex:none; align-self:flex-start}
.join-box .note a{color:inherit; white-space:nowrap}
.join-box details{margin-top:12px; font-size:13px}
.join-box details summary{cursor:pointer; color:var(--ink-2)}
.join-box ol{margin:8px 0 0; padding-left:20px}
.join-box ol li{margin-top:4px}
@media (max-width:760px){
  .top{padding-top:10px}
  /* 첫 줄 [보기][언어], 둘째 줄 [나라][아이디 찾기] */
  .ctl{width:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .ctl > .seg:first-child{grid-column:1 / 3; grid-row:1}
  #langGroup{grid-column:3; grid-row:1}
  .ctl > .seg:first-child button{flex:1; justify-content:center}
  .pick{grid-column:1; grid-row:2}
  .pick select{width:100%; max-width:none}
  .find{grid-column:2 / -1; grid-row:2}
  .find input{width:100%}
  .seg .long{display:none}
  .card{top:auto; bottom:0; right:0; width:100%; max-height:58%; border-radius:14px 14px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  body.carded .zoom{bottom:calc(58% + 12px)}
  .hint{white-space:normal; width:calc(100% - 32px); text-align:center}
  .hint .wide{display:none}
  .zoom{bottom:max(92px, calc(env(safe-area-inset-bottom) + 84px))}
}
@media (min-width:761px){ .seg .short{display:none} }
/* 좁은 화면의 순위표: 표 대신 순위 · 아이디와 나라 · 총 토큰(U-40: 칸은 이 넷뿐이에요) */
@media (max-width:620px){
  .plate{font-size:22px}
  .rank thead tr{display:flex; justify-content:flex-end; gap:14px; border-bottom:1px solid var(--line)}
  .rank thead th{border:0}
  .rank thead th:not(.r){display:none}
  .rank, .rank tbody, .rank thead{display:block}
  .rank tbody tr{display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"rk who tot" "rk ctry tot"; gap:2px 10px; padding:9px 4px; border-bottom:1px solid var(--line)}
  .rank tbody tr.gap,.rank tbody tr.sep{display:block; padding:2px 4px; border-bottom:0}
  .rank tbody tr.sep{padding-top:14px}
  .rank td{padding:0; border:0}
  .rank td.c-rk{grid-area:rk; align-self:center}
  .rank td.c-who{grid-area:who}
  .rank td.c-ctry{grid-area:ctry; font-size:12px}
  .rank td.c-tot{grid-area:tot; align-self:center}
  .rank tr.me{background:var(--me)}
  .rank tr.me td{background:none}
  .tot{min-width:0}
  .tbar{display:none}
  .cmd{flex-direction:column}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<header class="top" id="top">
  <h1 class="plate" data-t="title">에이전시티 도시</h1>
  <span class="chip" id="count" role="status"></span>
  <span class="sp"></span>
  <a class="chip" id="home" href="./" hidden data-t="home">← 내 사무실</a>
  <a class="chip" id="build" href="./?setup=city" hidden data-t="build">내 건물 세우기 →</a>
  <button type="button" class="chip cta visit-only" data-act="join" data-t="countMine">내 토큰 세어 보기</button>
  <div class="ctl">
    <div class="seg" role="group" id="viewGroup">
      <button type="button" data-view="buildings" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V7l3-2v9M7 14V2l4 2v10M13 14V8h1v6M1 14.5h14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span data-t="viewCity">빌딩</span></button>
      <button type="button" data-view="numbers" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h2M6 3h8M2 8h2M6 8h6M2 13h2M6 13h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-t="viewNum">숫자</span></button>
    </div>
    <label class="pick"><span class="sr" data-t="country">나라</span><select id="ctry"></select></label>
    <form class="find" id="find" role="search" autocomplete="off"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><label class="sr" for="findQ" data-t="findL">아이디 찾기</label><input type="search" id="findQ" list="findList" enterkeyhint="search" spellcheck="false" autocapitalize="off" autocorrect="off" maxlength="40"><datalist id="findList"></datalist></form>
    <div class="seg" role="group" id="langGroup">
      <button type="button" data-lang="ko" lang="ko" aria-pressed="true"><span class="long">한국어</span><span class="short">한</span></button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false"><span class="long">English</span><span class="short">EN</span></button>
    </div>
  </div>
</header>
<div id="stage"><svg id="city" role="group"></svg></div>
<div class="msg" id="msg" hidden></div>
<div class="zoom" id="zoom"><button type="button" id="zin">+</button><button type="button" id="zout">−</button><button type="button" id="zfit">⌂</button></div>
<p class="hint" id="hint"></p>
<section class="numbers" id="numbers" hidden aria-labelledby="numH">
  <div class="num-box">
    <header class="num-head"><h2 id="numH" tabindex="-1" data-t="numTitle">순위</h2><p id="numSub"></p><p id="numRule"></p><p class="self" id="numSelf"></p></header>
    <div class="few" id="few" hidden></div>
    <div class="tiles" id="tiles"></div>
    <div id="table"></div>
    <p class="num-foot visit-only" id="numFoot"></p>
  </div>
</section>
<aside class="card" id="card" hidden aria-live="polite"></aside>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tourTitle"><div class="tour-box" id="tourBox"></div></div>
<div class="join" id="join" hidden role="dialog" aria-modal="true" aria-labelledby="joinH"><div class="join-box" id="joinBox"></div></div>
<p class="sr" id="live" role="status" aria-live="polite"></p>

// 명단(members.json). fresh면 주소에 ?t=를 붙여 중간 캐시(GitHub Pages는 10분)도 피해요: 참가 처리 중일 때 다시 읽을 때만 써요.

async function loadOne(m) {

  let meter = null, office = null;
  try { meter = cleanMeter(JSON.parse(await getCapped(raw + CONFIG.meterFile)), m.login); } catch (e) {}

// 'n번째 시민': 명단에 들어온 순서(members.json의 joinedAt, 없으면 명단 순서). gist를 고쳐도 바뀌지 않아요.

  const at = m => { const v = Date.parse(m && m.joinedAt); return Number.isFinite(v) ? v : Infinity; };
  citizens = new Map(list.map((m, i) => [m, i]).sort((a, b) => (at(a[0]) - at(b[0])) || (a[1] - b[1])).map(([m], k) => [String(m.login).toLowerCase(), k + 1]));
}
// onPerson: 한 사람씩 도착할 때마다 불러요(먼저 온 건물부터 그려요).
async function loadMembers(onPerson) {
  if (DEMO) {
    const doc = JSON.parse(await getCapped('examples/city/demo.json'));
    const ppl = (Array.isArray(doc.people) ? doc.people : []).slice(0, 200).filter(p => p && typeof p.login === 'string' && LOGIN_RE.test(p.login));
    setCitizens(ppl);
    for (const p of ppl) {
      const meter = cleanMeter(p.meter, p.login);
      if (meter) onPerson({ login: p.login, demo: true, meter, office: cleanOffice(p.office, p.login) });
    }
    return { listed: ppl.length, failed: 0, logins: ppl.map(p => p.login.toLowerCase()) };
  }
  const list = await readList(false);
  setCitizens(list);
  let i = 0, failed = 0;
  const stopAt = Date.now() + DEADLINE;
  async function worker() {
    while (i < list.length && Date.now() < stopAt) {
      const one = await loadOne(list[i++]);
      if (one) onPerson(one); else failed++;
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONC, list.length) }, worker));
  return { listed: list.length, failed, cut: Math.max(0, list.length - i), logins: list.map(m => m.login.toLowerCase()) };
}

/* ---------- 숫자 ---------- */
// 순위도 건물 높이도 총 토큰 한 숫자예요(U-40). 캐시 읽기는 카드에 '그중 캐시 읽기 x%'로만 따로 보여요.

// 높이(층 단위, 반올림하지 않아요) = (log10(총 토큰) − 5) × 5, 1~40층. 1~40층 안에서는 총 토큰이 더 많으면 더 높아요(가장 높은 건물이 1등).

function dayKey(d, tz) {

}

const rtf = () => new Intl.RelativeTimeFormat(lang, { numeric: 'auto' });
// 마지막으로 올린 때: 1시간 안이면 '방금', 하루 안이면 n시간 전, 그다음은 달력으로 어제·n일 전

const dayRel = iso => { const d = daysAgo(iso); return d < 0 ? t().unknown : rtf().format(-d, 'day'); };

function ranked(list, key) {

  let r = 0;

}
const isMe = p => !!CONFIG.me && CONFIG.me.toLowerCase() === p.login.toLowerCase();
// '나': 내 컴퓨터의 앱(127.0.0.1)은 org.json의 city.me나 앱에 로그인한 아이디예요. 그게 없으면 이 브라우저에 기억한 아이디예요.
// 브라우저에는 참가 명령이 여는 주소(?who=<아이디>#me)로만 기억해요. 처음 열 때 기억하고 주소에서 #me만 지워요(?who=는 둬요).
// 공유 주소(?who=<아이디>)에는 #me가 없어서, 남의 공유 링크를 열어도 '나'는 바뀌지 않아요.
let meFrom = '';   // 'local' | 'browser' | ''
function takeMe() {
  let mine = '';

  if (location.hash === '#me') {
    if (LOGIN_RE.test(who)) { mine = who; try { localStorage.setItem(ME_KEY, who); } catch (e) {} }
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
  }
  if (!mine) try { const v = localStorage.getItem(ME_KEY); if (typeof v === 'string' && LOGIN_RE.test(v)) mine = v; } catch (e) {}

}
// '내가 아니에요': 이 브라우저에 기억한 '나'를 지워요(앱의 '나'는 그대로).
// 다른 탭이 그사이 다른 '나'를 기억했으면(저장된 값이 이 탭의 '나'와 다르면) 그 기억은 지우지 않아요.
function forgetMe() {

// 공유 주소: ?who=<아이디>만(#me는 절대 넣지 않아요)
const shareURL = login => `${PUBLIC_URL}?who=${encodeURIComponent(login)}${lang === 'en' ? '&lang=en' : ''}`;

/* ---------- 나라 구역 ---------- */
let people = [], ZONES = [], zone = 'ALL', view = params.get('view') === 'numbers' ? 'numbers' : 'buildings', shown = PAGE;
let okN = 0, okIn = new Map();   // 확인된 사람 수(전체, 나라마다)
const inZone = p => zone === 'ALL' || p.c === zone;
// 순위(전체·나라 안)와 구역: 총 토큰 합이 큰 나라부터(뒤쪽). '나라 안 고름'은 늘 맨 끝(가장자리)이고, 사람이 있는 나라만 구역이 생겨요.
// 순위는 확인된 사람끼리만 매겨요(확인 안 됨은 rankAll·rankIn이 null). 나라 합에도 넣지 않아요.
function rerank() {
  const ok = people.filter(p => p.ok);
  okN = ok.length;
  for (const p of people) { p.rankAll = null; p.rankIn = null; }
  ranked(ok, p => p.total).forEach(x => { x.p.rankAll = x.r; });
  const by = new Map();
  for (const p of people) { if (!by.has(p.c)) by.set(p.c, []); by.get(p.c).push(p); }
  okIn = new Map();
  for (const [c, list] of by) {
    const mine = list.filter(p => p.ok);
    okIn.set(c, mine.length);
    if (c) ranked(mine, p => p.total).forEach(x => { x.p.rankIn = x.r; });
  }
  ZONES = [...by.entries()].map(([c, list]) => ({ c, list, sum: list.reduce((a, p) => a + (p.ok ? p.total : 0), 0) }))
    .sort((a, b) => (a.c === '') - (b.c === '') || b.sum - a.sum || a.c.localeCompare(b.c));
}
const topPct = (n, N) => Math.max(1, Math.ceil(n * 100 / N));   // 상위 x%: 1등이 100명 중이면 1%, 20명 중이면 5%
// 순위 줄(결재 R2). 확인된 사람이 20명부터: '세계 n등 · N명 중 · 상위 x%'와(그 나라 5명부터) '<나라> m등 · M명 중'.

function rankLines(p) {
  if (!p.ok || !p.rankAll) return null;
  const M = p.c ? (okIn.get(p.c) || 0) : 0, byC = M >= COUNTRY_FROM && p.rankIn;
  const ctry = byC ? t().rankC(p.rankIn, cname(p.c), M) : '', wait = p.c && !byC ? t().ctryFrom(COUNTRY_FROM) : '';
  if (okN >= RANK_FROM) return { head: [t().rankW(p.rankAll, okN, topPct(p.rankAll, okN)), ctry].filter(Boolean), tail: [wait].filter(Boolean), rule: wait };
  const k = citizens.get(p.login.toLowerCase()), best = bestDay(p.meter);
  return { head: [k ? t().citizen(k) : '', best ? t().best(fmt(best)) : '', t().days(activeDays(p.meter))].filter(Boolean),
    tail: [t().rankFew(p.rankAll, okN), ctry || wait].filter(Boolean), rule: wait };

/* ---------- 그리기 (아이소메트릭 SVG, 나라마다 바닥 구역 하나) ---------- */
const A = 30, B = 15, FLOOR_H = 13, CELL = 6, ROAD = 8;   // 타일 반너비·반높이, 한 층 높이, 자리 간격(가장 넓은 4칸 + 길 2칸), 구역 사이 길(이름판 자리)

function layout() {

  const span = kMax * CELL + ROAD;

    z.k = k; z.x = (i % cols) * span; z.y = Math.floor(i / cols) * span;

    for (let y = top + 12; y + 11 < GROUND - 6; y += 20) for (let wx = x + 10; wx + 9 <= x + w - 8; wx += 18) {

    }
  };
  const MX = 870, MW = 104;
  ctx.globalAlpha = 0.55;
  let bx = 16 + Math.round(rnd() * 20);
  while (bx < W - 40) {
    const w = 54 + Math.round(rnd() * 42), h = 36 + Math.round(rnd() * 56), hue = Math.floor(rnd() * 360);
    if (bx + w * 1.28 < MX - 14 || bx > MX + MW * 1.28 + 14) block(bx, w, h, [hue, 22, 38], false);
    bx += Math.round(w * 1.28) + 14 + Math.round(rnd() * 16);

  block(MX, MW, Math.round(90 + (Math.max(1, Math.min(40, a.height)) - 1) / 39 * 240), [hh % 360, 22 + (hh >>> 9) % 18, 42 + (hh >>> 17) % 12], true);

  write(a.site, X, 1052, R - X, 28, 18, sz => `500 ${sz}px ${FONT_M}`, '#F4C35A');

  ctx.font = disp(36);

  ctx.fill(); ctx.strokeStyle = '#3A4659'; ctx.lineWidth = 3; ctx.stroke();
  write(a.title, X + 22, 107, pw - 44, 36, 24, disp, '#F3F5F8');
  ctx.textAlign = 'right';
  write(a.date, R, 105, R - X - pw - 24, 28, 18, body(500), '#C8D0DC');
  ctx.textAlign = 'left';
  // 아바타(동그랗게, 금빛 테)와 아이디·나라
  const cx = X + 80, cy = 250, r = 80;

  ctx.restore();
  ctx.strokeStyle = '#F4C35A'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.stroke();
  const lx = X + 2 * r + 40;
  write(a.login, lx, a.place ? 248 : 276, R - lx, 76, 36, disp, '#F3F5F8');
  if (a.place) write(a.place, lx, 304, R - lx, 32, 20, body(500), '#C8D0DC');
  // 총 토큰(가장 크게)과 그중 캐시 읽기
  write(a.label, X, 400, R - X, 30, 20, body(600), '#F4C35A');
  write(a.total, X, 560, R - X, 180, 72, disp, '#F3F5F8');
  write(a.cache, X, 614, MX - 40 - X, 32, 20, body(500), '#C8D0DC');
  // 순위 줄: 굵은 조각은 한 줄에 하나씩(첫 줄은 금빛), 작은 줄은 그 아래. 내 건물 왼쪽까지만 써요.
  let y = 688;
  a.head.forEach((h, i) => { write(h, X, y, MX - 40 - X, 42, 22, body(700), i ? '#F3F5F8' : '#F4C35A'); y += 54; });
  if (a.tail) write(a.tail, X, y - 6, MX - 40 - X, 30, 18, body(500), '#9AA5B5');
}
// 아바타: 화면의 img는 crossOrigin이 없어 쓰지 않고 새로 받아요. GitHub 아바타 서버가 CORS를 허락해서 그림을 저장할 수 있어요.
// 못 받거나(막힘·오류·시간 초과) 비어 있으면 null → 첫 글자로 그려요.
const AVATAR_URL = login => `https://avatars.githubusercontent.com/${encodeURIComponent(login)}?s=320`;
function loadAvatar(login, wait = 6000) {
  return new Promise(res => {
    let done = false, tm = 0;
    const end = v => { if (done) return; done = true; clearTimeout(tm); res(v); };
    try {
      const im = new Image();
      im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer'; im.decoding = 'async';
      im.onload = () => end(im.naturalWidth > 0 ? im : null);
      im.onerror = () => end(null);
      tm = setTimeout(() => end(null), wait);
      im.src = AVATAR_URL(login);
    } catch (e) { end(null); }
  });
}
// 웹 글꼴을 그 글자만큼 먼저 받아요(3초까지 기다리고, 못 받으면 기기 글꼴로 그려요).
function artFonts(a) {
  try {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const text = [a.title, a.date, a.login, a.letter, a.place, a.label, a.total, a.cache, ...a.head, a.tail, a.self, a.site].join(' ');
    const all = Promise.all([`400 120px ${FONT_D}`, `500 30px ${FONT_B}`, `600 30px ${FONT_B}`, `700 42px ${FONT_B}`, `500 28px ${FONT_M}`]
      .map(f => document.fonts.load(f, text).catch(() => null)));
    let tm = 0;
    return Promise.race([all, new Promise(r => { tm = setTimeout(r, 3000); })]).finally(() => clearTimeout(tm));
  } catch (e) { return Promise.resolve(); }
}
// PNG 만들기. 아바타 때문에 canvas가 막히면(toBlob 보안 오류) 새 canvas에 첫 글자로 다시 그려요.
async function makePNG(a, noAvatar) {
  const [img] = await Promise.all([noAvatar ? null : loadAvatar(a.login), artFonts(a)]);
  const paint = im => new Promise(res => {
    try {
      const cv = document.createElement('canvas');
      cv.width = ART; cv.height = ART;
      drawArt(cv.getContext('2d'), a, im);
      cv.toBlob(b => res(b || null), 'image/png');
    } catch (e) { res(null); }
  });
  return (await paint(img)) || (img ? await paint(null) : null);
}
// 미리 만들기: 폰의 공유 창은 누른 그 순간에 열어야 해서(기다린 뒤에 부르면 막혀요) '나'의 카드를 열 때 만들어 둬요.
// 그릴 글이 같으면 다시 만들지 않아요(언어·순위가 바뀌면 새로).
let artJob = null;   // { key, blob, promise }
function prepArt(p) {
  const a = cardArt(p);
  if (!a) return null;
  const key = JSON.stringify(a);
  if (artJob && artJob.key === key) return artJob;
  const job = { key, blob: null, promise: null };
  job.promise = makePNG(a, !!p.demo).then(b => (job.blob = b), () => null);   // 예시 사람은 진짜 아이디가 아니라 아바타를 받지 않아요
  return (artJob = job);
}
// 폰에서 파일 공유가 되면 공유 창, 아니면 내려받기. 'shared' | 'saved' | 'cancel'
function deliver(blob, name) {
  let file = null, can = false;
  try { file = new File([blob], name, { type: 'image/png' }); } catch (e) {}
  try { can = !!(file && matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
  if (can) return navigator.share({ files: [file] }).then(() => 'shared', e => { if (e && e.name === 'AbortError') return 'cancel'; download(blob, name); return 'saved'; });
  download(blob, name);
  return Promise.resolve('saved');
}
function download(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
}
async function saveCard(p, btn) {
  if (btn.disabled) return;
  const job = prepArt(p);
  if (!job) return;
  const name = `agencity-${p.login}.png`;
  let res = 'fail';
  try {
    if (job.blob) res = await deliver(job.blob, name);   // 다 만들어 뒀으면 기다리지 않고 바로(공유 창이 막히지 않게)
    else {
      btn.disabled = true; btn.textContent = t().saving;
      const b = await job.promise;
      if (b) res = await deliver(b, name);
    }
  } catch (e) { res = 'fail'; }
  const say = res === 'saved' ? t().saved : res === 'fail' ? t().saveFail : '';
  if (btn.isConnected) {
    btn.disabled = false; btn.textContent = say || t().saveCard;
    if (say) setTimeout(() => { if (btn.isConnected) btn.textContent = t().saveCard; }, 1800);
  }
  if (say) $('#live').textContent = say;
}

// 그사이 다른 카드를 열었으면 그 카드를 덮지 않아요: 들어오면 도시에만 세우고(카드는 그대로), 10분이 지나면 조용히 멈춰요.

}
function stopWait() { if (wait && wait.timer) clearTimeout(wait.timer); wait = null; }
const waitShown = () => !$('#card').hidden && $('#card').dataset.kind === 'wait';
async function pollWait() {
  const w = wait;
  if (!w) return;
  w.timer = 0;
  let got = null;
  try { got = await findJoined(w.login); } catch (e) {}
  if (wait !== w) return;   // 그사이 닫았어요
  if (got) { wait = null; joined(got, waitShown()); return; }
  if (Date.now() - w.since >= POLL_FOR) { if (waitShown()) { w.late = true; waitCard(); } else wait = null; return; }
  w.timer = setTimeout(pollWait, POLL_MS);
}
// 명단을 새로 읽어 그 아이디가 있으면 gist까지 읽어요(못 읽으면 null, 다음에 또 봐요)

}
function closeJoin() { $('#join').hidden = true; if (joinFrom && joinFrom.isConnected) joinFrom.focus(); }

/* ---------- 바꾸기: 보기·나라·언어 ---------- */
let loaded = false, loadState = { failed: 0, cut: 0, error: false };
function syncURL() {
  try {
    const q = new URLSearchParams(location.search);
    if (view === 'numbers') q.set('view', 'numbers'); else q.delete('view');
    if (zone === 'ALL') q.delete('country'); else q.set('country', zone || 'none');
    const s = q.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
}
function setView(v, announce = true) {
  view = v;
  $$('#viewGroup button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  $('#numbers').hidden = v !== 'numbers';
  document.body.classList.toggle('numview', v === 'numbers');   // 숫자 보기에서는 위 막대 자리에 불투명 띠
  $('#stage').setAttribute('aria-hidden', String(v === 'numbers'));
  refreshChrome();
  scheduleTags();   // 빌딩 보기로 오면 안내 줄·확대 단추가 다시 보여요: 이름판 자리를 그에 맞춰 다시 잡아요
  if (v === 'numbers') drawNumbers();
  if (selected) card(selected);
  syncURL();
  if (announce) $('#live').textContent = v === 'numbers' ? t().toldNum(people.filter(inZone).length) : t().toldCity;
  if (v === 'numbers' && announce && !selected) $('#numH').focus({ preventScroll: true });
}
function setZone(c, announce = true) {
  zone = c;
  shown = PAGE;
  ctryOptions();
  applySel();
  fit();   // 숫자 보기에서 바꿔도 지도를 그 나라에 맞춰 둬요(빌딩 보기로 돌아오면 고른 나라가 보이게)
  if (view === 'numbers') drawNumbers();
  refreshChrome();
  syncURL();
  if (announce) $('#live').textContent = t().toldZone(zone === 'ALL' ? t().all : cname(zone), zone === 'ALL');
}
function ctryOptions() {
  const known = zone === 'ALL' || ZONES.some(z => z.c === zone);
  const sel = $('#ctry');
  sel.innerHTML = `<option value="ALL">${esc(t().all)} (${people.length})</option>` + ZONES.map(z => `<option value="${esc(z.c)}">${flag(z.c)} ${esc(cname(z.c))} (${z.list.length})</option>`).join('')
    + (known ? '' : `<option value="${esc(zone)}">${flag(zone)} ${esc(cname(zone))} (0)</option>`);
  sel.value = zone;
}
// 위 막대의 개수, 아래 안내, 가운데 알림, 확대 버튼: 보기와 사람 수에 맞춰요
function refreshChrome() {
  const nc = ZONES.filter(z => z.c).length;
  const extra = [loadState.failed ? t().failedN(loadState.failed) : '', loadState.cut ? t().cutN(loadState.cut) : '', DEMO ? t().demo : ''].filter(Boolean).join(' · ');
  const cnt = $('#count');
  if (loadState.error) cnt.textContent = t().loadFail;
  else if (!people.length && !loaded) cnt.textContent = t().loading;
  else cnt.innerHTML = t().count(people.length) + (nc ? t().countC(nc) : '') + (loaded ? '' : esc(t().loadingTail)) + (extra ? ' · ' + esc(extra) : '');
  cnt.classList.toggle('warn', loadState.error || !!loadState.failed || !!loadState.cut);
  if ($('#ctry').options.length !== ZONES.length + 1 || !loaded) ctryOptions();
  const h = $('#hint'), few = loaded && people.length <= FEW && !loadState.error;
  h.hidden = view !== 'buildings';
  h.classList.toggle('big', few);
  // 에이전시티(사무실) 설치는 공개 도시에서 이 줄 끝에만 작게 둬요(U-40: 첫 단추는 '내 토큰 세어 보기'). 사람이 적을 때도 같아요.
  const rules = `<a href="${VISION_URL}" target="_blank" rel="noopener">${esc(t().rules)}</a>${!LOCAL ? ` · <a href="${INSTALL_URL}" target="_blank" rel="noopener">${esc(t().install)}</a>` : ''}`;
  h.innerHTML = few ? `${esc(t().few(people.length))}${canJoin() ? ' · ' + joinBtn('go', t().join) : ''} · <small>${rules}</small>`
    : `<span class="wide">${esc(t().hint)} · ${nc ? esc(t().hintZone) + ' · ' : ''}</span>${!LOCAL ? `<span class="wide">${esc(t().noInstall)} </span>${joinBtn('go', t().join)} · ` : ''}${rules}`;
  $('#zoom').hidden = view !== 'buildings';
  // 가운데 알림: 고른 나라에 아무도 없을 때(주소로 들어온 경우)
  const m = $('#msg');
  if (m.dataset.kind !== 'load') {
    const none = loaded && people.length && zone !== 'ALL' && !ZONES.some(z => z.c === zone);
    m.hidden = !none || view !== 'buildings';
    if (none) { m.dataset.kind = 'zone'; m.innerHTML = `<h2>${esc(t().emptyC)}</h2><p>${joinBtn('go', t().firstB)}</p>`; }
  }
  document.documentElement.style.setProperty('--top', topH() + 'px');
}
function staticText() {
  document.documentElement.lang = lang;
  document.title = t().docTitle;
  $$('[data-t]').forEach(n => { const v = t()[n.dataset.t]; if (typeof v === 'string') n.textContent = v; });
  $('#viewGroup').setAttribute('aria-label', t().viewGroup);
  $('#langGroup').setAttribute('aria-label', t().langGroup);
  $('#stage').setAttribute('aria-label', t().map);
  $('#zin').setAttribute('aria-label', t().zin); $('#zout').setAttribute('aria-label', t().zout); $('#zfit').setAttribute('aria-label', t().zfit);
  $('#findQ').placeholder = t().findPh;
  $$('#langGroup button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
let msgArgs = null;   // 불러오기 알림(언어를 바꾸면 다시 써요)
function message(kind) {
  msgArgs = kind;
  const m = $('#msg');
  m.dataset.kind = 'load';
  const [title, body, html] = kind.k === 'noLoad' ? [t().noLoad, t().noLoadB(kind.n)] : kind.k === 'listFail' ? [t().listFail, t().listFailB]
    : [t().none, '', LOCAL ? (kind.missing ? `<a class="go" href="./?setup=city">${esc(t().noneLocal)}</a>` : '') : `${esc(t().noInstall)} ${joinBtn('go', t().join)}`];
  m.innerHTML = `<h2>${esc(title)}</h2><p>${html || esc(body || t().noneB)}</p>`;
  m.hidden = false;
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  staticText();
  if (people.length) draw();
  ctryOptions();
  refreshChrome();
  if (view === 'numbers') drawNumbers();
  if (msgArgs) message(msgArgs);
  const kind = $('#card').hidden ? '' : $('#card').dataset.kind;
  if (selected) card(selected, false);
  else if (kind === 'wait') waitCard();
  else if (kind === 'miss') findWho($('#findQ').value);
  if (tourOf) tour(tourOf);
  if (!$('#join').hidden) openJoin();
}

/* ---------- 조작: 끌기·핀치·누르기 ---------- */
const stage = $('#stage');
const ptrs = new Map();
let drag = null, pinch = null, wasMove = false;
const findPerson = target => { const n = target && target.closest && target.closest('[data-login]'); return n ? people.find(x => x.login === n.dataset.login) : null; };
const findZone = target => { const n = target && target.closest && target.closest('[data-zone]'); return n ? n.dataset.zone : null; };
stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { stage.setPointerCapture(e.pointerId); } catch (x) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: pan.x, vy: pan.y, slop: e.pointerType === 'mouse' ? 4 : 10 }; wasMove = false; }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null; wasMove = true;
  }
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  if (e.pointerType === 'mouse' && !(e.buttons & 1)) { endPtr(e); return; }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pan.x += mx - pinch.mx; pan.y += my - pinch.my;
    zoomAt(d / pinch.d, mx, my);
    pinch = { d, mx, my };
    return;
  }
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!wasMove && Math.hypot(dx, dy) < drag.slop) return;
  if (!wasMove) stage.classList.add('drag');
  wasMove = true; moved = true;
  pan.x = drag.vx + dx; pan.y = drag.vy + dy; applyView();
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && e.pointerId === drag.id) drag = null;
  if (!ptrs.size) stage.classList.remove('drag');
}
stage.addEventListener('pointerup', e => {
  const tap = drag && e.pointerId === drag.id && !wasMove && ptrs.size === 1;
  endPtr(e);
  if (!tap) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY), zc = findZone(hit), p = findPerson(hit);
  if (zc !== null) setZone(zc);
  else if (p) card(p);
  else if (!$('#card').hidden) closeCard();
});
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('lostpointercapture', e => { if (ptrs.has(e.pointerId)) endPtr(e); });
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
$('#zin').addEventListener('click', () => zoomAt(1.25, innerWidth / 2, innerHeight / 2));
$('#zout').addEventListener('click', () => zoomAt(0.8, innerWidth / 2, innerHeight / 2));
$('#zfit').addEventListener('click', () => fit());
svg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const zc = findZone(e.target);
  if (zc !== null) { e.preventDefault(); setZone(zc); return; }
  const p = findPerson(e.target);
  if (p) { e.preventDefault(); card(p); }
});
// 키보드로 건물에 오면 그 건물이 화면에 보이게
svg.addEventListener('focusin', e => {
  const p = findPerson(e.target);
  if (!p || !p.box) return;
  const W = svg.clientWidth || innerWidth, H = svg.clientHeight || innerHeight;
  const sx = p.box.cx * pan.k + pan.x, sy = ((p.box.top + p.box.maxY) / 2) * pan.k + pan.y;
  if (sx < 40 || sx > W - 40 || sy < 80 || sy > H - 60) { pan.x += W / 2 - sx; pan.y += H / 2 - sy; moved = true; applyView(); }
});
$('#viewGroup').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b && b.dataset.view !== view) setView(b.dataset.view); });
$('#langGroup').addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); });
$('#ctry').addEventListener('change', e => setZone(e.target.value));
$('#numbers').addEventListener('click', e => {
  const b = e.target.closest('.who'); if (b) { const p = people.find(x => x.login === b.dataset.login); if (p) card(p); }
});
$('#card').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  const p = people.find(x => x.login === b.dataset.pick); if (p) { centerOn(p); card(p); }
});
$('#find').addEventListener('submit', e => { e.preventDefault(); findWho($('#findQ').value); });
$('#findQ').addEventListener('change', e => { if (people.some(p => p.login === e.target.value)) findWho(e.target.value); });   // 목록에서 고르면 바로
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'join') openJoin();
  else if (a.dataset.act === 'join-x') closeJoin();
  else if (a.dataset.act === 'more') { shown += PAGE; drawNumbers(); }
  else if (a.dataset.act === 'not-me') notMe();
  else if (a.dataset.act === 'wait-again' && wait) waitFor(wait.login);
});
$('#join').addEventListener('click', e => { if (e.target.id === 'join') closeJoin(); });
// 창 안에서만 Tab이 돌아요(둘러보기·내 토큰 세어 보기)
function trap(box, e) {
  const f = [...box.querySelectorAll('button, a[href], select, input, summary')].filter(x => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !$('#join').hidden) { trap($('#joinBox'), e); return; }
  if (e.key === 'Tab' && !$('#tour').hidden) { trap($('#tourBox'), e); return; }
  if (e.key !== 'Escape') return;
  if (!$('#join').hidden) { closeJoin(); return; }
  if (!$('#tour').hidden) { closeTour(); return; }
  if (!$('#card').hidden) closeCard();
});
$('#tour').addEventListener('click', e => { if (e.target.id === 'tour') closeTour(); });
// 다른 탭에서 '나'를 바꾸거나 지우면(storage 이벤트) 이 탭도 따라가요: 내 줄 강조·카드 단추를 다시 그려요
addEventListener('storage', e => {
  if (e.key !== ME_KEY && e.key !== null) return;
  let v = '';
  try { v = localStorage.getItem(ME_KEY) || ''; } catch (x) {}
  if (!meChanged(v)) return;
  if (selected) card(selected, false, false);
  else if (view === 'numbers') drawNumbers();
});
// 창 크기가 바뀌면: 직접 움직이지 않았으면 다시 맞추고, 움직였으면 가운데 있던 곳을 그대로 가운데에
let lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  document.documentElement.style.setProperty('--top', topH() + 'px');
  if (!bounds) return;
  if (!moved) fit();
  else { pan.x += (innerWidth - lastW) / 2; pan.y += (innerHeight - lastH) / 2; applyView(); }
  lastW = innerWidth; lastH = innerHeight;
});
// 위 막대 높이가 다른 일로 바뀌어도(글꼴이 늦게 바뀌어 줄이 다시 접힐 때 등) --top과 이름판 자리를 따라 고쳐요.
// 순위표(.numbers)와 카드가 --top에 기대고 있어서, 낡은 값이면 순위표 윗줄이 띠 밑에 가리거나 띠와 순위표 사이로 지도가 보여요.
function syncTop() { document.documentElement.style.setProperty('--top', topH() + 'px'); scheduleTags(); }
if (window.ResizeObserver) new ResizeObserver(syncTop).observe($('#top'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTop, () => {});

/* ---------- 시작 ---------- */
// 한 사람: 총 토큰(순위·높이), 확인됐는지(ok, 숫자 거르기), 나라. 확인 안 됨은 가장 낮은 회색 건물이에요.
function addPerson(m) {
  const h = hash(m.login), total = totalOf(m.meter), ok = m.meter.ok !== false, height = heightOf(total, ok);
  people.push(Object.assign(m, { total, ok, height, floors: Math.max(1, Math.round(height)), c: m.office ? m.office.country : '',
    recent: recentDays(m.meter), stale: daysAgo(m.meter.updatedAt),
    size: Math.max(2, Math.min(4, 2 + Math.floor(activeDays(m.meter) / 120))), hsl: ok ? [h % 360, 22 + (h >>> 9) % 18, 42 + (h >>> 17) % 12] : [h % 360, 4, 34] }));
  scheduleDraw();   // 순위표도 거기서(순위를 다시 매긴 뒤에) 그려요
}
// 주소의 나라: ?country=all|none|KR (목록에 없는 코드여도 '아직 이 나라에는 건물이 없어요'를 보여 줘요)
const qc = (params.get('country') || '').toUpperCase();
const askedZone = !!qc;
if (qc) zone = qc === 'ALL' ? 'ALL' : qc === 'NONE' ? '' : COUNTRY_RE.test(qc) ? qc : 'ALL';
const browserMe = takeMe();   // 주소의 #me는 여기서 바로 지워요(아래 syncURL보다 먼저)
staticText();
setView(view, false);
refreshChrome();
(async () => {
  // 로컬 사무실 서버라면 org.json의 city 설정(registry, me)을 써요. 공개 도시·정적 호스팅이면 읽지 않고 그냥 기본값.
  if (LOCAL) try {
    const org = JSON.parse(await getCapped('org.json', MAX_BYTES, true));
    if (org && org.city && typeof org.city === 'object') {
      if (typeof org.city.registry === 'string' && /^https:\/\//.test(org.city.registry)) CONFIG.registry = org.city.registry;
      if (typeof org.city.me === 'string' && LOGIN_RE.test(org.city.me)) CONFIG.me = org.city.me;
    }
    $('#home').hidden = false;
  } catch (e) {}
  // 이 맥의 사무실에 GitHub로 로그인했으면 그 아이디(서버가 알려 줘요). 명단에 없으면 설정 → 도시(내 건물 세우기)로 이어 줘요.
  let me = '';
  if (LOCAL && !DEMO) try {
    const st = JSON.parse(await getCapped('api/state', MAX_BYTES, true));
    if (st && typeof st.github === 'string' && LOGIN_RE.test(st.github)) { me = st.github; if (!CONFIG.me) CONFIG.me = me; }
  } catch (e) {}
  // 앱의 '나'가 있으면 그게 앞서요. 없으면 이 브라우저에 기억한 '나'(공개 도시에서도 내 줄 강조·공유·내 나라부터 열기)
  if (CONFIG.me) meFrom = 'local';
  else if (browserMe) { CONFIG.me = browserMe; meFrom = 'browser'; }
  meReady = true;
  await loadCountries();
  try {
    const res = await loadMembers(addPerson);
    loaded = true;
    loadState = { failed: res.failed, cut: res.cut || 0, error: false };
    const missing = !!me && !res.logins.includes(me.toLowerCase());
    if (missing) $('#build').hidden = false;
    meMissing = missing || (LOCAL && !me);   // 앱에서 아직 GitHub에 로그인하지 않았으면 설정 → 도시로 이어 줘요
    await new Promise(r => requestAnimationFrame(r));   // 한 사람씩 그리던 것(scheduleDraw)이 먼저 끝나게: 아래 맞춤(?who, 내 나라)을 덮어쓰지 않게
    rerank();
    fillFind();
    // ?who=<아이디>가 명단에 아직 없으면 참가 처리 중(명단에 있는데 숫자를 못 읽은 사람은 아니에요)
    const want = params.get('who') || '';
    const pending = LOGIN_RE.test(want) && !res.logins.includes(want.toLowerCase());
    if (!people.length) {
      refreshChrome();
      message(res.listed ? { k: 'noLoad', n: res.listed } : { k: 'none', missing });
      if (pending) waitFor(want);
      return;
    }
    // 휴대폰은 도시 전체가 너무 작아서 내 나라 구역부터 열어요(나라를 고르지 않은 방문자는 전체). 위의 나라 고르기로 '모든 나라'를 볼 수 있어요.
    // 주소에 ?who=가 있으면(남의 공유 링크) 그 사람을 보러 온 거라 내 나라로 바꾸지 않아요.
    const mine = people.find(isMe);
    if (!askedZone && !want && narrow() && people.length > FEW && mine && mine.c) zone = mine.c;
    layout(); draw();
    ctryOptions();
    refreshChrome();
    if (view === 'numbers') drawNumbers();
    const p = want && people.find(x => x.login.toLowerCase() === want.toLowerCase());
    if (!moved) fit(p || undefined);
    if (p) card(p);
    else if (pending) waitFor(want);
  } catch (e) {
    loaded = true;
    loadState = { failed: 0, cut: 0, error: true };
    refreshChrome();
    message({ k: 'listFail' });
  }
})();
})();
</script>
