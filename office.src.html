<title>에이전시티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 층 고르기 + 고른 층 하나의 사무실: 머리말 → 층 고르기 → 알림 → 장면 + 팀원 → 회의실·업무판·활동 기록 → 서류함 → 팀 간 대화.
   틀은 장면에 맞춰 각진 모서리, 돌·흑연색, 글꼴은 이 기기의 시스템 글꼴 하나예요. 고른 층은 주소 끝(#<팀 id>)과 브라우저에 기억해요.
   모든 상태는 팀 사무실 폴더(.office)의 파일에서 몇 초마다 다시 읽어요. */
:root{
  --floor:#DEDBD4;
  --surface:#F1EFEA; --surface-2:#E6E3DC;
  --ink:#1E2024; --ink-2:#45474C; --ink-3:#5A5C60; --line:#D2CEC5; --line-2:#B2AEA4;
  --focus:#1F5CB8; --scrim:rgba(10,12,16,.5); --shadow:none;
  --work-w:#E4E1DA; --idle-w:#E4E1DA; --meet-w:#E4E1DA; --block-w:#E4E1DA; --none-w:#E4E1DA; --hot:#B93610; --hot-w:#E8E5DE; --note:#E8E5DE; --note-l:#B2AEA4;
  --plate:#1E2024; --plate-ink:#F1EFEA; --plate-rim:#45474C; --gold:#B88A1E; --sc-bg:#7E7D77;
  --work:#A85F05; --ok:#147A50; --rest:#6E7076; --err:#C92222; --meet:#6A4BD6;
  --err-ink:#C92222; --on-a:#FFFFFF; --on-s:#FFFFFF; --chip-wash:rgba(0,0,0,.22); --me:#2E3239; --me-ink:#F1EFEA;
  --w-a:#E2DFD8; --a-a:#14694A;
  --w-b:#E2DFD8; --a-b:#1F5CB8;
  --w-c:#E2DFD8; --a-c:#B01F50;
  --w-hq:#E2DFD8; --a-hq:#7E5509;
  --font-display:"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --floor:#121419; --surface:#1B1E24; --surface-2:#252930;
    --ink:#E7E5DF; --ink-2:#B9B8B3; --ink-3:#A3A3A0; --line:#2E323A; --line-2:#454A53;
    --focus:#8DB8FF; --scrim:rgba(10,12,16,.6); --shadow:none;
    --work-w:#2A2E35; --idle-w:#2A2E35; --meet-w:#2A2E35; --block-w:#2A2E35; --none-w:#2A2E35; --hot:#FF8F6B; --hot-w:#2A2E35; --note:#2A2E35; --note-l:#454A53;
    --plate:#0E1014; --plate-ink:#E7E5DF; --plate-rim:#454A53; --gold:#D8AC48; --sc-bg:#0E1014;
    --work:#F0A33A; --ok:#3DD68C; --rest:#9AA0A6; --err:#FF6369; --meet:#A68BEA;
    --err-ink:#FF6369; --on-a:#14161B; --on-s:#14161B; --chip-wash:rgba(255,255,255,.22); --me:#D9D5CC; --me-ink:#16181C;
    --w-a:#252930; --a-a:#5ADCAD; --w-b:#252930; --a-b:#8DB8FF; --w-c:#252930; --a-c:#FF97B6; --w-hq:#252930; --a-hq:#E6BC5E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --floor:#121419; --surface:#1B1E24; --surface-2:#252930;
  --ink:#E7E5DF; --ink-2:#B9B8B3; --ink-3:#A3A3A0; --line:#2E323A; --line-2:#454A53;
  --focus:#8DB8FF; --scrim:rgba(10,12,16,.6); --shadow:none;
  --work-w:#2A2E35; --idle-w:#2A2E35; --meet-w:#2A2E35; --block-w:#2A2E35; --none-w:#2A2E35; --hot:#FF8F6B; --hot-w:#2A2E35; --note:#2A2E35; --note-l:#454A53;
  --plate:#0E1014; --plate-ink:#E7E5DF; --plate-rim:#454A53; --gold:#D8AC48; --sc-bg:#0E1014;
  --work:#F0A33A; --ok:#3DD68C; --rest:#9AA0A6; --err:#FF6369; --meet:#A68BEA;
  --err-ink:#FF6369; --on-a:#14161B; --on-s:#14161B; --chip-wash:rgba(255,255,255,.22); --me:#D9D5CC; --me-ink:#16181C;
  --w-a:#252930; --a-a:#5ADCAD; --w-b:#252930; --a-b:#8DB8FF; --w-c:#252930; --a-c:#FF97B6; --w-hq:#252930; --a-hq:#E6BC5E;
}
*{box-sizing:border-box}
body{background-color:var(--floor); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.wrap{max-width:1440px; margin:0 auto; padding-block:22px 56px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
[data-team="hq"]{--tw:var(--w-hq); --ta:var(--a-hq)}
/* 팀 색: org.json의 tone(a·b·c) 또는 층 번호 순서로 정해요. 팀 id와 상관없이 어떤 팀이든 색이 들어가요. */
[data-tone="a"]{--tw:var(--w-a); --ta:var(--a-a)}
[data-tone="b"]{--tw:var(--w-b); --ta:var(--a-b)}
[data-tone="c"]{--tw:var(--w-c); --ta:var(--a-c)}
[data-tone="hq"]{--tw:var(--w-hq); --ta:var(--a-hq)}

.plate{position:relative; margin:0; white-space:nowrap; font-family:var(--font-display); font-weight:700; font-size:30px; line-height:1; background:var(--plate); color:var(--plate-ink); padding:11px 22px 9px; border-radius:2px; box-shadow:inset 0 0 0 2px var(--plate-rim), 0 3px 0 var(--plate-rim)}
.plate::before,.plate::after{content:""; position:absolute; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:2px; background:var(--plate-rim)}
.plate::before{left:7px} .plate::after{right:7px}
.live{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:2px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; color:var(--ink-2)}
.live i{width:8px; height:8px; border-radius:2px; background:var(--ok); animation:pulse 2s ease-in-out infinite}
.live.snap i{background:var(--rest); animation:none}
.live.lost i{background:var(--err); animation:none}
.live b{font-family:var(--font-mono); font-weight:500; color:var(--ink)}


.mv{width:36px; height:32px; padding:0; justify-content:center; font-size:16px; line-height:1}
.mv[aria-disabled="true"]{opacity:.4; cursor:default}
.org-note{margin:-4px 0 10px}
.org-note:empty{display:none}
.org-note.bad,.setup .su-ordnote.bad{color:var(--err-ink)}
.fl-no{flex:none; font:600 11.5px var(--font-mono); padding:2px 7px; border-radius:2px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}

/* 팀 사무실 */
.room{margin-top:22px; background:var(--surface); background:color-mix(in srgb, var(--tw) 50%, var(--surface)); border:1px solid var(--line); border:1px solid color-mix(in srgb, var(--ta) 40%, var(--line)); border-radius:4px; padding:0 14px 14px}
.room-head{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:-1px -15px 14px; padding:11px 15px; border-radius:4px 4px 0 0; background:var(--ta); color:var(--on-a)}
.room-head .tn{font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1}
.room-head .fl{font:600 13px var(--font-mono); padding:3px 8px; border-radius:2px; background:var(--chip-wash)}
.room-head .kind{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:2px; background:var(--chip-wash)}
@media (min-width:560px){ .desks.many{grid-template-columns:repeat(auto-fill, minmax(230px, 1fr))} }   /* 팀원이 많으면 한 줄에 셋 이상 */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:12px 14px; min-width:0}
.panel h3{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 8px; font-family:var(--font-display); font-weight:700; font-size:17px}
.panel h3 span{font:500 12px var(--font-body); color:var(--ink-3)}

.who{display:flex; flex-direction:column; min-width:0}
.d-title .rl,.feed .rl,.msg .rl,.board .rl,.chips .rl,.appr-top .rl,.meet-now .rl,.hint .rl,.talk-who .rl,.seat .rl{margin-left:5px; font:500 11px var(--font-body); letter-spacing:0; color:var(--ink-3); white-space:nowrap}
.d-title .rl{margin-left:8px; font-size:14px; color:var(--ink-2)}
.nm-edit{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; min-width:0; font:400 13px/1.35 var(--font-body); cursor:default}
.nm-edit .nm-in{flex:1 1 7em; min-width:0; padding:5px 8px; border:1px solid var(--line-2); border-radius:2px; background:var(--surface); color:var(--ink); font:inherit; font-size:14px}
.nm-edit .nm-in[aria-invalid="true"]{border-color:var(--err)}
.nm-edit .btn{padding:4px 10px; font-size:12.5px}
.nm-edit .hint,.nm-edit .err{flex:1 1 100%}
.sd{width:8px; height:8px; border-radius:2px; flex:none; display:inline-block; background:var(--rest)}
.sd.work{background:var(--work); animation:pulse 1.2s ease-in-out infinite}
.sd.here{background:var(--ok)}
.sd.meet{background:var(--meet)}
.sd.block{background:var(--err)}
.sd.none{background:transparent; box-shadow:inset 0 0 0 1.5px var(--rest)}

/* 회의실 */
.meet-state{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px}
.meet-state b{font-weight:600}
.meet-file{margin-top:6px; padding:0; border:0; background:none; color:var(--ink); font:500 12px var(--font-mono); text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:3px; cursor:pointer; text-align:left; overflow-wrap:anywhere}

/* 업무판 */
.board{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.board li{display:grid; grid-template-columns:18px minmax(0,1fr); gap:3px 8px; padding:7px 0; border-top:1px solid var(--line); font-size:13px}
.board li:first-child{border-top:0}
.board .ck{width:14px; height:14px; margin-top:3px; border-radius:2px; border:1.5px solid var(--line-2)}
.board li.done .ck{background:var(--ok); border-color:var(--ok)}
.board li.done .bt{color:var(--ink-3); text-decoration:line-through}
.board .bm{grid-column:2; display:flex; flex-wrap:wrap; gap:4px 8px; font-size:11.5px; color:var(--ink-3)}
.board .bm code{font:600 11px var(--font-mono); color:var(--ink-2)}
.chip{display:inline-block; padding:1px 6px; border-radius:2px; background:var(--surface-2); color:var(--ink-2); font-size:11px; font-weight:500}
.chip.wait{background:color-mix(in srgb, var(--work) 22%, var(--surface)); color:var(--ink)}
.empty{font-size:12.5px; color:var(--ink-3)}

/* 기록 */
.feed{list-style:none; margin:0; padding:0; max-height:340px; overflow:auto}
.feed li{display:grid; grid-template-columns:44px minmax(0,1fr); gap:2px 10px; padding:7px 0; border-top:1px solid var(--line); font-size:13px}
.feed li:first-child{border-top:0}
.feed time{font:500 11.5px var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
.feed .route{font-size:12px; color:var(--ink-2)}
.feed .route b{color:var(--ink); font-weight:600}
.k{display:inline-block; margin-right:6px; padding:0 6px; border-radius:2px; font-size:11px; font-weight:600; background:var(--surface-2); color:var(--ink-2)}
.k.지시,.k.업무{background:color-mix(in srgb, var(--focus) 16%, var(--surface)); color:var(--ink)}
.k.보고{background:color-mix(in srgb, var(--ok) 20%, var(--surface)); color:var(--ink)}
.k.회의{background:color-mix(in srgb, var(--meet) 20%, var(--surface)); color:var(--ink)}
.k.질문{background:color-mix(in srgb, var(--work) 22%, var(--surface)); color:var(--ink)}
.files{list-style:none; margin:0; padding:0}
.files li + li{border-top:1px solid var(--line)}
.files button{width:100%; padding:7px 0; border:0; background:none; color:var(--ink); font:500 12px var(--font-mono); text-align:left; cursor:pointer; overflow-wrap:anywhere}
.files button:hover{text-decoration:underline}

/* 명령 도우미 */
.howto{margin-top:16px}
.cmds{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:8px}
.cmd{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:3px; background:var(--surface-2)}
.cmd code{font:500 12.5px var(--font-body); color:var(--ink); overflow-wrap:anywhere}
.cmd button{flex:none; padding:4px 9px; border-radius:2px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; cursor:pointer}

/* 입주 예정 층 */
.later-card{background:var(--surface); border:1px dashed var(--line-2); border-radius:4px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.later-card b{font-family:var(--font-display); font-weight:700; font-size:17px}
.later-card p{margin:0; font-size:12.5px; color:var(--ink-2)}
.later-card a{align-self:flex-start; font-size:12px; font-weight:600}

/* 서랍 */
.drawer{position:fixed; inset:0; z-index:50; display:flex; justify-content:flex-end}
.drawer-bg{position:absolute; inset:0; background:var(--scrim)}
.drawer-panel{position:relative; width:min(520px, 100%); height:100%; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); color:var(--ink); padding:calc(14px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 22px; box-shadow:-24px 0 60px -30px rgba(0,0,0,.55); animation:slidein .22s ease-out}
.d-bar{display:flex; justify-content:flex-end; margin-bottom:10px}
.d-bar:empty{display:none}   /* 대화 서랍은 [닫기]가 머리에 있어요 */
.d-close{padding:6px 12px; border-radius:2px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; cursor:pointer}
.d-title{margin:0; font-family:var(--font-display); font-weight:700; font-size:28px; line-height:1.1}
.d-eyebrow{margin:0 0 2px; font-size:12.5px; color:var(--ink-2); font-weight:500}
.d-pre{margin:14px 0 0; padding:12px; border-radius:3px; background:var(--surface-2); font:400 12.5px/1.6 var(--font-mono); white-space:pre-wrap; overflow-wrap:anywhere}
.facts{display:grid; grid-template-columns:7em minmax(0,1fr); margin:14px 0 0}
.facts dt,.facts dd{padding:6px 0; border-top:1px solid var(--line); font-size:13px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0; min-width:0; overflow-wrap:anywhere}
.facts code{font:500 12px var(--font-mono)}
.btn-primary{display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:8px 14px; border-radius:2px; background:var(--ink); color:var(--surface); font-size:13.5px; font-weight:600; text-decoration:none}
.btn-primary::after{content:"↗"}

/* 대화·회의·결재 */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:2px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.btn.warn{color:var(--err-ink)}
.btn:disabled{opacity:.5; cursor:not-allowed}
button.live{cursor:pointer; font:inherit; font-size:12.5px}
.live.alert{border-color:var(--work); background:color-mix(in srgb, var(--work) 16%, var(--surface)); color:var(--ink)}
.live.alert b{color:var(--ink)}
.su-state .relay-re{margin-left:6px; font:inherit; font-weight:600; padding:2px 8px; border-radius:2px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); cursor:pointer}   /* 설정 총괄 묶음의 [다시 연결](머리말 칩과 같은 단추) */
.live .relay-re{font:inherit; font-weight:600; padding:2px 8px; border-radius:2px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); cursor:pointer}
.d-sec{margin:20px 0 6px; font-size:13px}
/* 대화(U-29 B): 대표 말은 오른쪽 흑연색 말풍선(쓴 그대로), 세션 말은 왼쪽 돌색 말풍선(굵게·목록을 그려요). 같은 사람이 잇달아 말하면 이름과 시각은 한 번만 */
.thread{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.msg{align-self:flex-start; max-width:100%; min-width:0; margin-top:14px; font-size:15px; line-height:24px}
.msg:first-child{margin-top:0}
.msg.cont{margin-top:4px}
.msg .who{display:block; margin:0 0 4px; font:600 12.5px/1.4 var(--font-body); color:var(--ink-2)}   /* 다른 곳의 .who(flex 세로)를 따르지 않게 */
.msg .who time{margin-left:6px; font-weight:400; color:var(--ink-3)}
.msg .b{padding:9px 13px 10px; border:1px solid var(--line); border-radius:4px; background:var(--surface-2); overflow-wrap:anywhere; word-break:keep-all}
.msg.me{align-self:flex-end; max-width:88%; display:flex; flex-direction:column; align-items:flex-end}
.msg.me .b{border-color:var(--me); background:var(--me); color:var(--me-ink); white-space:pre-wrap}
.msg .t{margin:4px 0 0; font-size:12px; line-height:1.4; color:var(--ink-3)}
.msg .t span + time{margin-left:6px}
.msg.me:has(+ .msg.me.cont) .t{display:none}   /* 대표 시각은 묶음의 마지막 말 아래에만 */
.msg.sys{align-self:center; font-size:12px; line-height:1.5; color:var(--ink-3); text-align:center}
.msg.t-empty{margin:auto; max-width:28em; font-size:13.5px; color:var(--ink-2); word-break:keep-all}
.md{white-space:pre-wrap}   /* mdLite는 줄을 <br>로 나눠요. 그래서 들여쓰기와 여러 빈칸이 그대로 남아요 */
.md p{margin:0 0 8px}
.md > :last-child{margin-bottom:0}
.md p.lead{margin:14px 0 4px; font-weight:700}
.md p.lead:first-child{margin-top:0}
.md strong{font-weight:700}
.md ul,.md ol{margin:2px 0 10px; padding-left:20px}
.md ul{list-style:disc}   /* 대화 칸도 목록이라 그냥 두면 속 빈 동그라미가 돼요 */
.md ol{list-style:decimal}
.md li{margin:3px 0 0}
.md li:first-child{margin-top:0}
.md ul li::marker{color:var(--ink-3); font-size:.8em}
.md ol li::marker{color:var(--ink-2); font-variant-numeric:tabular-nums}
.composer{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.composer textarea,.composer input[type="text"]{width:100%; padding:9px 10px; border:1px solid var(--line-2); border-radius:3px; background:var(--surface); color:var(--ink); font:inherit; font-size:14px}
.composer textarea{min-height:76px; resize:vertical}
.composer .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between}
.composer .row .hint{flex:1 1 220px}
/* 일 맡기기 네 칸: 이름표 | 칸. 한 줄로 시작해서 Shift+Enter로 줄을 늘려요 */
.composer .ho{margin:0; padding:0; border:0; min-width:0}
.composer .ho-g{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 8px; align-items:center}
.composer .ho-g label{font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap}
.drawer-panel .composer .ho textarea[data-ho]{min-height:0; padding:6px 9px; resize:none; field-sizing:content; max-height:20vh}
/* field-sizing을 모르는 브라우저(Firefox, 예전 Safari·WebKit)는 hoGrow가 글 높이에 맞춰 늘리고, 손으로도 늘릴 수 있어요 */
@supports not (field-sizing:content){.drawer-panel .composer .ho textarea[data-ho]{resize:vertical}}
.composer .ho-tg{flex:none; min-height:24px; padding:0; border:0; background:none; color:var(--ink-2); font:600 12.5px var(--font-body); text-decoration:underline; text-underline-offset:3px; white-space:nowrap; cursor:pointer}
.composer .ho-tg[aria-pressed="true"]{color:var(--ink); text-decoration-thickness:2px}
.composer .keys{flex:1 1 auto; min-width:0; margin:0; font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 대화 서랍(U-29 B '대화 먼저'): 머리(이름·상태 한 줄, [Claude 창 열기]·[닫기], 위험한 일 안내, [대화 | 정보] 탭), 끊김 띠, 대화 칸, 작성창.
   스크롤은 대화 칸(정보 탭이면 정보 칸) 하나예요. 머리·띠·작성창은 서랍 끝까지 닿고 글은 --pl/--pr만큼 들여요. Codex·예시 서랍은 머리만 같아요 */
.drawer-panel.chat{--dx:24px; --pl:max(var(--dx), env(safe-area-inset-left, 0px)); --pr:max(var(--dx), env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; overflow:hidden; overflow:clip; padding:0}   /* clip: 초점이 작성창 끝으로 가도 머리가 위로 밀리지 않아요 */
.drawer-panel.chat #drawerBody{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.drawer-panel.chat #drawerBody > *{flex:none}
.drawer-panel.chat #drawerBody > .d-main{flex:1 1 0; min-height:96px; display:flex; flex-direction:column}   /* 남는 자리를 다 가져요. 작은 창에서도 대화가 두 줄쯤 보여요(basis 0: 긴 대화 때문에 작성창이 줄지 않게) */
.drawer-panel.chat #drawerBody > .composer,.drawer-panel.chat #drawerBody > #meetSay,#meetSay > .composer{flex:0 1 auto; min-height:0}   /* 자리가 모자라면 작성창이 줄어요 */
#meetSay:not([hidden]){display:flex; flex-direction:column}
.d-head{padding:calc(12px + env(safe-area-inset-top, 0px)) var(--pr) 0 var(--pl); border-bottom:1px solid var(--line)}
.d-head:not(:has(.d-tabs)){padding-bottom:12px}
.d-top{display:flex; align-items:center; gap:10px}
.d-name{flex:1; min-width:0}
.d-top .d-title{font-size:19px; line-height:1.25; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.d-team{margin-left:6px; font:500 12.5px var(--font-body); color:var(--ink-3); white-space:nowrap}
.d-line{margin:2px 0 0; font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.d-line .dot{margin-right:6px; vertical-align:0}
.d-sub{margin:2px 0 0; font-size:12.5px; color:var(--ink-2); word-break:keep-all}
.d-x{display:flex; flex:none}
.d-top .btn{flex:none; white-space:nowrap}
.d-top .d-close{flex:none; padding:5px 12px; border-color:var(--line-2); font-weight:600}
.d-must{margin:8px 0 0; font-size:12.5px; color:var(--ink-2); word-break:keep-all}
#meetCtl:empty{display:none}
#meetCtl .meet-actions{margin-top:8px}
#meetCtl .hint{margin-top:6px}
.d-tabs{display:flex; gap:18px; margin-top:6px}
.d-tabs button{min-width:24px; padding:8px 0 9px; border:0; border-bottom:2px solid transparent; background:none; color:var(--ink-3); font:600 13.5px var(--font-body); cursor:pointer}
.d-tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
.d-tabs small{font-weight:500}
.d-relay{display:flex; align-items:center; gap:10px; padding:8px var(--pr, 10px) 8px var(--pl, 10px); background:var(--surface-2); border-bottom:1px solid var(--line); font-size:12.5px; word-break:keep-all}
.d-relay p{flex:1; margin:0}
.d-relay p::before{content:""; display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:2px; background:var(--err-ink); vertical-align:1px}
.d-relay .btn{flex:none; white-space:nowrap}
.composer .d-relay{border:0; border-radius:3px}   /* 회의 열기 서랍의 띠 */
.d-talk{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.d-relay[hidden],.d-talk[hidden],.d-info[hidden]{display:none}
.drawer-panel.chat .thread{flex:1 1 auto; min-height:0; padding:18px var(--pr) 20px var(--pl); overflow-y:auto; overscroll-behavior:contain}
.d-info{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:6px var(--pr) 18px var(--pl)}
.d-info .facts{margin-top:0}
.d-info h3{margin:18px 0 6px; font-size:13px}
.d-info .feed{max-height:none; overflow:visible}
.d-via{margin:8px 0 0}
.d-foot{padding:12px var(--pr) calc(14px + env(safe-area-inset-bottom, 0px)) var(--pl); border-top:1px solid var(--line)}
.drawer-panel.chat .composer{gap:6px; margin:0; padding:10px var(--pr) calc(14px + env(safe-area-inset-bottom, 0px)) var(--pl); border-top:1px solid var(--line); background:var(--surface)}
.c-box{display:flex; align-items:flex-end; gap:8px}
.c-box > textarea,.c-box > .ho{flex:1 1 auto; min-width:0; align-self:stretch}
.drawer-panel.chat .composer > *{flex:none}
.drawer-panel.chat .composer > .c-box{flex:0 1 auto; min-height:0}   /* 작성창이 줄면 글칸과 일 맡기기 칸이 안에서 스크롤돼요. [보내기]와 [일 맡기기]는 늘 보여요 */
.c-box > .ho{min-height:0; overflow-y:auto}
.c-box > .btn{flex:none; white-space:nowrap}
.drawer-panel.chat .composer textarea[name="text"]{min-height:46px; max-height:30vh; padding:10px 12px; font-size:15px; line-height:1.5; resize:none; field-sizing:content}
.composer[data-form="say"] .row{flex-wrap:nowrap; gap:12px}
@media (max-height:600px){   /* 낮은 창(맥 앱 640×460 같은): 머리·띠·작성창의 틈을 줄여 대화 칸을 넓혀요 */
  .d-head{padding-top:calc(8px + env(safe-area-inset-top, 0px))}
  .d-must{margin-top:4px}
  .d-tabs{margin-top:2px}
  .d-relay{padding-top:5px; padding-bottom:5px}
  .drawer-panel.chat .composer{padding-top:8px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; border:0; min-width:0}
.chips legend{padding:0; margin-bottom:4px; font-size:12px; color:var(--ink-3)}
.chips label{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border:1px solid var(--line); border-radius:2px; background:var(--surface); font-size:12.5px; cursor:pointer}
.hint{margin:0; font-size:12px; color:var(--ink-3)}
.err{margin:0; font-size:12.5px; color:var(--err-ink)}
.err:empty{display:none}
.appr{border:1px solid var(--line); border-radius:4px; padding:12px 13px; margin-top:12px; background:var(--surface)}
.appr.done{opacity:.72}
.appr-top{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
.appr h4{margin:6px 0 4px; font-size:15.5px; line-height:1.35}
.appr .sum{margin:0; font-size:13px; color:var(--ink-2); white-space:pre-wrap; overflow-wrap:anywhere}
.appr .risk{margin:8px 0 0; padding:7px 9px; border-radius:2px; background:color-mix(in srgb, var(--err) 12%, var(--surface)); font-size:12.5px; color:var(--ink)}
.appr .opts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.appr .opts .rec::after{content:"추천"; margin-left:4px; padding:0 5px; border-radius:2px; background:var(--gold); color:#1C2330; font-size:10.5px}
.meet-now{margin-top:8px; padding:8px 10px; border-radius:3px; background:var(--surface-2); background:color-mix(in srgb, var(--meet) 14%, var(--surface)); font-size:13px}
.meet-now ol{margin:6px 0 0; padding-left:18px; color:var(--ink-2); font-size:12.5px}
.meet-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.new-dot{display:inline-block; margin-left:6px; padding:1px 6px; border-radius:2px; background:var(--err); color:#fff; font:700 10.5px/1.4 var(--font-body); vertical-align:middle}
#relay a{font-weight:600; white-space:nowrap; text-underline-offset:3px}   /* 총괄 창이 멈췄을 수 있을 때의 ‘총괄 창 열기 ↗’ */
.past{list-style:none; margin:0; padding:0}
.past li + li{border-top:1px solid var(--line)}
.past button{width:100%; padding:7px 0; border:0; background:none; color:var(--ink); font:500 12.5px var(--font-body); text-align:left; cursor:pointer; overflow-wrap:anywhere}
.past button:hover{text-decoration:underline}
.past small{color:var(--ink-3)}

/* 처음 설정: 창 전체를 덮는 단계 화면(로그인 → Claude 연결 → 사무실 만들기 → 공개 범위 → 완료). 위의 '설정'으로 다시 열어요. */
.setup{position:fixed; inset:0; z-index:60; overflow-y:auto; overscroll-behavior:contain; background-color:var(--floor); color:var(--ink)}
.setup [hidden]{display:none !important}
.su-wait .wrap{visibility:hidden}
.su-wrap{max-width:880px; margin:0 auto; padding-block:calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.su-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.su-top .plate{display:inline-block; font-size:24px; padding:9px 18px 7px}
.su-h1{flex:1 1 auto; margin:0; font-family:var(--font-display); font-weight:700; font-size:22px; line-height:1.1}
.su-intro{margin:12px 0 0; max-width:68ch; color:var(--ink-2); font-size:13.5px; text-wrap:pretty}
.su-steps{list-style:none; margin:16px 0 0; padding:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px}
.su-steps button{display:flex; justify-content:center; align-items:center; width:100%; min-height:38px; padding:6px 10px; border:1px solid var(--line); border-radius:4px; background:var(--surface); color:var(--ink); font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.15; word-break:keep-all; cursor:pointer}
.su-steps button:hover{border-color:var(--ink-3)}
.su-steps .n{font:600 11px var(--font-mono); color:var(--ink-3)}
.su-steps b{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.15; word-break:keep-all}
.su-steps small{font-size:11.5px; color:var(--ink-3); overflow-wrap:anywhere}
.su-steps [aria-selected="true"]{background:var(--plate); border-color:var(--plate); color:var(--plate-ink); box-shadow:inset 0 0 0 2px var(--plate-rim)}
.su-tabfoot{margin:16px -20px -16px; padding:10px 20px; border-top:1px solid var(--line); color:var(--ink-2); font-size:12.5px}
.su-cbox{margin-top:12px}
.su-cbox .su-cbox-h{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin:0}
.su-cbox .su-cbox-h b{font-family:var(--font-display); font-weight:700; font-size:15px}
.su-cbox .su-cbox-h .btn{margin-left:auto}
.su-cbox .su-read,.su-cbox .su-fm{margin-top:6px}
.su-floor-must{margin-top:8px}
.su-floor-must .hint{margin:2px 0 0}
/* 접는 칸(추천 팀·직접 고르기)과 [자세히] */
.su-fold{margin-top:14px; border:1px solid var(--line); border-radius:4px; background:var(--surface)}
.su-fold > summary{display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; list-style:none; font-size:13.5px; font-weight:600}
.su-fold > summary::-webkit-details-marker{display:none}
.su-fold > summary::before{content:"▸"; color:var(--ink-3); font-size:12px}
.su-fold[open] > summary::before{content:"▾"}
.su-fold-t{outline:none}
.su-fold-b{padding:0 12px 12px}
.su-fold-b > :first-child{margin-top:0}
.su-more{margin-top:6px; font-size:12.5px}
.su-more > summary{cursor:pointer; color:var(--ink-2); width:max-content}
.su-more > .hint{margin-top:4px}
.su-fm{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-top:14px}
.su-newrec,.su-state{margin:12px 0 0; font-size:13px}
/* 처음 화면: 추천 줄(한 줄씩 · 누르면 펼침)과 아래에 늘 보이는 줄들 */
.su-flist{list-style:none; margin:8px 0 0; padding:0; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.su-frow + .su-frow{border-top:1px solid var(--line)}
.su-frow-h{display:flex; align-items:center; gap:8px; padding:6px 10px}
.su-frow-h input[type="checkbox"]{width:18px; height:18px; flex:none; margin:0}
.su-frow.done .su-frow-h{color:var(--ink-2)}
.su-fdone{display:inline-grid; place-items:center; width:18px; flex:none; color:var(--ok); font-weight:700}
.su-ftog{flex:1 1 auto; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:6px 4px; border:0; background:none; color:inherit; font:inherit; font-size:14px; text-align:left; cursor:pointer}
.su-ftog::after{content:"›"; margin-left:auto; color:var(--ink-3); transition:transform .15s}
.su-ftog[aria-expanded="true"]::after{transform:rotate(90deg)}
.su-frow > .err{margin:0 10px 8px 36px}
.su-fb{padding:0 10px 10px 36px}
.su-fb .su-rc{margin:0}
.su-rc.su-rc-in{padding:10px 12px; border:0; border-radius:4px; background:var(--surface-2)}
.su-rc-in .su-field.su-rc-name{flex-direction:row; align-items:center; gap:10px; max-width:360px; margin:0 0 8px}
.su-rc-in .su-rc-name label{flex:none}
.su-rc-foot{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:8px}
.su-rc .su-rc-foot .hint{margin:0}
/* 켜고 끄는 칸(첫 메시지 읽기·새 버전·사용량 알림)은 스위치 모양(U-16). 체크 칸 그대로라 키보드·화면 읽기는 같아요 */
.setup input[role="switch"]{appearance:none; -webkit-appearance:none; position:relative; flex:none; width:30px; height:18px; margin:0 2px 0 0; border:1px solid var(--line-2); border-radius:4px; background:var(--surface-2); vertical-align:-4px; cursor:pointer; transition:background .15s, border-color .15s}
.setup input[role="switch"]::before{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:2px; background:var(--ink-3); transition:transform .15s, background .15s}
.setup input[role="switch"]:checked{background:var(--ok); border-color:var(--ok)}
.setup input[role="switch"]:checked::before{transform:translateX(12px); background:#fff}
.setup input[role="switch"]:disabled{opacity:.5; cursor:default}
.setup input[role="switch"]:focus-visible{outline:2px solid var(--ink-3); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ .setup input[role="switch"],.setup input[role="switch"]::before{transition:none} }
.su-ffoot{position:sticky; bottom:0; z-index:2; margin:14px -20px -16px; padding:12px 20px 14px; border-top:1px solid var(--line); background:var(--surface); border-radius:0 0 4px 4px; box-shadow:0 -10px 16px -14px rgba(0,0,0,.35)}
.su-ffoot > * + *{margin-top:6px}
.su-read{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px}
.su-read > .hint{margin:0}
.su-frl,.su-fboss{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px}
.su-fm{margin-top:6px}
.su-fgo{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:10px}
.su-fgo .btn.primary{min-height:40px; padding:0 18px; font-size:15px}
.su-link{margin-left:auto; padding:0; border:0; background:none; color:var(--ink-2); font:inherit; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.su-empty-big{margin-top:12px; padding:28px 18px; text-align:center}
.su-empty-big b{display:block; font-family:var(--font-display); font-weight:700; font-size:17px}
.su-empty-big p{margin:6px 0 0; color:var(--ink-2); font-size:13px}
.su-ffoot .btn.primary.big{min-height:40px; padding:0 18px; font-size:15px}
.su-intro.su-warnline{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; max-width:none; padding:8px 12px; border:1px solid color-mix(in srgb, var(--work) 55%, var(--line)); border-radius:4px; background:color-mix(in srgb, var(--work) 10%, var(--surface)); color:var(--ink)}
.su-newrec{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin:0 0 4px; padding:8px 12px; border:1px solid color-mix(in srgb, var(--work) 55%, var(--line)); border-radius:4px; background:color-mix(in srgb, var(--work) 10%, var(--surface))}
/* 처음 화면(U-16): 창 높이에 맞춰 고정하고 가운데(추천 팀·직접 고르기)만 스크롤돼요. 아래 줄과 [사무실 열기]는 늘 보여요 */
.setup.su-first{overflow:hidden}
.su-first .su-wrap{display:flex; flex-direction:column; height:100%; height:100dvh; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.su-first .su-card{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; padding-bottom:0}
.su-first .su-fmid{flex:1 1 auto; min-height:120px; overflow-y:auto; overscroll-behavior:contain; margin:0 -20px; padding:0 20px 12px}
.su-first .su-ffoot{position:static; flex:none; margin:0 -20px; box-shadow:none}
.su-rec-h .su-sub small{font-family:var(--font-body, inherit); font-size:12px}
@media (max-width:620px){ .su-ffoot{margin:14px -14px -14px; padding:10px 14px 12px} .su-first .su-ffoot{margin:0 -14px} .su-first .su-fmid{margin:0 -14px; padding:0 14px 10px} .su-tabfoot{margin:14px -14px -14px; padding:10px 14px} .su-fb{padding-left:10px} .su-link{margin-left:0} }
.su-card{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:18px 20px 16px}
.su-h{margin:0; font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.1}
.su-h:focus{outline:none}   /* 단계를 바꿀 때 읽기 위치만 옮기는 제목이라 테두리는 그리지 않아요 */
.su-lead{margin:6px 0 0; max-width:70ch; color:var(--ink-2); font-size:13.5px; text-wrap:pretty}
.su-lead b{color:var(--ink); font-weight:600}
.su-sub{margin:18px 0 0; font-size:13.5px; font-weight:600}
.su-box{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:4px; background:var(--surface-2)}
.su-box p{margin:0}
.su-box p + p{margin-top:6px}
.su-box .sd{margin-right:4px; vertical-align:1px}
.su-ok{border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:color-mix(in srgb, var(--ok) 9%, var(--surface))}
.su-warn{border-color:color-mix(in srgb, var(--work) 55%, var(--line)); background:color-mix(in srgb, var(--work) 10%, var(--surface))}
.su-opts{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:10px; margin-top:14px}
.su-opt{display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:12px 14px; border:1px solid var(--line); border-radius:4px; background:var(--surface-2)}
.su-opt b{font-size:14.5px}
.su-opt .hint{flex:1}
.su-code-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0 12px}
.su-code{padding:12px 18px; border-radius:4px; background:var(--plate); color:var(--plate-ink); font:600 32px/1 var(--font-mono); letter-spacing:.14em; -webkit-user-select:all; user-select:all}
.su-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:12px}
.su-check{display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer}
.su-floors,.su-plist{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.setup code{font:500 12px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.su-floors li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:8px 12px; border:1px dashed var(--line-2); border-radius:4px; background:var(--surface-2); font-size:13px}
.su-proj{border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:10px 12px}
.su-proj.on{border-color:var(--focus); box-shadow:0 0 0 2px color-mix(in srgb, var(--focus) 22%, transparent)}
/* 세션 나무: Claude 앱 사이드바 순서(내 그룹 → 프로젝트 폴더 → 이 컴퓨터). 찾기는 다시 그리지 않고 hidden만 바꿔요(한글 입력이 끊기지 않게). */
.su-tools{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 18px; margin-top:12px}
.su-tools .su-q{flex:1 1 260px; max-width:400px}
.su-tools .su-check{min-height:34px}
.su-src{margin-top:4px}
.su-count{margin-top:6px}
.su-count:empty{margin:0}
.su-folder{margin-top:10px}
.su-frow{display:grid; grid-template-columns:minmax(0,1fr); gap:8px}
.su-frow.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.su-folder .hint{display:block; margin-top:2px}
.su-newf{padding:6px 9px; border-radius:2px; border:1px solid color-mix(in srgb, var(--focus) 32%, var(--line)); background:color-mix(in srgb, var(--focus) 8%, var(--surface)); color:var(--ink)}
.su-newf code{color:var(--ink)}
.su-exist{margin-top:10px}
.su-exist .hint{margin-top:4px}
.su-exist code{color:var(--ink)}
.su-guess{font-size:11.5px; color:var(--ink-2)}
.su-guess::before{content:"✓ "; color:var(--ok)}
.su-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 12px}
.su-field{display:flex; flex-direction:column; gap:4px; min-width:0}
.su-field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.su-field label small{font-weight:400; color:var(--ink-3)}
.setup input[type="text"],.setup input[type="search"],.setup select{width:100%; min-width:0; padding:7px 9px; border:1px solid var(--line-2); border-radius:2px; background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px}
.su-tree{list-style:none; margin:10px 0 0; padding:0; border:1px solid var(--line); border-radius:4px; background:var(--surface); overflow:hidden}
.su-node + .su-node{border-top:1px solid var(--line)}
.su-row{display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:3px 8px 3px 4px; min-height:42px}
.su-tog{display:flex; align-items:center; gap:6px; flex:1 1 240px; min-width:0; padding:6px; border:0; border-radius:2px; background:none; color:var(--ink); font:inherit; font-size:14px; text-align:left; cursor:pointer}
.su-tog:hover{background:var(--surface-2)}
.su-caret,.su-ico{flex:none; width:16px; height:16px; color:var(--ink-2)}
.su-caret{transition:transform .15s}
.su-tog[aria-expanded="true"] .su-caret{transform:rotate(90deg)}
.su-nm,.su-st{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; min-width:0; overflow-wrap:anywhere}
.su-nm b{font-weight:600}
.su-nm small,.su-st small{font-size:12px; color:var(--ink-2)}
.su-kids{list-style:none; margin:0; padding:0 0 4px}
.su-kids .su-row{padding-left:38px; min-height:38px; border-top:1px dashed var(--line)}
.su-st{flex:1 1 240px; padding:4px 0; font-size:13.5px}
.su-to{flex:none; padding:4px 11px; font-size:12.5px}
.su-row > .su-to{margin-left:auto}   /* 좁은 화면에서 줄이 넘어가도 단추는 오른쪽에 */
.su-node.picked > .su-row,.su-kids li.picked > .su-row{background:color-mix(in srgb, var(--focus) 9%, var(--surface))}
.chip.on{background:color-mix(in srgb, var(--focus) 18%, var(--surface)); color:var(--ink)}
.su-leaf-empty{padding:6px 12px 8px 38px; font-size:12.5px; color:var(--ink-2); border-top:1px dashed var(--line)}
/* 만들 층: 고른 층마다 카드 하나. 팀원은 [역할 이름][앉힐 세션][빼기] 한 줄씩, 맨 위는 늘 팀장 */
.su-make{margin-top:22px}
.su-make-empty{margin-top:6px; padding:12px 14px; border:1px dashed var(--line-2); border-radius:4px}
.su-card-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-bottom:10px}
.su-card-t{margin:0; font-family:var(--font-display); font-weight:700; font-size:18px; line-height:1.15; overflow-wrap:anywhere}
.su-card-h .su-to{margin-left:auto; align-self:center}
.su-mem{margin:14px 0 0; padding:0; border:0; min-width:0}
.su-mem legend{padding:0; margin-bottom:6px; font-size:12.5px; font-weight:600; color:var(--ink)}
.su-mem legend small{font-weight:400; color:var(--ink-2)}
.su-mhead,.su-mrow{display:grid; grid-template-columns:minmax(7.5em, 10.5em) minmax(8em, 13em) minmax(0,1fr) 34px; gap:4px 8px; align-items:center}
.su-mhead{padding:0 2px 4px; color:var(--ink-2)}   /* 칸 너비가 em이라 머리글도 줄(.su-mrow)과 같은 글자 크기(상속)를 바탕으로 하고, 글자만 작게 해요 */
.su-mhead span{font-size:11.5px}
.su-first .su-mhead,.su-first .su-mrow{grid-template-columns:minmax(7.5em, 10.5em) minmax(0,1fr) 34px}
.su-first .su-mhead span:nth-child(2),.su-first .su-mrow > .su-mname,.su-first [id$="nh"]{display:none}
.su-mlab{display:none}
.su-mrow + .su-mrow{margin-top:6px}
.su-lead-role{display:flex; align-items:center; gap:6px; min-height:34px; padding:0 9px; border:1px solid var(--line); border-radius:2px; background:var(--surface-2); font-size:13.5px; font-weight:600}
.su-lead-role small{font-weight:400; font-size:11.5px; color:var(--ink-2)}
.su-mx{width:34px; height:34px; padding:0; justify-content:center; font-size:17px; line-height:1}
.su-mnote{grid-column:1 / -1; margin:0}
.setup .su-mrow [aria-invalid="true"]{border-color:var(--err)}
.setup .su-mrow input[readonly]{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}
.su-exist .su-miss{color:var(--ink)}
.su-madd{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px}
.su-sugg{padding:3px 10px; border-radius:2px; font-size:12px; font-weight:500}
.su-floors li.su-have{display:block}
.su-have-h{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.su-have-h .su-to{margin-left:auto}
.su-ord{display:inline-flex; gap:4px; margin-right:2px}
.su-ord .mv{width:32px; height:30px; font-size:15px}
.su-ordnote{margin-top:6px}
.su-ordnote:empty{display:none}
.su-pos{margin-top:10px; max-width:560px}
.su-floors li.su-have.on{border-style:solid; border-color:var(--focus); background:var(--surface)}
.su-edit{margin-top:8px; padding-top:4px; border-top:1px dashed var(--line-2)}
.su-saved{margin-top:4px}
.su-boss{margin-top:16px; max-width:560px}
.su-intro-f{margin-top:16px; max-width:560px}
.su-res{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:4px; background:var(--surface-2)}
.su-res h3{margin:0 0 6px; font-size:13.5px}
.su-res ul{list-style:none; margin:0; padding:0; font-size:13px}
.su-res li{padding:3px 0}
.su-res .bad{color:var(--err-ink)}
.su-res .hint{margin-top:8px}
.su-vis{margin:12px 0 0; padding:8px 12px 12px; border:1px solid var(--line); border-radius:4px; min-width:0}
.su-vis legend{display:flex; align-items:center; gap:6px; padding:0 4px; font-family:var(--font-display); font-weight:700; font-size:16px}
.su-levels{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.su-ctry-row{display:grid; grid-template-columns:minmax(0,200px) minmax(0,320px); gap:8px; margin-top:4px}   /* 나라 찾기 · 나라 고르기 */
.su-ctry .hint{margin-top:6px; max-width:720px}
@media (max-width:620px){ .su-ctry-row{grid-template-columns:minmax(0,1fr)} }
.su-lv{display:flex; align-items:flex-start; gap:7px; padding:8px 10px; border:1px solid var(--line); border-radius:3px; background:var(--surface); cursor:pointer; font-size:13px}
.su-lv input{flex:none; margin:3px 0 0}
.su-lv > span{display:flex; flex-direction:column; gap:1px; min-width:0}
.su-lv small{color:var(--ink-3); font-size:11.5px; line-height:1.4}
.su-lv:has(input:checked){border-color:var(--ink); background:color-mix(in srgb, var(--focus) 8%, var(--surface))}
/* 설정 화면의 작은 설명 글(무엇이 공개되는지, 로그인 방법)은 --ink-3로는 대비가 모자라서 --ink-2로(6:1 이상). 지금 단계 표시는 더 구체적인 규칙이 그대로 이겨요. */
.setup .hint,.su-lv small,.su-steps .n,.su-steps small,.su-field label small{color:var(--ink-2)}
.setup .su-newf{color:var(--ink)}
.su-pubstate{margin-top:6px; font-weight:600}
.su-rules{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; font-size:12.5px}
.su-confirm{margin-top:14px; padding:14px; border:2px solid var(--err); border-radius:4px; background:color-mix(in srgb, var(--err) 8%, var(--surface))}
.su-confirm h3{margin:0; font-size:15.5px}
.su-confirm p{margin:6px 0 0; font-size:13px}
.su-confirm ul{margin:6px 0 0; padding-left:18px; font-size:13px}
.su-nav{display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:20px; padding-top:14px; border-top:1px solid var(--line)}
.su-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
@media (max-width:760px){
  .su-levels{grid-template-columns:repeat(2, minmax(0,1fr))}
  .su-steps small{display:none}
}
@media (min-width:560px) and (max-width:760px){   /* 이름 칸이 더해져서 이 폭에서는 세션 고르기를 둘째 줄로 내려요 */
  .su-mhead,.su-mrow{grid-template-columns:minmax(7em, 10em) minmax(0,1fr) 34px}
  .su-mhead span:nth-child(3){display:none}
  .su-mrow select{grid-column:1 / -1; grid-row:2}
  .su-mrow > .su-mx,.su-mrow > span[aria-hidden="true"]{grid-column:3; grid-row:1}
}
@media (max-width:559px){
  .su-grid,.su-levels,.su-frow.two{grid-template-columns:minmax(0,1fr)}
  .su-mhead{display:none}
  .su-mrow{grid-template-columns:minmax(0,1fr) 34px}
  .su-mrow > :first-child{grid-column:1; grid-row:1}
  .su-mrow > .su-mlab{display:block; grid-column:1 / -1; grid-row:2; margin-top:2px; font-size:11.5px; color:var(--ink-2)}   /* 머리글이 숨겨지는 폭에서는 칸마다 이름표를 보여요 */
  .su-mrow > .su-mname{grid-column:1 / -1; grid-row:3}
  .su-mrow select{grid-column:1 / -1; grid-row:4}
  .su-mrow > .su-mx{grid-column:2; grid-row:1}
  .su-first .su-mhead,.su-first .su-mrow{grid-template-columns:minmax(0,1fr) 34px}
  .su-first .su-mrow > .su-mlab{display:none}   /* 처음 화면은 이름 칸이 없어서 그 이름표도 없어요 */
  .su-mrow .su-lead-role{grid-column:1 / -1}
  .su-mrow > span[aria-hidden="true"]{display:none}
  .su-mrow + .su-mrow{margin-top:12px}
  .su-kids .su-row{padding-left:24px}
  .su-leaf-empty{padding-left:24px}
  .su-tools .su-q{max-width:none; flex-basis:100%}
  .su-steps{gap:4px}
  .su-steps button{align-items:center; padding:6px 4px; text-align:center}
  .su-steps b{font-size:13.5px}
  .su-card{padding:14px}
  .su-code{font-size:26px}
}

/* 새 버전: 머리말 알림(칩), 업데이트 확인 창, 창 전체를 덮는 ‘업데이트하는 중’ 화면. 서버(/api/update/*)가 없으면 아무것도 보이지 않아요. */
.upd{display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 8px; max-width:100%; min-height:32px; padding:3px 4px 3px 12px; border-radius:2px; border:1px solid color-mix(in srgb, var(--focus) 45%, var(--line)); background:color-mix(in srgb, var(--focus) 9%, var(--surface)); color:var(--ink); font-size:12.5px}
.upd[hidden],.upd-modal[hidden],.upd-run[hidden]{display:none}
.upd b{font:600 12px var(--font-mono)}
.upd .dot{color:var(--ink-3)}
.upd .btn{min-height:26px; padding:2px 10px; font-size:12.5px}
.upd a{padding:2px 4px; border-radius:2px; font-weight:600; text-underline-offset:3px; white-space:nowrap}
.upd.ok{border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
.upd.ok span::before{content:"✓ "; color:var(--ok)}
.upd-set{padding:2px 4px; border:0; border-radius:2px; background:none; color:var(--ink-2); font:inherit; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; cursor:pointer}
.upd-set:hover{color:var(--ink)}
.upd-x{min-width:26px; height:26px; padding:0 4px; border:0; border-radius:2px; background:none; color:var(--ink-2); font-size:15px; line-height:1; cursor:pointer}
.upd-x:hover{background:var(--surface-2); color:var(--ink)}
/* 사용량 알림: 머리말 칩(80%는 조용히, 100%는 alert)과 설정 알림 묶음의 한도 칸 */
.usg{gap:6px; min-height:32px; padding:3px 4px 3px 12px}
.su-usg-lim{display:grid; grid-template-columns:max-content minmax(0, 12em); align-items:center; gap:6px 10px; margin-top:10px}
.su-usg-lim label{font-size:13px; font-weight:600; color:var(--ink-2)}
.upd-modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.upd-scrim{position:absolute; inset:0; background:var(--scrim)}
.upd-card{position:relative; width:min(480px, 100%); max-height:calc(100vh - 32px); overflow-y:auto; padding:18px 20px 16px; border-radius:4px; border:1px solid var(--line); background:var(--surface); color:var(--ink); box-shadow:0 24px 60px -24px rgba(0,0,0,.55); animation:slideup .18s ease-out}
.upd-card:focus,.upd-runbox h2:focus{outline:none}   /* 열 때 읽기 위치만 옮기는 곳이라 테두리는 그리지 않아요 */
.upd-card h2,.upd-runbox h2{margin:0; font-family:var(--font-display); font-weight:700; font-size:21px; line-height:1.15}
.upd-card p,.upd-runbox p{margin:8px 0 0; font-size:13.5px; text-wrap:pretty}
.upd-card .hint,.upd-runbox .hint{color:var(--ink-2); font-size:12.5px}
.upd-card .err{margin-top:10px}
.upd-run{position:fixed; inset:0; z-index:80; overflow-y:auto; overscroll-behavior:contain; display:flex; padding:calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background-color:var(--floor); color:var(--ink)}
.upd-runbox{width:min(560px, 100%); min-width:0; margin:auto; padding:20px 22px 18px; border-radius:4px; border:1px solid var(--line); background:var(--surface)}   /* margin:auto로 가운데: 내용이 길어도 위쪽이 잘리지 않고 스크롤돼요 */
.upd-runbox .plate{display:inline-block; font-size:22px; padding:8px 16px 6px}
.upd-runh{display:flex; align-items:center; gap:12px; margin-top:16px}
.upd-spin{flex:none; width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--focus); animation:spin .9s linear infinite}
.upd-run.fail .upd-spin{display:none}
.upd-run.fail h2{color:var(--err-ink)}
.upd-runst{font-weight:600}
.upd-runbox .d-pre{max-height:40vh; overflow:auto; margin-top:10px}
.upd-alt{margin:8px 0 0; padding-left:18px; font-size:13px}
.su-upd .su-check{font-weight:600}
.su-upd .su-actions{margin-top:8px}
/* 설정 도시 묶음의 ‘도시에 내 건물 세우기’(token-meter 참가) */
.su-meter h3{margin:0 0 6px; font-size:14.5px}
.su-meter h3:focus{outline:none}
.su-meter .su-actions{margin-top:8px}
.su-meter .su-check{margin-top:10px; font-weight:600}
.su-meter details{margin-top:8px}
.su-meter .d-pre{max-height:40vh; overflow:auto; margin-top:6px}
.su-mt-pv{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.su-mt-pv:focus{outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:559px){ .upd .dot{display:none} .upd-runbox{padding:16px} }

/* 빈자리에 새 세션 앉히기(세션 만들기): 사무실 책상, 설정의 팀원 고치기 줄, 층 만들기 결과에 같은 상자가 보여요(상태는 /api/seat/pending) */
.seat{display:flex; flex-direction:column; gap:6px; min-width:0; padding:8px 11px 9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-2)}
.seat:focus{outline:none}   /* 상태가 바뀌어 단추가 없어질 때 키보드 위치만 맡아 두는 상자라 테두리는 그리지 않아요 */
.seat-st{margin:0; color:var(--ink); overflow-wrap:anywhere; text-wrap:pretty}
.seat-st.wait::before{content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:2px; background:var(--work); vertical-align:1px; animation:pulse 1.2s ease-in-out infinite}
.seat-st.ok{font-weight:600}
.seat-st.ok b{color:var(--ok)}
.seat-st.bad{color:var(--err-ink)}
.seat .hint{color:var(--ink-2)}
.seat code{font:500 11.5px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.seat-acts{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.seat-acts .btn,.seat-pick .btn{min-height:30px; padding:4px 10px; font-size:12.5px}
.seat-pick{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.seat-pick .btn{width:100%; justify-content:space-between; flex-wrap:wrap; gap:2px 8px; font-weight:500; text-align:left; overflow-wrap:anywhere}
.seat-pick .btn small{font-weight:400; color:var(--ink-2)}
.seat-ok{margin:0; padding:5px 11px; border-top:1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); background:color-mix(in srgb, var(--ok) 12%, var(--surface)); color:var(--ink); font-size:12.5px; font-weight:600}
.setup .su-seat{padding:4px 0 2px; border-top:0}
.su-seats{margin-top:10px; padding-top:8px; border-top:1px dashed var(--line-2)}
.su-seats ul{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.su-seats li{display:grid; grid-template-columns:minmax(6em, 9em) minmax(0,1fr); gap:4px 10px; align-items:start; padding:0}
.su-seats li > b{padding-top:6px; font-size:13px; overflow-wrap:anywhere}
@media (max-width:559px){ .su-seats li{grid-template-columns:minmax(0,1fr)} .su-seats li > b{padding-top:0} }
/* 빈자리 모두 만들기: 줄이 도는 동안 사무실(방 위)과 설정 화면에 붙어 있는 한 줄 */
.fill-line{position:sticky; top:8px; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:0 0 12px; padding:8px 12px; border:1px solid var(--line-2); border-radius:4px; background:var(--surface); color:var(--ink); box-shadow:0 4px 14px #00000022; font-size:13px}
.fill-line[hidden]{display:none}

/* ── U-23 페이지 틀(복셀 확정 시안). 순서: 머리말 → 층 고르기 → 알림 → 장면 + 팀원 → 회의실·업무판·활동 기록 → 서류함 → 팀 간 대화 ── */
.wrap{display:flex; flex-direction:column; gap:12px; max-width:1320px; padding-block:calc(12px + env(safe-area-inset-top, 0px)) 72px}
svg.i{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.dot{display:inline-block; width:9px; height:9px; border-radius:2px; flex:none; background:var(--rest)}
.d-work{background:var(--work)!important} .d-idle{background:var(--ok)!important} .d-meet{background:var(--meet)!important} .d-block{background:var(--err)!important}
/* 머리말 */
.hdr{position:relative; display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; min-height:44px}   /* 칩이 많으면 다음 줄로 가요 */
.logo{display:flex; align-items:center; gap:8px; margin:0; font:700 24px/1 var(--font-display); white-space:nowrap}
.logo svg{width:32px; height:32px; flex:none}
.hdr .sp{flex:1}
.hdr-chips{display:contents}
.hdr .live{min-height:34px; padding:4px 12px; border-radius:2px; font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap}
.hdr .live:hover{border-color:var(--line-2)}
.hdr .live.alert,#apprBtn.alert{background:var(--hot-w); border-color:var(--hot)}
.hdr #relay.alert{flex-wrap:wrap; max-width:100%; white-space:normal}   /* 멈춤 안내는 길어요 */
#apprBtn b{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:2px; background:var(--hot); color:var(--on-s); font:700 12px var(--font-body)}
#apprBtn:not(.alert) b{background:var(--surface-2); color:var(--ink)}
#live:not(.snap):not(.lost){display:none}
.hdr-more{display:none}
.more-note{display:none}
/* 층 고르기: 엘리베이터 버튼처럼 번호 + 이름 + 팀원 점 */
.floors-w{display:flex; align-items:center; gap:8px; min-width:0}
.floors{flex:1; min-width:0; display:flex; gap:8px; margin:0; padding:3px; list-style:none; overflow-x:auto; scrollbar-width:thin; scroll-snap-type:x proximity}
.floors li{flex:none; display:flex; align-items:center; gap:2px; scroll-snap-align:start}
.ft{display:flex; align-items:center; gap:10px; min-width:158px; max-width:220px; padding:7px 14px 7px 8px; border-radius:4px; background:var(--surface); border:1px solid var(--line); color:var(--ink); text-align:left; text-decoration:none; cursor:pointer}
.ft:hover{border-color:var(--ta)}
.ft .no{display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:2px; background:var(--tw); color:var(--ta); font:700 17px/1 var(--font-display)}
.ft .tx{min-width:0; display:flex; flex-direction:column; gap:3px}
.ft .nm{font:700 15px/1.15 var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ft .dots{display:flex; flex-wrap:nowrap; align-items:center; gap:3px; font-size:11px; color:var(--ink-2)}
.ft .dots i{width:8px; height:8px; border-radius:2px; background:var(--rest)}
.ft[aria-pressed="true"]{background:var(--tw); border-color:var(--ta)}
.ft[aria-pressed="true"] .no{background:var(--ta); color:var(--on-a)}
.ft.later{border-style:dashed; color:var(--ink-2)}
.ft .newd{width:9px; height:9px; margin-left:auto; border-radius:2px; background:var(--hot); flex:none}
.mv{display:flex; flex-direction:column; gap:2px}
.mv .btn{width:24px; min-height:20px; padding:0; justify-content:center; font-size:11px; border-radius:2px}
.floors-w .order{flex:none; border-color:transparent; background:none; color:var(--ink-2)}
.org-note{margin:0}
.fill-line,.rules-note{border-radius:3px}
/* 방: 칸들을 세로로 */
.room{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; background:none; border:0}
.room-note{margin:0}
.room-head{margin:0; padding:8px 12px 8px 14px; border:1px solid var(--line); border-left:3px solid var(--ta); border-radius:3px; background:var(--surface); color:var(--ink)}
.room-head .fl{background:var(--ta); color:var(--on-a)}
.room-head .kind{background:var(--surface-2); color:var(--ink-2)}
.wrap .btn{min-height:30px; border-radius:2px; font-size:13px; font-weight:600}
.wrap .btn[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--floor)}
.sc-head .btn{min-height:28px; padding:2px 10px; font-size:12.5px}
/* 주인공: 장면 + 팀원 명단 */
.hero{display:grid; grid-template-columns:minmax(0,1fr) 348px; gap:12px; align-items:stretch}
.scene-card{min-width:0; display:flex; flex-direction:column; border-radius:4px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); overflow:visible}
.sc-head{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 12px 8px 14px; border-radius:3px 3px 0 0; background:var(--surface); border-left:3px solid var(--ta); border-bottom:1px solid var(--line)}
.sc-head .fl{flex:none; padding:1px 10px; border-radius:2px; background:var(--ta); color:var(--on-a); font:700 13px/1.5 var(--font-display)}
.sc-head h2{margin:0; font:700 23px/1.1 var(--font-display)}
.sc-head .sp{flex:1}
.counts{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; color:var(--ink-2)}
.counts span{display:inline-flex; align-items:center; gap:4px}
.counts b{color:var(--ink); font-weight:700}
.tools{position:relative}
.tools summary{list-style:none; cursor:pointer}
.tools summary::-webkit-details-marker{display:none}
.tools-menu{position:absolute; z-index:20; right:0; top:calc(100% + 6px); width:252px; padding:6px; border-radius:3px; background:var(--surface); border:1px solid var(--line-2); box-shadow:0 16px 40px -18px rgba(0,0,0,.45)}
.tools-menu .notion{display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px; border:0; border-radius:2px; background:none; color:var(--ink); font:inherit; font-size:13px; font-weight:500; text-align:left; text-decoration:none; cursor:pointer}
.tools-menu .notion:hover{background:var(--surface-2)}
.tools-menu .notion[aria-disabled="true"]{opacity:.62; cursor:not-allowed}
.tools-menu code{display:block; padding:6px 10px 4px; font:400 11.5px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.stage{position:relative; overflow:hidden; background:var(--sc-bg); touch-action:manipulation}   /* 장면 위에서도 세로 스크롤이 돼요 */
.stage-box{position:relative; width:100%; aspect-ratio:1000 / 560}
.scene-card > :last-child{border-radius:0 0 3px 3px}
.stage-tip{position:absolute; z-index:8; max-width:240px; padding:6px 10px; border-radius:3px; background:var(--ink); color:var(--floor); font-size:12.5px; line-height:1.35; pointer-events:none; box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
.stage-tip b{display:block; font-size:13px}
.stage-tip small{display:block; opacity:.85}
.meet-badge{position:absolute; z-index:6; right:10px; top:10px; max-width:calc(100% - 20px); padding:3px 10px; border-radius:2px; background:var(--meet); color:var(--on-s); font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none}
.sc-line{margin:0; padding:6px 16px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2)}
/* 팀원 명단: 장면과 같은 높이, 안에서 스크롤 */
.roster{position:relative; min-width:0; border-radius:4px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow)}
.ro-in{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0}
.ro-h{display:flex; align-items:center; gap:8px; padding:12px 14px 8px}
.ro-h h3{margin:0; font:700 18px/1.1 var(--font-display)}
.ro-h small{color:var(--ink-2); font-size:12.5px}
.ro-list{flex:1; min-height:0; overflow:auto; margin:0; padding:0 6px 8px; list-style:none; overscroll-behavior:contain}
.r{position:relative; border-radius:3px}
.r + .r{margin-top:2px}
.r:hover,.r.hl{background:var(--surface-2)}
.r:focus{outline:none}
.r-main{display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border:0; border-radius:3px; background:none; color:var(--ink); font:inherit; text-align:left}
button.r-main{cursor:pointer}
.ro-av{position:relative; flex:none; width:40px; height:40px; border-radius:2px; background:var(--tw); overflow:hidden}
.ro-av::before{content:""; position:absolute; left:8px; right:8px; bottom:0; height:12px; background:var(--ta)}
.ro-av i{position:absolute; left:11px; top:8px; width:18px; height:18px; background:var(--skin)}
.ro-av i::before{content:""; position:absolute; left:0; right:0; top:0; height:7px; background:var(--hair)}
.ro-av.has-face{background-size:cover; background-position:center; image-rendering:pixelated}   /* scene.portrait(id)의 얼굴 */
.ro-av.has-face::before,.ro-av.has-face i{display:none}
.ro-av.vac{background:none; border:1px dashed var(--line-2)}
.ro-av.vac::before,.ro-av.vac i{display:none}
.ro-av.vac::after{content:"?"; position:absolute; inset:0; display:grid; place-items:center; color:var(--ink-3); font:700 17px var(--font-display)}
.ro-av .ring{position:absolute; right:0; bottom:0; width:11px; height:11px; border-radius:2px; border:2px solid var(--surface); background:var(--rest)}
.r-t{flex:1; min-width:0}
.r-n{display:flex; align-items:center; gap:6px; min-height:22px}
.r-n b{font:700 15px/1.15 var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-n small{color:var(--ink-2); font-size:12px; white-space:nowrap}
.r-n small i{font-style:normal; color:var(--ink-3)}
.nw{flex:none; padding:0 7px; border-radius:2px; background:var(--hot); color:var(--on-s); font-size:11px; font-weight:700; line-height:1.6}
.r-task{display:block; color:var(--ink-2); font-size:12.5px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-st{flex:none; display:inline-flex; align-items:center; gap:4px; margin-left:auto; padding:1px 8px; border-radius:2px; background:var(--none-w); font-size:11.5px; font-weight:600; white-space:nowrap}
.r-st i{width:7px; height:7px; border-radius:2px; background:var(--rest)}
.st-q{color:var(--ink-2)}
.s-work{background:var(--work-w)} .s-work i{background:var(--work)}
.s-idle{background:var(--idle-w)} .s-idle i{background:var(--ok)}
.s-meet{background:var(--meet-w)} .s-meet i{background:var(--meet)}
.s-block{background:var(--block-w); box-shadow:inset 0 0 0 1px var(--err)} .s-block i{background:var(--err)}
.r-acts{display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:0 8px 8px 58px; font-size:12px; color:var(--ink-2)}
.r-acts.over{position:absolute; right:8px; bottom:7px; flex-wrap:nowrap; gap:2px; padding:0}
.r-main.has-ib .r-task{padding-right:58px}
.r .seat{padding:0 8px 8px 58px; border-top:0; flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px 10px}
.r .seat > .seat-st, .r .seat > .hint, .r .seat > .seat-pick{flex-basis:100%}
.r .seat > .su-more{order:2; margin-top:0}
.r .seat > .su-more[open]{flex-basis:100%}
.r .seat > .hint{order:3; padding-right:36px}
li.r:has(.seat) ~ li.r .seat > .hint[data-must]{display:none}   /* 안내 줄은 층의 첫 빈자리에만 둬요 */
.r .seat-ok{margin:0 8px 8px 58px; border-radius:2px}
.ib{display:inline-grid; place-items:center; width:26px; height:24px; padding:0; border:0; border-radius:3px; background:none; color:var(--ink-2); text-decoration:none; cursor:pointer}
.ib:hover{background:var(--line); color:var(--ink)}
.ib svg.i{width:14px; height:14px}
.cxc{flex:none; padding:0 6px; border-radius:2px; background:var(--w-b); color:var(--ink); font-size:11px; font-weight:700; line-height:1.6}
.r-main.is-edit{align-items:flex-start}
/* 아래 칸들 */
.grid3{display:grid; grid-template-columns:minmax(0,3.2fr) minmax(0,4.4fr) minmax(0,4.4fr); gap:12px; align-items:start}
.panel{padding:12px 16px 14px; border-radius:4px}
.panel h3{align-items:center; font-size:18px; line-height:1.15}
.panel > h3 .seg{margin-left:auto}
.meet-now{padding:9px 12px; border-radius:3px; background:var(--meet-w)}
.seg{display:inline-flex; gap:2px; padding:3px; border-radius:2px; background:var(--surface-2)}
.seg button{padding:2px 12px; border:0; border-radius:2px; background:none; color:var(--ink-2); font:600 12.5px var(--font-body); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.feed,.board{max-height:300px; overflow:auto}
.talk{margin:0; border-radius:4px}
.drawer-panel{border-radius:4px 0 0 4px}
.meet-quiet{margin:4px 0 0; font-weight:600}
.hero.no-stage{grid-template-columns:minmax(0,1fr)}   /* 장면이 꺼지면 명단이 제 높이를 가져요 */
.hero.no-stage .ro-in{position:static}
.hero.no-stage .ro-list{max-height:none; overflow:visible}
@media (max-width:1080px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .stage-box{max-height:55vh; max-height:55dvh}   /* 명단 첫 줄이 스크롤 없이 보이게 */
  .ro-in{position:static}
  .ro-list{max-height:none; overflow:visible}
  .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid3 .panel:first-child{grid-column:1 / -1}
}
@media (max-width:860px){
  .hdr-more{display:inline-flex}
  .hdr-chips{display:none}
  .more-note:not([hidden]){display:inline; margin-right:6px}
  .hdr-chips.show{position:absolute; z-index:25; right:0; top:calc(100% + 6px); width:232px; max-width:calc(100vw - 24px); display:flex; flex-direction:column; align-items:stretch; gap:4px; padding:6px; border-radius:3px; background:var(--surface); border:1px solid var(--line-2); box-shadow:0 16px 40px -18px rgba(0,0,0,.45)}
  .hdr-chips.show .live{justify-content:flex-start; flex-wrap:wrap; border-color:transparent; white-space:normal}
}
@media (max-width:720px){
  .grid3{grid-template-columns:minmax(0,1fr)}
  .floors{scrollbar-width:none}
  .ib{width:32px; height:28px; background:var(--surface-2)}
  .btn,.wrap .btn,.sc-head .btn,.seat-acts .btn,.seat-pick .btn,.fill-acts .btn,.talk-th-h .btn,.hdr .hdr-more,.btn-primary,.notion,.d-close{min-height:44px; min-width:44px}   /* 폰의 주요 단추: 글자가 있고 누르면 일이 일어나는 단추(운영 ★D3) */
  .btn-primary{display:inline-flex; align-items:center; justify-content:center}
  .d-tabs button,.composer .ho-tg{min-height:44px; min-width:44px}
  .seg button{min-height:24px}
  .r-main.has-ib{padding-bottom:18px; align-items:flex-start}
  .r-main.has-ib .r-task{padding-right:76px; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .r-acts.over{bottom:6px; gap:4px}
  .r .seat > .hint{padding-right:44px}
  .r .su-more > summary{min-height:44px; min-width:44px; padding:0; line-height:44px}
  .stage-box{aspect-ratio:4 / 3}
  .logo{font-size:22px}
  .logo svg{width:28px; height:28px}
  .ft{min-width:132px; padding-right:10px}
  .floors-w .order{display:none}
  .sc-head{position:relative; padding-left:12px}
  .tools{position:static}
  .tools-menu{left:12px; right:12px; width:auto}   /* 단추가 왼쪽으로 줄바꿈되면 252px 메뉴가 화면 밖으로 나가요 */
  .su-more > summary{padding:3px 0}   /* 누를 곳 24px 이상(운영 ★D3) */
  .sc-head h2{font-size:21px}
  .drawer-panel{border-radius:4px 4px 0 0}
}
/* 대화 사진 (U-28) */
.msg-pics{display:grid; grid-template-columns:repeat(2, minmax(0, 148px)); gap:4px; margin-top:6px; white-space:normal}
.msg-pics[data-n="1"]{grid-template-columns:minmax(0, 200px)}
.pic{display:block; width:100%; height:auto; aspect-ratio:4/3; padding:0; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#6B6A65; cursor:zoom-in}
.pic:hover{border-color:var(--ink-3)}
.pic img{display:block; width:100%; height:100%; object-fit:contain}
.pic-miss{display:grid; place-items:center; padding:6px; border:1px dashed var(--line-2); background:none; color:var(--ink-2); font-size:12px; line-height:1.35; text-align:center; word-break:keep-all; cursor:default}
.pic-miss:hover{border-color:var(--line-2)}
.msg.me .pic-miss{color:var(--me-ink); border-color:currentColor}   /* 대표 말풍선(흑연·밝은 돌) 안에서도 또렷하게 */
.msg.me .pic:focus-visible{outline-color:var(--me-ink)}
.b > .msg-pics:first-child,.md > .msg-pics{margin-top:0}

.att-band{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px}
.att{list-style:none; margin:0; padding:0; display:flex; flex:none; gap:6px}
.att li{position:relative; flex:none; width:52px; height:52px; border:1px solid var(--line-2); border-radius:3px; overflow:hidden; background:#6B6A65}
.att img{display:block; width:100%; height:100%; object-fit:cover}
.att button{position:absolute; top:0; right:0; display:grid; place-items:center; box-sizing:border-box; width:24px; height:24px; padding:0 0 6px 6px; border:0; background:rgba(18,20,24,.82) content-box; color:#F2F0EA; font-size:13px; line-height:1; cursor:pointer}
.att button:hover{background-color:rgba(18,20,24,.96)}
.att button:focus-visible{outline-offset:-2px}
.att-note{flex:1 1 120px; margin:0; font-size:12px; color:var(--ink-2); word-break:keep-all}
.composer[data-busy] .att img{opacity:.45}
.composer[data-busy] .att button{display:none}
.att li[data-st="up"]::after{content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--ink); animation:pulse 1.2s ease-in-out infinite}
.att li[data-st="bad"]{border-color:var(--err-ink); box-shadow:inset 0 0 0 1px var(--err-ink)}
.att li[data-st="bad"]::after{content:"!"; position:absolute; left:0; bottom:0; display:grid; place-items:center; width:18px; height:18px; border-top-right-radius:3px; background:var(--err-ink); color:var(--surface); font-size:12px; font-weight:700; line-height:1}
@media (max-height:600px),(max-width:559px){
  .drawer-panel.chat .composer:has(.att-band:not([hidden])) textarea[name="text"]{max-height:88px}   /* 사진이 붙은 동안 글칸이 대화 칸을 덜 먹게 */
}
@media (max-height:600px){
  .msg-pics[data-n="1"]{grid-template-columns:minmax(0, 148px)}
}

.drawer-panel.dropping::after{content:"여기에 놓으면 붙어요"; position:absolute; z-index:5; inset:8px; display:grid; place-items:center; border:2px dashed var(--ink-3); border-radius:3px; background:color-mix(in srgb, var(--surface) 90%, transparent); color:var(--ink); font-size:14px; font-weight:600; pointer-events:none}

.pic-view{position:fixed; inset:0; z-index:55; display:grid; place-items:center; padding:calc(60px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); background:rgba(14,15,18,.94)}
.pic-view img{position:static; display:block; background:#6B6A65; width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; min-width:0; min-height:0}
.pic-view .d-close{position:absolute; top:calc(12px + env(safe-area-inset-top, 0px)); right:16px; border-color:var(--ink-3)}
.att-also{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin:0; font-size:12px; color:var(--ink-2)}
.att-also button{min-height:30px; padding:4px 10px; border:1px solid var(--line-2); border-radius:2px; background:var(--surface); color:var(--ink); font:inherit; font-size:12.5px; font-weight:600; text-decoration:none; cursor:pointer}
.att-also button:hover{border-color:var(--ink-3)}
@media (max-width:720px){.att-also button{min-height:44px; min-width:44px}}   /* 폰의 주요 단추와 같아요. 위 30px 규칙보다 뒤에 둬요 */
.pic-wait{margin:0; font-size:12px; color:var(--ink); word-break:keep-all}
.pic-wait::before{content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:2px; background:var(--work); vertical-align:1px; animation:pulse 1.2s ease-in-out infinite}

const fillDone = q => (q.skipped ? (q.seated ? `빈자리 ${q.seated}개를 채웠어요 · ${q.skipped}개는 건너뛰었어요` : `빈자리 ${q.skipped}개를 모두 건너뛰었어요`) : `빈자리 ${q.seated}개를 모두 채웠어요`);

const fillMsg = c => (fillNeed(c) ? '다음 자리를 열어 주세요' : c.state === 'failed' || c.state === 'error' ? c.error || '자리에 앉히지 못했어요' : FILL_MSG[c.state] || FILL_MSG.waiting);
function fillLineHTML(w) {   // w: 'o' 사무실 · 's' 설정(단추 id가 겹치지 않게)

  const err = FILL.err ? `<p class="fill-err" role="alert">${esc(FILL.err)}</p>` : '';
  if (!q) return FILL.note ? `<p class="fill-st">${esc(FILL.note)}</p>${err}` : err;
  if (!q.cur) return `<p class="fill-st ok">${esc(fillDone(q))}${q.seated ? ' <b aria-hidden="true">✓</b>' : ''}</p><div class="fill-acts">${b('close', '닫기', '', '빈자리 채우기 알림 닫기')}</div>${err}`;
  const c = q.cur, who = seatWho(c.team, c.role), stop = fillStopped(c), need = fillNeed(c);
  const main = need ? b('open', '다음 자리 열기', ' primary', `${who} 자리 링크 열기`) : stop ? b('open', '다시 열기', ' primary', `${who} 자리 링크 다시 열기`) : '';
  // 고르기는 그 자리 상자에서 해요. 이 화면에 그 상자가 안 보이면(다른 층을 보는 중이거나 설정 화면) 이 줄 아래에 같은 상자를 보여요
  const k = seatKey(c.team, c.role), area = w === 's' ? '#suBody' : '#rooms';
  const pick = c.state === 'pick' && !$$(`${area} [data-seat-box]`).some(el => el.dataset.seatBox === k) ? seatBoxHTML(c.team, c.role, w === 's' ? 'f' : 'q', ' fill-seat') : '';
  return `<p class="fill-st${stop ? ' bad' : c.state === 'waiting' && !need ? ' wait' : ''}"><b>${esc(`${q.pos}/${q.total}`)}</b> · ${esc(who)} · ${esc(fillMsg(c))}</p>
    <div class="fill-acts">${main}${b('skip', '건너뛰기', '', `${who} 자리 건너뛰기`)}${b('stop', '멈추기', '', '빈자리 채우기 멈추기')}</div>${pick}${err}`;

// 줄을 다시 그려요(같은 글이면 그대로). 키보드가 줄의 단추에 있었으면(그 단추가 꺼지거나 없어져도) 같은 단추, 없으면 줄로 돌려줘요
function fillPaint() {
  for (const [id, w] of [['fillLine', 'o'], ['suFill', 's']]) {
    const el = document.getElementById(id);
    if (!el) continue;
    const a = document.activeElement, inside = !!a && a !== el && el.contains(a), act = inside && a.dataset ? a.dataset.fill || '' : '';

    const had = el.contains(document.activeElement);

function fillFocusOut(w) {   // 줄이 없어졌어요: 설정은 결과의 단추·제목으로, 사무실은 이 층의 [빈자리 모두 만들기]나 층 안내의 지금 층으로

// at: 이 물음을 보낸 때. 그 뒤에 이 화면에서 바꾼 줄(시작·건너뛰기·멈추기)은 다음 답부터 맞춰요

  if (JSON.stringify(q) === JSON.stringify(was)) return;
  FILL.q = q;
  if (q) FILL.note = '';
  const c = q && q.cur, w = was && was.cur, same = !!(c && w && c.team === w.team && c.role === w.role), who = c ? seatWho(c.team, c.role) : '';

// 시작·건너뛰기·다시 열기의 답: 줄을 바꾸고, 링크가 왔으면 세션 만들기처럼 그 자리를 ‘기다리는 중’으로 두고 열어요

/* ---------- 층 머리: 섹션 맞추기 · 규칙 맞추기 ---------- */
// [섹션 맞추기]: Claude 앱 사이드바에 층 이름의 그룹(섹션)을 만들고 이 층 세션들을 옮기도록 총괄에게 맡겨요(/api/floor/sidebar).

// 층 안내 아래 한 줄: RULES.md가 예전 판인 층(에이전시티 부분이 없거나 낮은 판, 0.8.x 이하로 만든 층)이 있으면 [모두 맞추기]로 그 층들에 규칙 맞추기를 차례로 해요.

async function linkRules(tid) {
  const R = SU.rules, cur = R.res[tid];
  if (cur && cur.busy) return cur;
  const f = floorById(tid), mr = SU.madeRun.find(x => x.id === tid), nm = (f && f.name) || (mr && mr.name) || tid;

  try {
    const r = await post('api/floor/link-rules', { team: tid });
    const g = r.git && typeof r.git === 'object' ? r.git : {};
    const gt = !g.repo ? '' : g.excluded === true ? ' · git에는 올라가지 않게 해 뒀어요' : g.already === true ? ' · git에는 올라가지 않아요' : typeof g.skipped === 'string' && g.skipped ? ` · ${cut(g.skipped, 80)}` : '';

// 추천 팀 보내기(화면은 그리지 않아요): 만든 것·못 만든 까닭을 적고 { created, errors, jobs }를 돌려줘요.
// boss: 같이 정할 총괄(처음 화면의 [있는 세션 쓰기]에서 고른 세션만). 층을 만들 때 미리 고른 후보를 몰래 보내지 않아요
async function recMakeSend(list, boss) {
  const R = SU.rec, used = seatsInUse();
  await flushOrder();   // 층 순서를 저장하는 중이면 끝난 뒤에 보내요
  const ids = recIds(recShown());
  const jobs = list.map(rec => ({ rec, id: ids.get(rec.key), spec: recSpec(rec, ids.get(rec.key), used) }));
  let res;
  try { res = await sp('floors', { boss: boss || null, floors: jobs.map(x => x.spec) }); }
  catch (e) { if (!e.body || !Array.isArray(e.body.errors) || !e.body.errors.length) throw e; res = e.body; }   // 모두 못 만들었어도 추천마다 까닭을 보여 줘요
  const created = Array.isArray(res.created) ? res.created : [], errors = Array.isArray(res.errors) ? res.errors : [];
  for (const x of jobs) delete R.errs[x.rec.key];   // 이번에 보낸 줄의 까닭만 지우고 새로 적어요(앞 묶음의 까닭은 그대로)
  for (const x of jobs) {
    const er = errors.find(y => y.id === x.id), made = created.find(y => y.id === x.id);
    if (er) R.errs[x.rec.key] = String(er.error || '만들지 못했어요');
    if (!made) continue;
    R.done.add(x.rec.key);
    if (x.rec.source === 'group') SU.madeAt['g:' + x.rec.key] = x.id;   // 직접 고르기 나무에서도 ‘이미 층’으로
    madeRunAdd(made, { id: x.id, name: x.rec.name, fresh: !x.rec.folder, display: x.rec.folder ? tilde(x.rec.folder) : `~/agencity-teams/${x.id}` });
  }
  return { created, errors, jobs };
}
async function recMakeAll() {
  const R = SU.rec, shown = recShown(), used = seatsInUse(), list = shown.slice(0, R.show).filter(r => recLive(r, used)).slice(0, FLOORS_MAX);   // 보이는 카드만, 서버가 받는 수까지

/* GitHub 기기 로그인: 코드를 보여 주고, 서버가 알려 준 간격(interval초)마다 승인됐는지 물어요. */
function ghStop() { clearTimeout(SU.gh.timer); SU.gh.timer = 0; SU.gh.seq++; }
function ghSchedule() { const seq = SU.gh.seq; clearTimeout(SU.gh.timer); SU.gh.timer = setTimeout(() => ghPoll(seq), SU.gh.flow.interval * 1000); }
function ghNote(t) { SU.gh.note = t; const el = $('#suGhState'); if (el) el.textContent = t; }
function ghEnd(msg) { ghStop(); SU.gh.flow = null; SU.gh.note = ''; SU.err = msg; if (SU.open && SU.view === 'city') renderSetup(); }
async function ghStart() {
  ghStop();
  const r = await sp('github/start');
  const code = String(r.userCode || ''), uri = String(r.verificationUri || '');
  if (!code) throw new Error('로그인 코드를 받지 못했어요. 잠시 뒤 다시 해 주세요');
  SU.gh.flow = { code, uri: /^https?:\/\//i.test(uri) ? uri : '', interval: Math.max(1, Number(r.interval) || 5), until: Date.now() + Math.max(60, Number(r.expiresIn) || 900) * 1000 };
  SU.gh.fails = 0; SU.gh.note = '';
  renderSetup('#suCopy');
  suSay('로그인 코드를 받았어요. 코드를 복사해서 GitHub 페이지에 넣어요.');
  ghSchedule();
}
async function ghPoll(seq) {
  const f = SU.gh.flow;
  if (!f || seq !== SU.gh.seq || !SU.open) return;
  if (Date.now() > f.until) { ghEnd('코드 시간이 지났어요. ‘GitHub로 로그인’을 다시 눌러 주세요'); return; }
  let r;
  try { r = await sp('github/poll'); SU.gh.fails = 0; }
  catch (e) {
    if (seq !== SU.gh.seq) return;
    if (++SU.gh.fails >= 3) { ghEnd(e.message); return; }
    ghNote(`잠깐 확인하지 못했어요. 다시 물어볼게요 (${e.message})`);
    ghSchedule();
    return;
  }
  if (seq !== SU.gh.seq) return;
  if (r.status === 'ok') {
    ghStop(); SU.gh.flow = null; SU.gh.note = '';
    try { await refreshSetup(); } catch (e) { SU.st.github = { login: String(r.login || ''), via: 'device' }; }
    if (SU.open) { renderSetup(SU.view === 'city' ? '#suLoginH' : undefined); suSay(`GitHub ${SU.st.github ? '@' + SU.st.github.login : ''} 계정으로 연결했어요`); }
    return;
  }
  if (r.status === 'expired') { ghEnd('코드 시간이 지났어요. ‘GitHub로 로그인’을 다시 눌러 주세요'); return; }
  if (r.status === 'denied') { ghEnd('GitHub에서 연결을 거절했어요. 다시 하려면 ‘GitHub로 로그인’을 눌러요'); return; }
  const iv = Number(r.interval);
  if (r.status === 'slow_down') f.interval = iv > f.interval ? iv : f.interval + 5;   // GitHub가 천천히 물어 달라고 하면 간격을 늘려요
  else if (iv >= 1) f.interval = iv;
  ghNote(`승인을 기다리는 중이에요 · ${Math.max(1, Math.ceil((f.until - Date.now()) / 60000))}분 안에 해 주세요. 승인하면 여기가 저절로 바뀌어요`);
  ghSchedule();
}

    if (p.kind === 'rec') { SU.rec.done.add(p.recKey); if (p.tkey) SU.madeAt[p.tkey] = p.id; }   // 추천 팀에서 옮겨 와 만든 층
