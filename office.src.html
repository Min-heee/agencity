<title>에이전시티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 회사 건물. 맨 위 층 안내(총괄 아래로, 좁은 창에서는 건물처럼 입주 예정 → 높은 층 → 1층, 넓은 창에서는 왼쪽부터 1층·2층…), 그 아래에는 고른 층 하나의 사무실만.
   사무실 왼쪽은 책상(팀장과 팀원들, 역할 이름은 층마다 달라요), 오른쪽은 회의실과 업무판, 아래는 활동 기록과 보고서.
   고른 층은 주소 끝(#<팀 id>)과 브라우저에 기억한다.
   모든 상태는 팀 사무실 폴더(.office)의 파일에서 몇 초마다 다시 읽는다. */
:root{
  --floor:#E2E7EE; --floor-2:#DBE1E9;
  --surface:#FFFFFF; --surface-2:#F0F3F7;
  --ink:#172030; --ink-2:#4F5D72; --ink-3:#8591A3; --line:#D0D8E2; --line-2:#A9B4C3;
  --focus:#2563EB; --scrim:rgba(12,16,24,.42);
  --plate:#1C2330; --plate-ink:#F3F5F8; --plate-rim:#3A4456; --gold:#D4A23A;
  --desk-top:#D9B88F; --desk-edge:#B98F60; --chair:#3A4150;
  --monitor:#1D232E; --screen:#101820; --screen-mid:#12243A; --screen-on:#133554;
  --screen-ink:#D6EAF8; --screen-dim:rgba(214,234,248,.4); --screen-call:#FFC861;
  --glow:#FFD27A; --table:#C9A57A; --table-edge:#A9825A; --room:#EEF1F5;
  --rack:#20252D; --rack-2:#2B313B; --rack-ink:#E4E8EE; --rack-ink-2:#98A2B0;
  --work:#F0A00C; --ok:#22B36A; --rest:#8591A3; --err:#E5484D; --meet:#7A5AC8;
  --err-ink:#C42730; --on-a:#FFFFFF; --chip-wash:rgba(0,0,0,.22); --chip-wash-2:rgba(0,0,0,.32);
  --w-a:#DFEDDE; --a-a:#267A4A;
  --w-b:#DCE7F5; --a-b:#3C6FC4;
  --w-c:#F5E0EA; --a-c:#B0406F;
  --w-hq:#E4E8EF; --a-hq:#2A3448;
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","Nanum Gothic Coding",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --floor:#0F141B; --floor-2:#121822; --surface:#171E28; --surface-2:#1F2834;
    --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --line-2:#465163;
    --focus:#7AA7FF; --scrim:rgba(0,0,0,.6);
    --plate:#0A0E14; --plate-ink:#F3F5F8; --plate-rim:#3A4659; --gold:#E5B75A;
    --desk-top:#6E5136; --desk-edge:#4F3A26; --chair:#0F131A;
    --monitor:#0A0D12; --screen:#0A1219; --screen-mid:#0F2133; --screen-on:#12324F;
    --glow:#FFC861; --table:#6E5136; --table-edge:#4F3A26; --room:#1B222D;
    --rack:#0E1217; --rack-2:#1A2029; --rack-ink:#E4E8EE; --rack-ink-2:#8A94A3;
    --work:#FFB224; --ok:#3DD68C; --rest:#6F7B8E; --err:#FF6369; --meet:#A68BEA;
    --err-ink:#FF8A8E; --on-a:#0E1218; --chip-wash:rgba(255,255,255,.22); --chip-wash-2:rgba(255,255,255,.32);
    --w-a:#1E2D22; --a-a:#4CC07E; --w-b:#1D293A; --a-b:#6F9BE0; --w-c:#33222C; --a-c:#E0728F; --w-hq:#20252E; --a-hq:#9AA6BA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --floor:#0F141B; --floor-2:#121822; --surface:#171E28; --surface-2:#1F2834;
  --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6F7B8E; --line:#2A3443; --line-2:#465163;
  --focus:#7AA7FF; --scrim:rgba(0,0,0,.6);
  --plate:#0A0E14; --plate-ink:#F3F5F8; --plate-rim:#3A4659; --gold:#E5B75A;
  --desk-top:#6E5136; --desk-edge:#4F3A26; --chair:#0F131A;
  --monitor:#0A0D12; --screen:#0A1219; --screen-mid:#0F2133; --screen-on:#12324F;
  --glow:#FFC861; --table:#6E5136; --table-edge:#4F3A26; --room:#1B222D;
  --rack:#0E1217; --rack-2:#1A2029; --rack-ink:#E4E8EE; --rack-ink-2:#8A94A3;
  --work:#FFB224; --ok:#3DD68C; --rest:#6F7B8E; --err:#FF6369; --meet:#A68BEA;
  --err-ink:#FF8A8E; --on-a:#0E1218; --chip-wash:rgba(255,255,255,.22); --chip-wash-2:rgba(255,255,255,.32);
  --w-a:#1E2D22; --a-a:#4CC07E; --w-b:#1D293A; --a-b:#6F9BE0; --w-c:#33222C; --a-c:#E0728F; --w-hq:#20252E; --a-hq:#9AA6BA;
}
*{box-sizing:border-box}
body{background-color:var(--floor); background-image:repeating-conic-gradient(var(--floor) 0 25%, var(--floor-2) 0 50%); background-size:96px 96px; color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.wrap{max-width:1440px; margin:0 auto; padding-block:22px 56px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
[data-team="hq"]{--tw:var(--w-hq); --ta:var(--a-hq)}
/* 팀 색: org.json의 tone(a·b·c) 또는 층 번호 순서로 정해요. 팀 id와 상관없이 어떤 팀이든 색이 들어가요. */
[data-tone="a"]{--tw:var(--w-a); --ta:var(--a-a)}
[data-tone="b"]{--tw:var(--w-b); --ta:var(--a-b)}
[data-tone="c"]{--tw:var(--w-c); --ta:var(--a-c)}
[data-tone="hq"]{--tw:var(--w-hq); --ta:var(--a-hq)}

/* 머리말 */
.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px}
.sign{display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; min-width:0; flex:1 1 560px}
.plate{position:relative; margin:0; white-space:nowrap; font-family:var(--font-display); font-weight:400; font-size:32px; line-height:1; background:var(--plate); color:var(--plate-ink); padding:11px 22px 9px; border-radius:6px; box-shadow:inset 0 0 0 2px var(--plate-rim), 0 3px 0 var(--plate-rim)}
.plate::before,.plate::after{content:""; position:absolute; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--plate-rim)}
.plate::before{left:7px} .plate::after{right:7px}
.sign-sub{flex:1 1 300px; min-width:0; max-width:66ch}
.sign-sub p{margin:0; color:var(--ink-2); font-size:13.5px; text-wrap:pretty}
.sign-sub b{color:var(--ink); font-weight:600}
.live{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; color:var(--ink-2)}
.live i{width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 2s ease-in-out infinite}
.live.snap i{background:var(--rest); animation:none}
.live.lost i{background:var(--err); animation:none}
.live b{font-family:var(--font-mono); font-weight:500; color:var(--ink)}

.sec-title{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin:0 0 12px}
.sec-title h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:22px; line-height:1.1}
.sec-title p{margin:0; font-size:13px; color:var(--ink-2)}

/* 조직도 */
.org{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.org-top{position:relative; display:flex; justify-content:center}
.org-top::after{content:""; position:absolute; left:50%; bottom:-20px; height:20px; border-left:2px solid var(--line-2)}
.hq-node{display:flex; align-items:center; gap:12px; padding:10px 16px 10px 10px; border-radius:10px; background:var(--plate); color:var(--plate-ink); box-shadow:inset 0 0 0 2px var(--plate-rim)}
.hq-node .av{background:var(--gold); color:#1C2330}
.hq-node b{display:block; font-family:var(--font-display); font-weight:400; font-size:21px; line-height:1.1}
.hq-node small{display:block; font-size:12px; color:#AEB8C7}
.hq-node a{margin-left:6px; padding:5px 10px; border-radius:5px; background:rgba(255,255,255,.12); color:var(--plate-ink); font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap}
.hq-node a:hover{background:rgba(255,255,255,.22)}
/* 층 카드는 한 줄에 다섯 칸까지(--cols: 층 수, 다섯까지)이고 넘으면 다음 줄로 넘어가요. 총괄에서 내려온 줄기는 층 묶음 전체를 덮는 지붕 선에 닿고,
   카드마다 선을 따로 긋지 않아서 몇 층이든 줄이 깨지지 않아요. 899px 아래에서는 한 줄씩, 왼쪽 줄기에서 카드마다 ㄴ자 가지를 그어요. */
.org-branches{position:relative; margin:40px auto 0; display:grid; grid-template-columns:repeat(var(--cols, 5), minmax(0, 220px)); justify-content:center; gap:12px; width:fit-content; max-width:100%}
.org-branches::before{content:""; position:absolute; top:-20px; left:0; right:0; height:14px; border:2px solid var(--line-2); border-bottom:0; border-radius:9px 9px 0 0}
.ot-cell{position:relative; display:flex; flex-direction:column; gap:6px; min-width:0}
.ot-cell > .org-team{flex:1 1 auto}
.ot-move{display:flex; justify-content:center; gap:6px}
.mv{width:36px; height:32px; padding:0; justify-content:center; font-size:16px; line-height:1}
.mv[aria-disabled="true"]{opacity:.4; cursor:default}
.org-tools{margin-left:auto; display:flex; align-items:center; gap:8px}
.org-note{margin:-4px 0 10px}
.org-note:empty{display:none}
.org-note.bad,.setup .su-ordnote.bad{color:var(--err-ink)}
.org-team{position:relative; display:flex; flex-direction:column; gap:5px; width:100%; min-width:0; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; transition:box-shadow .2s, border-color .2s}
.org-team:hover{border-color:var(--ink-3)}
.org-team.on{border-color:var(--ta); background:color-mix(in srgb, var(--tw) 45%, var(--surface))}
.org-team[aria-pressed="true"]{border-color:var(--ta); box-shadow:0 0 0 3px color-mix(in srgb, var(--ta) 38%, transparent)}
.ot-head{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-width:0}
.fl-no{flex:none; font:600 11.5px var(--font-mono); padding:2px 7px; border-radius:3px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.org-team[aria-pressed="true"] .fl-no{background:var(--ta); color:var(--on-a)}
.ot-name{font-family:var(--font-display); font-size:19px; line-height:1.1; overflow-wrap:break-word}
.ot-row{font-size:12.5px; color:var(--ink-2)}
.ot-row b{color:var(--ink); font-weight:600}
.badge{align-self:flex-start; font-size:11px; font-weight:600; padding:2px 7px; border-radius:3px; background:var(--surface-2); color:var(--ink-2)}
.org-team.on .badge{background:var(--ta); color:var(--on-a)}

/* 팀 사무실 */
.room{margin-top:22px; background:color-mix(in srgb, var(--tw) 50%, var(--surface)); border:1px solid color-mix(in srgb, var(--ta) 40%, var(--line)); border-radius:12px; padding:0 14px 14px}
.room-head{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:-1px -15px 14px; padding:11px 15px; border-radius:12px 12px 0 0; background:var(--ta); color:var(--on-a)}
.room-head .tn{font-family:var(--font-display); font-size:26px; line-height:1}
.room-head .fl{font:600 13px var(--font-mono); padding:3px 8px; border-radius:3px; background:var(--chip-wash)}
.room-head .kind{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:3px; background:var(--chip-wash)}
.room-head .meta{margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; font-size:12.5px}
.room-head code{font:500 12px var(--font-mono)}
.room-head .notion{padding:3px 9px; border-radius:4px; background:var(--chip-wash); color:inherit; font-weight:600; text-decoration:none; white-space:nowrap}
.room-head .notion:hover{background:var(--chip-wash-2)}
.room-head button.notion{border:0; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
.room-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr); gap:16px; align-items:start}
.desks{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
@media (min-width:560px){ .desks.many{grid-template-columns:repeat(auto-fill, minmax(230px, 1fr))} }   /* 팀원이 많으면 한 줄에 셋 이상 */
.side{display:flex; flex-direction:column; gap:14px; min-width:0}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0}
.panel h3{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 8px; font-family:var(--font-display); font-weight:400; font-size:19px}
.panel h3 span{font:500 12px var(--font-body); color:var(--ink-3)}

/* 책상 */
.desk{position:relative; display:flex; flex-direction:column; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; transition:box-shadow .3s, border-color .3s}
.desk:hover{border-color:var(--ink-3)}
.desk.is-work{border-color:var(--work); box-shadow:0 0 0 3px color-mix(in srgb, var(--work) 30%, transparent)}
.desk.is-meet{border-color:var(--meet)}
.desk.is-block{border-color:var(--err); box-shadow:0 0 0 3px color-mix(in srgb, var(--err) 25%, transparent)}
.desk.is-vacant{border-style:dashed; cursor:default}
.plate-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 11px 8px}
.who{display:flex; flex-direction:column; min-width:0}
.nm{font-family:var(--font-display); font-size:21px; line-height:1.05; overflow-wrap:anywhere}
.nm .rl,.d-title .rl,.feed .rl,.msg .rl,.board .rl,.chips .rl,.appr-top .rl,.meet-now .rl,.hint .rl,.talk-who .rl,.seat .rl{margin-left:5px; font:500 11px var(--font-body); letter-spacing:0; color:var(--ink-3); white-space:nowrap}
.d-title .rl{margin-left:8px; font-size:14px; color:var(--ink-2)}
.nm-pen{margin-left:3px; min-width:26px; min-height:26px; padding:1px 5px; border:0; border-radius:5px; background:none; color:var(--ink-3); font:400 13px/1 var(--font-body); letter-spacing:0; vertical-align:middle; cursor:pointer}
.nm-pen:hover,.nm-pen:focus-visible{color:var(--ink); background:var(--surface-2)}
.nm-edit{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; min-width:0; font:400 13px/1.35 var(--font-body); cursor:default}
.nm-edit .nm-in{flex:1 1 7em; min-width:0; padding:5px 8px; border:1px solid var(--line-2); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit; font-size:14px}
.nm-edit .nm-in[aria-invalid="true"]{border-color:var(--err)}
.nm-edit .btn{padding:4px 10px; font-size:12.5px}
.nm-edit .hint,.nm-edit .err{flex:1 1 100%}
.when{font:500 11px var(--font-mono); color:var(--ink-3); margin-top:2px}
.status{display:inline-flex; align-items:center; gap:5px; flex:none; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--ink-2); font-size:11.5px; font-weight:500; white-space:nowrap}
.sd{width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; background:var(--rest)}
.sd.work{background:var(--work); animation:pulse 1.2s ease-in-out infinite}
.sd.here{background:var(--ok)}
.sd.meet{background:var(--meet)}
.sd.block{background:var(--err)}
.sd.none{background:transparent; box-shadow:inset 0 0 0 1.5px var(--rest)}
.scene{position:relative; container-type:inline-size; line-height:0}
.scene svg{display:block; width:100%; height:auto}
.screen-ui{position:absolute; left:25.833%; top:6.667%; width:50%; height:44%; padding:3cqw 3.4cqw; display:flex; flex-direction:column; gap:1.3cqw; overflow:hidden; color:var(--screen-ink); line-height:1.3}
.screen-call{font:500 3.2cqw var(--font-mono); color:var(--screen-call); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.screen-msg{font-size:3.9cqw; font-weight:500; word-break:keep-all; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.is-here .screen-ui,.is-meet .screen-ui,.is-vacant .screen-ui{color:var(--screen-dim)}
.caret{display:inline-block; width:.48em; height:1em; margin-left:2px; vertical-align:-.16em; background:currentColor; animation:caret 1s steps(2) infinite}
.bubble{position:absolute; right:2%; top:3%; max-width:36%; padding:1.6cqw 2.6cqw; border-radius:2.4cqw; background:var(--surface); color:var(--ink); font-size:3.5cqw; line-height:1.35; font-weight:500; box-shadow:0 2px 8px rgba(0,0,0,.25); word-break:keep-all; overflow-wrap:anywhere}
.bubble::after{content:""; position:absolute; left:18%; bottom:-1.6cqw; border:1.6cqw solid transparent; border-top-color:var(--surface); border-bottom:0}
.screen-bg{fill:var(--screen)}
.is-work .screen-bg{fill:var(--screen-on)}
.glow{opacity:0} .is-work .glow{opacity:.55}
.head{transform-box:fill-box; transform-origin:50% 90%}
.is-work .head{animation:bob .42s ease-in-out infinite alternate}
.is-meet .person,.is-vacant .person,.is-vacant .mug{display:none}
.pwr{fill:var(--ok)} .is-work .pwr{fill:var(--work); animation:blink .32s steps(2) infinite}
.steam path{opacity:0; transform-box:fill-box}
.is-work .steam path{animation:steam 2.2s ease-out infinite}
.is-work .steam path:nth-child(2){animation-delay:.8s}
.away-note{position:absolute; left:50%; bottom:10%; transform:translateX(-50%); padding:1.2cqw 3cqw; border-radius:1.6cqw; background:var(--meet); color:#fff; font-size:3.6cqw; font-weight:600; white-space:nowrap}
.task{padding:8px 11px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-2); min-height:36px; display:flex; align-items:center; gap:6px}
.task b{font:600 11.5px var(--font-mono); color:var(--ink)}
.desk-foot{margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 9px 7px; background:var(--rack); color:var(--rack-ink); font-size:11px}
.desk-foot code{font:500 10.5px var(--font-mono); color:var(--rack-ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.open-chat{flex:none; display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:4px; background:var(--rack-2); color:var(--rack-ink); font-size:11px; font-weight:600; text-decoration:none}
.open-chat::after{content:"↗"; font-size:10px}
.open-chat:hover{background:#fff; color:#111}

/* 회의실 */
.meet-svg{display:block; width:100%; height:auto; border-radius:8px}
.meet-state{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px}
.meet-state b{font-weight:600}
.meet-file{margin-top:6px; padding:0; border:0; background:none; color:var(--ink); font:500 12px var(--font-mono); text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:3px; cursor:pointer; text-align:left; overflow-wrap:anywhere}

/* 업무판 */
.board{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.board li{display:grid; grid-template-columns:18px minmax(0,1fr); gap:3px 8px; padding:7px 0; border-top:1px solid var(--line); font-size:13px}
.board li:first-child{border-top:0}
.board .ck{width:14px; height:14px; margin-top:3px; border-radius:3px; border:1.5px solid var(--line-2)}
.board li.done .ck{background:var(--ok); border-color:var(--ok)}
.board li.done .bt{color:var(--ink-3); text-decoration:line-through}
.board .bm{grid-column:2; display:flex; flex-wrap:wrap; gap:4px 8px; font-size:11.5px; color:var(--ink-3)}
.board .bm code{font:600 11px var(--font-mono); color:var(--ink-2)}
.chip{display:inline-block; padding:1px 6px; border-radius:3px; background:var(--surface-2); color:var(--ink-2); font-size:11px; font-weight:500}
.chip.wait{background:color-mix(in srgb, var(--work) 22%, var(--surface)); color:var(--ink)}
.empty{font-size:12.5px; color:var(--ink-3)}

/* 기록 */
.bottom{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr); gap:16px; margin-top:16px}
.feed{list-style:none; margin:0; padding:0; max-height:340px; overflow:auto}
.feed li{display:grid; grid-template-columns:44px minmax(0,1fr); gap:2px 10px; padding:7px 0; border-top:1px solid var(--line); font-size:13px}
.feed li:first-child{border-top:0}
.feed time{font:500 11.5px var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
.feed .route{font-size:12px; color:var(--ink-2)}
.feed .route b{color:var(--ink); font-weight:600}
.k{display:inline-block; margin-right:6px; padding:0 6px; border-radius:3px; font-size:11px; font-weight:600; background:var(--surface-2); color:var(--ink-2)}
.k.지시,.k.업무{background:color-mix(in srgb, var(--focus) 16%, var(--surface)); color:var(--ink)}
.k.보고{background:color-mix(in srgb, var(--ok) 20%, var(--surface)); color:var(--ink)}
.k.회의{background:color-mix(in srgb, var(--meet) 20%, var(--surface)); color:var(--ink)}
.k.질문{background:color-mix(in srgb, var(--work) 22%, var(--surface)); color:var(--ink)}
.files{list-style:none; margin:0; padding:0}
.files li + li{border-top:1px solid var(--line)}
.files button{width:100%; padding:7px 0; border:0; background:none; color:var(--ink); font:500 12px var(--font-mono); text-align:left; cursor:pointer; overflow-wrap:anywhere}
.files button:hover{text-decoration:underline}

/* 명령 도우미 */
.howto{margin-top:16px}
.cmds{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:8px}
.cmd{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2)}
.cmd code{font:500 12.5px var(--font-body); color:var(--ink); overflow-wrap:anywhere}
.cmd button{flex:none; padding:4px 9px; border-radius:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; cursor:pointer}

/* 입주 예정 층 */
.later-card{background:var(--surface); border:1px dashed var(--line-2); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.later-card b{font-family:var(--font-display); font-weight:400; font-size:19px}
.later-card p{margin:0; font-size:12.5px; color:var(--ink-2)}
.later-card a{align-self:flex-start; font-size:12px; font-weight:600}

/* 서랍 */
.drawer{position:fixed; inset:0; z-index:50; display:flex; justify-content:flex-end}
.drawer-bg{position:absolute; inset:0; background:var(--scrim)}
.drawer-panel{position:relative; width:min(520px, 100%); height:100%; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); color:var(--ink); padding:calc(14px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 22px; box-shadow:-24px 0 60px -30px rgba(0,0,0,.55); animation:slidein .22s ease-out}
.d-bar{display:flex; justify-content:flex-end; margin-bottom:10px}
.d-close{padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; cursor:pointer}
.d-title{margin:0; font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1.1}
.d-eyebrow{margin:0 0 2px; font-size:12.5px; color:var(--ink-2); font-weight:500}
.d-pre{margin:14px 0 0; padding:12px; border-radius:8px; background:var(--surface-2); font:400 12.5px/1.6 var(--font-mono); white-space:pre-wrap; overflow-wrap:anywhere}
.facts{display:grid; grid-template-columns:7em minmax(0,1fr); margin:14px 0 0}
.facts dt,.facts dd{padding:6px 0; border-top:1px solid var(--line); font-size:13px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0; min-width:0; overflow-wrap:anywhere}
.facts code{font:500 12px var(--font-mono)}
.btn-primary{display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:8px 14px; border-radius:6px; background:var(--ink); color:var(--surface); font-size:13.5px; font-weight:600; text-decoration:none}
.btn-primary::after{content:"↗"}
.av{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-size:20px; line-height:1; flex:none}

/* 대화·회의·결재 */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:6px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.btn.warn{color:var(--err-ink)}
.btn:disabled{opacity:.5; cursor:not-allowed}
button.live{cursor:pointer; font:inherit; font-size:12.5px}
.live.alert{border-color:var(--work); background:color-mix(in srgb, var(--work) 16%, var(--surface)); color:var(--ink)}
.live.alert b{color:var(--ink)}
.hq-node button{margin-left:6px; padding:5px 10px; border-radius:5px; border:0; background:rgba(255,255,255,.12); color:var(--plate-ink); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap}
.hq-node button:hover{background:rgba(255,255,255,.22)}
.d-sec{margin:20px 0 6px; font-size:13px}
.thread{list-style:none; margin:10px 0 0; padding:10px; display:flex; flex-direction:column; gap:8px; max-height:46vh; overflow:auto; border-radius:10px; background:var(--surface-2)}
.msg{align-self:flex-start; max-width:88%; padding:7px 11px; border-radius:10px; background:var(--surface); font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 0 var(--line)}
.msg.me{align-self:flex-end; background:color-mix(in srgb, var(--focus) 16%, var(--surface))}
.msg .who{display:block; margin-bottom:2px; font:600 11.5px var(--font-body); color:var(--ink-3); white-space:normal}
.msg.sys{align-self:center; max-width:100%; padding:2px 8px; background:none; box-shadow:none; color:var(--ink-3); font-size:12px; text-align:center}
.composer{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.composer textarea,.composer input[type="text"]{width:100%; padding:9px 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; font-size:14px}
.composer textarea{min-height:76px; resize:vertical}
.composer .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between}
.composer .row .hint{flex:1 1 220px}
.keys{color:var(--ink-2); font-weight:600}
/* 대화 서랍(총괄·팀원·회의): 제목(d-head)은 맨 위에, 작성창은 맨 아래에 붙어 있고, 그 사이(d-main)만 스크롤해요. 대화(thread)는 d-main 맨 아래에서 남는 자리를 채워요. */
.drawer-panel.chat{display:flex; flex-direction:column; overflow:hidden; padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
.drawer-panel.chat .d-bar{flex:none}
.drawer-panel.chat #drawerBody{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.drawer-panel.chat #drawerBody > :not(.d-main){flex:none}
.d-head{padding-bottom:2px}
.d-main{position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain; margin:0 -4px; padding:0 4px 4px}
.d-main > *{flex-shrink:0}
.drawer-panel.chat .thread{flex:1 0 min(40vh, 300px); max-height:none}
.drawer-panel.chat .composer{margin-top:0; padding-top:10px; border-top:1px solid var(--line); background:var(--surface)}
.drawer-panel.chat .composer textarea{max-height:30vh}
.d-links{margin-top:12px}
.d-links .btn-primary{margin-top:0}
.d-more{margin-top:14px; border:1px solid var(--line); border-radius:8px; padding:0 10px}
.d-more summary{padding:8px 0; font-size:13px; font-weight:600; cursor:pointer}
.d-more h3{margin:10px 0 6px; font-size:13px}
.d-more[open]{padding-bottom:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; border:0; min-width:0}
.chips legend{padding:0; margin-bottom:4px; font-size:12px; color:var(--ink-3)}
.chips label{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:12.5px; cursor:pointer}
.hint{margin:0; font-size:12px; color:var(--ink-3)}
.err{margin:0; font-size:12.5px; color:var(--err-ink)}
.err:empty{display:none}
.appr{border:1px solid var(--line); border-radius:10px; padding:12px 13px; margin-top:12px; background:var(--surface)}
.appr.done{opacity:.72}
.appr-top{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
.appr h4{margin:6px 0 4px; font-size:15.5px; line-height:1.35}
.appr .sum{margin:0; font-size:13px; color:var(--ink-2); white-space:pre-wrap; overflow-wrap:anywhere}
.appr .risk{margin:8px 0 0; padding:7px 9px; border-radius:6px; background:color-mix(in srgb, var(--err) 12%, var(--surface)); font-size:12.5px; color:var(--ink)}
.appr .opts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.appr .opts .rec::after{content:"추천"; margin-left:4px; padding:0 5px; border-radius:3px; background:var(--gold); color:#1C2330; font-size:10.5px}
.meet-now{margin-top:8px; padding:8px 10px; border-radius:8px; background:color-mix(in srgb, var(--meet) 14%, var(--surface)); font-size:13px}
.meet-now ol{margin:6px 0 0; padding-left:18px; color:var(--ink-2); font-size:12.5px}
.meet-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.new-dot{display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px; background:var(--err); color:#fff; font:700 10.5px/1.4 var(--font-body); vertical-align:middle}
.relay-note{margin:0; font-size:12px; color:var(--err-ink)}
.relay-note:empty{display:none}
#relay a,.relay-note a{font-weight:600; white-space:nowrap; text-underline-offset:3px}   /* 총괄 창이 멈췄을 수 있을 때의 ‘총괄 창 열기 ↗’ */
.past{list-style:none; margin:0; padding:0}
.past li + li{border-top:1px solid var(--line)}
.past button{width:100%; padding:7px 0; border:0; background:none; color:var(--ink); font:500 12.5px var(--font-body); text-align:left; cursor:pointer; overflow-wrap:anywhere}
.past button:hover{text-decoration:underline}
.past small{color:var(--ink-3)}

/* 처음 설정: 창 전체를 덮는 단계 화면(로그인 → Claude 연결 → 사무실 만들기 → 공개 범위 → 완료). 위의 '설정'으로 다시 열어요. */
.setup{position:fixed; inset:0; z-index:60; overflow-y:auto; overscroll-behavior:contain; background-color:var(--floor); background-image:repeating-conic-gradient(var(--floor) 0 25%, var(--floor-2) 0 50%); background-size:96px 96px; color:var(--ink)}
.setup [hidden]{display:none !important}
.su-wait .wrap{visibility:hidden}
.su-wrap{max-width:880px; margin:0 auto; padding-block:calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.su-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.su-top .plate{display:inline-block; font-size:24px; padding:9px 18px 7px}
.su-h1{flex:1 1 auto; margin:0; font-family:var(--font-display); font-weight:400; font-size:24px; line-height:1.1}
.su-intro{margin:12px 0 0; max-width:68ch; color:var(--ink-2); font-size:13.5px; text-wrap:pretty}
.su-steps{list-style:none; margin:16px 0 0; padding:0; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px}
.su-steps button{display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; height:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); text-align:left; cursor:pointer}
.su-steps button:hover{border-color:var(--ink-3)}
.su-steps .n{font:600 11px var(--font-mono); color:var(--ink-3)}
.su-steps b{font-family:var(--font-display); font-weight:400; font-size:17px; line-height:1.15; word-break:keep-all}
.su-steps small{font-size:11.5px; color:var(--ink-3); overflow-wrap:anywhere}
.su-steps [aria-current="step"]{background:var(--plate); border-color:var(--plate); color:var(--plate-ink); box-shadow:inset 0 0 0 2px var(--plate-rim)}
.su-steps [aria-current="step"] .n,.su-steps [aria-current="step"] small{color:#AEB8C7}
.su-card{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px 16px}
.su-h{margin:0; font-family:var(--font-display); font-weight:400; font-size:26px; line-height:1.1}
.su-h:focus{outline:none}   /* 단계를 바꿀 때 읽기 위치만 옮기는 제목이라 테두리는 그리지 않아요 */
.su-lead{margin:6px 0 0; max-width:70ch; color:var(--ink-2); font-size:13.5px; text-wrap:pretty}
.su-lead b{color:var(--ink); font-weight:600}
.su-sub{margin:18px 0 0; font-size:13.5px; font-weight:600}
.su-box{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.su-box p{margin:0}
.su-box p + p{margin-top:6px}
.su-box .sd{margin-right:4px; vertical-align:1px}
.su-ok{border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:color-mix(in srgb, var(--ok) 9%, var(--surface))}
.su-warn{border-color:color-mix(in srgb, var(--work) 55%, var(--line)); background:color-mix(in srgb, var(--work) 10%, var(--surface))}
.su-opts{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:10px; margin-top:14px}
.su-opt{display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.su-opt b{font-size:14.5px}
.su-opt .hint{flex:1}
.su-code-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0 12px}
.su-code{padding:12px 18px; border-radius:10px; background:var(--plate); color:var(--plate-ink); font:600 32px/1 var(--font-mono); letter-spacing:.14em; -webkit-user-select:all; user-select:all}
.su-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:12px}
.su-check{display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer}
.su-floors,.su-plist{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.setup code{font:500 12px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.su-floors li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:8px 12px; border:1px dashed var(--line-2); border-radius:9px; background:var(--surface-2); font-size:13px}
.su-proj{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:10px 12px}
.su-proj.on{border-color:var(--focus); box-shadow:0 0 0 2px color-mix(in srgb, var(--focus) 22%, transparent)}
/* 세션 나무: Claude 앱 사이드바 순서(내 그룹 → 프로젝트 폴더 → 이 컴퓨터). 찾기는 다시 그리지 않고 hidden만 바꿔요(한글 입력이 끊기지 않게). */
.su-tools{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 18px; margin-top:12px}
.su-tools .su-q{flex:1 1 260px; max-width:400px}
.su-tools .su-check{min-height:34px}
.su-src{margin-top:4px}
.su-count{margin-top:6px}
.su-folder{margin-top:10px}
.su-frow{display:grid; grid-template-columns:minmax(0,1fr); gap:8px}
.su-frow.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.su-folder .hint{display:block; margin-top:2px}
.su-newf{padding:6px 9px; border-radius:7px; border:1px solid color-mix(in srgb, var(--focus) 32%, var(--line)); background:color-mix(in srgb, var(--focus) 8%, var(--surface)); color:var(--ink)}
.su-newf code{color:var(--ink)}
.su-exist{margin-top:10px}
.su-exist .hint{margin-top:4px}
.su-exist code{color:var(--ink)}
.su-guess{font-size:11.5px; color:var(--ink-2)}
.su-guess::before{content:"✓ "; color:var(--ok)}
.su-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 12px}
.su-field{display:flex; flex-direction:column; gap:4px; min-width:0}
.su-field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.su-field label small{font-weight:400; color:var(--ink-3)}
.setup input[type="text"],.setup input[type="search"],.setup select{width:100%; min-width:0; padding:7px 9px; border:1px solid var(--line-2); border-radius:7px; background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px}
.su-tree{list-style:none; margin:10px 0 0; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden}
.su-node + .su-node{border-top:1px solid var(--line)}
.su-row{display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:3px 8px 3px 4px; min-height:42px}
.su-tog{display:flex; align-items:center; gap:6px; flex:1 1 240px; min-width:0; padding:6px; border:0; border-radius:6px; background:none; color:var(--ink); font:inherit; font-size:14px; text-align:left; cursor:pointer}
.su-tog:hover{background:var(--surface-2)}
.su-caret,.su-ico{flex:none; width:16px; height:16px; color:var(--ink-2)}
.su-caret{transition:transform .15s}
.su-tog[aria-expanded="true"] .su-caret{transform:rotate(90deg)}
.su-nm,.su-st{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; min-width:0; overflow-wrap:anywhere}
.su-nm b{font-weight:600}
.su-nm small,.su-st small{font-size:12px; color:var(--ink-2)}
.su-kids{list-style:none; margin:0; padding:0 0 4px}
.su-kids .su-row{padding-left:38px; min-height:38px; border-top:1px dashed var(--line)}
.su-st{flex:1 1 240px; padding:4px 0; font-size:13.5px}
.su-to{flex:none; padding:4px 11px; font-size:12.5px}
.su-row > .su-to{margin-left:auto}   /* 좁은 화면에서 줄이 넘어가도 단추는 오른쪽에 */
.su-node.picked > .su-row,.su-kids li.picked > .su-row{background:color-mix(in srgb, var(--focus) 9%, var(--surface))}
.chip.on{background:color-mix(in srgb, var(--focus) 18%, var(--surface)); color:var(--ink)}
.su-leaf-empty{padding:6px 12px 8px 38px; font-size:12.5px; color:var(--ink-2); border-top:1px dashed var(--line)}
/* 만들 층: 고른 층마다 카드 하나. 팀원은 [역할 이름][앉힐 세션][빼기] 한 줄씩, 맨 위는 늘 팀장 */
.su-make{margin-top:22px}
.su-make-empty{margin-top:6px; padding:12px 14px; border:1px dashed var(--line-2); border-radius:10px}
.su-card-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-bottom:10px}
.su-card-t{margin:0; font-family:var(--font-display); font-weight:400; font-size:20px; line-height:1.15; overflow-wrap:anywhere}
.su-card-h .su-to{margin-left:auto; align-self:center}
.su-mem{margin:14px 0 0; padding:0; border:0; min-width:0}
.su-mem legend{padding:0; margin-bottom:6px; font-size:12.5px; font-weight:600; color:var(--ink)}
.su-mem legend small{font-weight:400; color:var(--ink-2)}
.su-mhead,.su-mrow{display:grid; grid-template-columns:minmax(7.5em, 10.5em) minmax(8em, 13em) minmax(0,1fr) 34px; gap:4px 8px; align-items:center}
.su-mhead{padding:0 2px 4px; color:var(--ink-2)}   /* 칸 너비가 em이라 머리글도 줄(.su-mrow)과 같은 글자 크기(상속)를 바탕으로 하고, 글자만 작게 해요 */
.su-mhead span{font-size:11.5px}
.su-mlab{display:none}
.su-mrow + .su-mrow{margin-top:6px}
.su-lead-role{display:flex; align-items:center; gap:6px; min-height:34px; padding:0 9px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2); font-size:13.5px; font-weight:600}
.su-lead-role small{font-weight:400; font-size:11.5px; color:var(--ink-2)}
.su-mx{width:34px; height:34px; padding:0; justify-content:center; font-size:17px; line-height:1}
.su-mnote{grid-column:1 / -1; margin:0}
.setup .su-mrow [aria-invalid="true"]{border-color:var(--err)}
.setup .su-mrow input[readonly]{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}
.su-exist .su-miss{color:var(--ink)}
.su-madd{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px}
.su-sugg{padding:3px 10px; border-radius:999px; font-size:12px; font-weight:500}
.su-floors li.su-have{display:block}
.su-have-h{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.su-have-h .su-to{margin-left:auto}
.su-ord{display:inline-flex; gap:4px; margin-right:2px}
.su-ord .mv{width:32px; height:30px; font-size:15px}
.su-ordnote{margin-top:6px}
.su-ordnote:empty{display:none}
.su-pos{margin-top:10px; max-width:560px}
.su-floors li.su-have.on{border-style:solid; border-color:var(--focus); background:var(--surface)}
.su-edit{margin-top:8px; padding-top:4px; border-top:1px dashed var(--line-2)}
.su-saved{margin-top:4px}
.su-boss{margin-top:16px; max-width:560px}
.su-intro-f{margin-top:16px; max-width:560px}
.su-res{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.su-res h3{margin:0 0 6px; font-size:13.5px}
.su-res ul{list-style:none; margin:0; padding:0; font-size:13px}
.su-res li{padding:3px 0}
.su-res .bad{color:var(--err-ink)}
.su-res .hint{margin-top:8px}
.su-vis{margin:12px 0 0; padding:8px 12px 12px; border:1px solid var(--line); border-radius:10px; min-width:0}
.su-vis legend{display:flex; align-items:center; gap:6px; padding:0 4px; font-family:var(--font-display); font-size:18px}
.su-levels{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.su-lv{display:flex; align-items:flex-start; gap:7px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); cursor:pointer; font-size:13px}
.su-lv input{flex:none; margin:3px 0 0}
.su-lv > span{display:flex; flex-direction:column; gap:1px; min-width:0}
.su-lv small{color:var(--ink-3); font-size:11.5px; line-height:1.4}
.su-lv:has(input:checked){border-color:var(--ink); background:color-mix(in srgb, var(--focus) 8%, var(--surface))}
/* 설정 화면의 작은 설명 글(무엇이 공개되는지, 로그인 방법)은 --ink-3로는 대비가 모자라서 --ink-2로(6:1 이상). 지금 단계 표시는 더 구체적인 규칙이 그대로 이겨요. */
.setup .hint,.su-lv small,.su-steps .n,.su-steps small,.su-field label small{color:var(--ink-2)}
.setup .su-newf{color:var(--ink)}
.su-pubstate{margin-top:6px; font-weight:600}
.su-rules{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; font-size:12.5px}
.su-confirm{margin-top:14px; padding:14px; border:2px solid var(--err); border-radius:10px; background:color-mix(in srgb, var(--err) 8%, var(--surface))}
.su-confirm h3{margin:0; font-size:15.5px}
.su-confirm p{margin:6px 0 0; font-size:13px}
.su-confirm ul{margin:6px 0 0; padding-left:18px; font-size:13px}
.su-nav{display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:20px; padding-top:14px; border-top:1px solid var(--line)}
.su-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
@media (max-width:760px){
  .su-levels{grid-template-columns:repeat(2, minmax(0,1fr))}
  .su-steps small{display:none}
}
@media (min-width:560px) and (max-width:760px){   /* 이름 칸이 더해져서 이 폭에서는 세션 고르기를 둘째 줄로 내려요 */
  .su-mhead,.su-mrow{grid-template-columns:minmax(7em, 10em) minmax(0,1fr) 34px}
  .su-mhead span:nth-child(3){display:none}
  .su-mrow select{grid-column:1 / -1; grid-row:2}
  .su-mrow > .su-mx,.su-mrow > span[aria-hidden="true"]{grid-column:3; grid-row:1}
}
@media (max-width:559px){
  .su-grid,.su-levels,.su-frow.two{grid-template-columns:minmax(0,1fr)}
  .su-mhead{display:none}
  .su-mrow{grid-template-columns:minmax(0,1fr) 34px}
  .su-mrow > :first-child{grid-column:1; grid-row:1}
  .su-mrow > .su-mlab{display:block; grid-column:1 / -1; grid-row:2; margin-top:2px; font-size:11.5px; color:var(--ink-2)}   /* 머리글이 숨겨지는 폭에서는 칸마다 이름표를 보여요 */
  .su-mrow > .su-mname{grid-column:1 / -1; grid-row:3}
  .su-mrow select{grid-column:1 / -1; grid-row:4}
  .su-mrow > .su-mx{grid-column:2; grid-row:1}
  .su-mrow .su-lead-role{grid-column:1 / -1}
  .su-mrow > span[aria-hidden="true"]{display:none}
  .su-mrow + .su-mrow{margin-top:12px}
  .su-kids .su-row{padding-left:24px}
  .su-leaf-empty{padding-left:24px}
  .su-tools .su-q{max-width:none; flex-basis:100%}
  .su-steps{gap:4px}
  .su-steps button{align-items:center; padding:6px 4px; text-align:center}
  .su-steps b{font-size:13.5px}
  .su-card{padding:14px}
  .su-code{font-size:26px}
}

/* 새 버전: 머리말 알림(칩), 업데이트 확인 창, 창 전체를 덮는 ‘업데이트하는 중’ 화면. 서버(/api/update/*)가 없으면 아무것도 보이지 않아요. */
.upd{display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 8px; max-width:100%; min-height:32px; padding:3px 4px 3px 12px; border-radius:6px; border:1px solid color-mix(in srgb, var(--focus) 45%, var(--line)); background:color-mix(in srgb, var(--focus) 9%, var(--surface)); color:var(--ink); font-size:12.5px}
.upd[hidden],.upd-modal[hidden],.upd-run[hidden]{display:none}
.upd b{font:600 12px var(--font-mono)}
.upd .dot{color:var(--ink-3)}
.upd .btn{min-height:26px; padding:2px 10px; font-size:12.5px}
.upd a{padding:2px 4px; border-radius:4px; font-weight:600; text-underline-offset:3px; white-space:nowrap}
.upd.ok{border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
.upd.ok span::before{content:"✓ "; color:var(--ok)}
.upd-x{min-width:26px; height:26px; padding:0 4px; border:0; border-radius:5px; background:none; color:var(--ink-2); font-size:15px; line-height:1; cursor:pointer}
.upd-x:hover{background:var(--surface-2); color:var(--ink)}
.upd-modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.upd-scrim{position:absolute; inset:0; background:var(--scrim)}
.upd-card{position:relative; width:min(480px, 100%); max-height:calc(100vh - 32px); overflow-y:auto; padding:18px 20px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); box-shadow:0 24px 60px -24px rgba(0,0,0,.55); animation:slideup .18s ease-out}
.upd-card:focus,.upd-runbox h2:focus{outline:none}   /* 열 때 읽기 위치만 옮기는 곳이라 테두리는 그리지 않아요 */
.upd-card h2,.upd-runbox h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:23px; line-height:1.15}
.upd-card p,.upd-runbox p{margin:8px 0 0; font-size:13.5px; text-wrap:pretty}
.upd-card .hint,.upd-runbox .hint{color:var(--ink-2); font-size:12.5px}
.upd-card .err{margin-top:10px}
.upd-run{position:fixed; inset:0; z-index:80; overflow-y:auto; overscroll-behavior:contain; display:flex; padding:calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background-color:var(--floor); background-image:repeating-conic-gradient(var(--floor) 0 25%, var(--floor-2) 0 50%); background-size:96px 96px; color:var(--ink)}
.upd-runbox{width:min(560px, 100%); min-width:0; margin:auto; padding:20px 22px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}   /* margin:auto로 가운데: 내용이 길어도 위쪽이 잘리지 않고 스크롤돼요 */
.upd-runbox .plate{display:inline-block; font-size:22px; padding:8px 16px 6px}
.upd-runh{display:flex; align-items:center; gap:12px; margin-top:16px}
.upd-spin{flex:none; width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--focus); animation:spin .9s linear infinite}
.upd-run.fail .upd-spin{display:none}
.upd-run.fail h2{color:var(--err-ink)}
.upd-runst{font-weight:600}
.upd-runbox .d-pre{max-height:40vh; overflow:auto; margin-top:10px}
.upd-alt{margin:8px 0 0; padding-left:18px; font-size:13px}
.su-upd .su-check{font-weight:600}
.su-upd .su-actions{margin-top:8px}
/* 4단계 ‘도시에 내 건물 세우기’(token-meter 참가) */
.su-meter h3{margin:0 0 6px; font-size:14.5px}
.su-meter h3:focus{outline:none}
.su-meter .su-actions{margin-top:8px}
.su-meter .su-check{margin-top:10px; font-weight:600}
.su-meter details{margin-top:8px}
.su-meter .d-pre{max-height:40vh; overflow:auto; margin-top:6px}
.su-mt-pv{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.su-mt-pv:focus{outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:559px){ .upd .dot{display:none} .upd-runbox{padding:16px} }

/* 빈자리에 새 세션 앉히기(세션 만들기): 사무실 책상, 설정의 팀원 고치기 줄, 층 만들기 결과에 같은 상자가 보여요(상태는 /api/seat/pending) */
.seat{display:flex; flex-direction:column; gap:6px; min-width:0; padding:8px 11px 9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-2)}
.seat:focus{outline:none}   /* 상태가 바뀌어 단추가 없어질 때 키보드 위치만 맡아 두는 상자라 테두리는 그리지 않아요 */
.seat-st{margin:0; color:var(--ink); overflow-wrap:anywhere; text-wrap:pretty}
.seat-st.wait::before{content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--work); vertical-align:1px; animation:pulse 1.2s ease-in-out infinite}
.seat-st.ok{font-weight:600}
.seat-st.ok b{color:var(--ok)}
.seat-st.bad{color:var(--err-ink)}
.seat .hint{color:var(--ink-2)}
.seat code{font:500 11.5px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.seat-acts{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.seat-acts .btn,.seat-pick .btn{min-height:30px; padding:4px 10px; font-size:12.5px}
.seat-pick{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.seat-pick .btn{width:100%; justify-content:space-between; flex-wrap:wrap; gap:2px 8px; font-weight:500; text-align:left; overflow-wrap:anywhere}
.seat-pick .btn small{font-weight:400; color:var(--ink-2)}
.seat-ok{margin:0; padding:5px 11px; border-top:1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); background:color-mix(in srgb, var(--ok) 12%, var(--surface)); color:var(--ink); font-size:12.5px; font-weight:600}
.setup .su-seat{padding:4px 0 2px; border-top:0}
.su-seats{margin-top:10px; padding-top:8px; border-top:1px dashed var(--line-2)}
.su-seats ul{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.su-seats li{display:grid; grid-template-columns:minmax(6em, 9em) minmax(0,1fr); gap:4px 10px; align-items:start; padding:0}
.su-seats li > b{padding-top:6px; font-size:13px; overflow-wrap:anywhere}
@media (max-width:559px){ .su-seats li{grid-template-columns:minmax(0,1fr)} .su-seats li > b{padding-top:0} }
/* 추천 팀(설정 3단계 맨 위): 세션 목록(과 허락하면 첫 메시지 몇 줄)을 보고 서버가 나눈 층. 카드마다 팀원과 그렇게 고른 까닭 한 마디 */
.su-rec{margin-top:16px; padding:14px 16px 16px; border:1px solid color-mix(in srgb, var(--focus) 40%, var(--line)); border-radius:12px; background:color-mix(in srgb, var(--focus) 5%, var(--surface))}
.su-rec-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin:0}
.su-rec-h h3{margin:0; font-family:var(--font-display); font-weight:400; font-size:21px; line-height:1.15}
.su-rec-h h3:focus{outline:none}
.su-rec-h .btn{margin-left:auto; padding:4px 11px; font-size:12.5px}
.su-rec > .hint{margin-top:4px}
.su-ask{margin-top:12px; padding:12px 14px; border:1px solid color-mix(in srgb, var(--work) 55%, var(--line)); border-radius:10px; background:color-mix(in srgb, var(--work) 10%, var(--surface))}
.su-ask p{margin:0; font-size:13.5px; color:var(--ink)}
.su-ask .su-actions{margin-top:8px}
.su-recs{list-style:none; margin:12px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap:10px}
.su-rc{display:flex; flex-direction:column; min-width:0; padding:10px 12px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.su-rc-h{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.su-rc-t{flex:1 1 auto; min-width:0; margin:0; font-family:var(--font-display); font-weight:400; font-size:19px; line-height:1.15; overflow-wrap:anywhere}
.su-rc-h .btn{padding:3px 10px; font-size:12.5px}
.su-rc-meta{display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; margin:3px 0 0; font-size:12px; color:var(--ink-2)}
.su-rc-meta code{font:500 11.5px var(--font-mono); color:var(--ink-2); overflow-wrap:anywhere}
.su-rc-ms{list-style:none; margin:8px 0 0; padding:0; border-top:1px dashed var(--line)}
.su-rc-ms li{display:grid; grid-template-columns:minmax(4.5em, 6.5em) minmax(0,1fr); gap:0 8px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px}
.su-rc-ms li > b{font-weight:600; overflow-wrap:anywhere}
.su-rc-ms .who{display:flex; flex-wrap:wrap; align-items:baseline; gap:1px 6px; min-width:0; overflow-wrap:anywhere}
.su-rc-ms small{font-size:11.5px; color:var(--ink-2)}
.su-rc-ms li.off{color:var(--ink-2)}
.su-rc-ms li.off .who > span:first-child{text-decoration:line-through; text-decoration-color:var(--line-2)}
.su-rc-ms li.empty .who > span:first-child{color:var(--ink-2)}
.su-rc .err{margin-top:6px}
.su-rc .hint{margin-top:6px}
.chip.cx{background:color-mix(in srgb, var(--meet) 18%, var(--surface)); color:var(--ink); white-space:nowrap}
.su-rec-go{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:14px}
.su-rec-go .btn.primary{padding:9px 16px; font-size:14px}
.su-rec-more{margin-top:10px; display:flex; flex-direction:column; gap:4px}
.su-cx-note{margin:8px 0 0}
.su-rec-more p{margin:0; font-size:12.5px; color:var(--ink-2)}
.su-rec-more .btn{padding:2px 9px; font-size:12px; vertical-align:baseline}
.su-rec .su-res{margin-top:12px; background:var(--surface)}
/* 팀원 줄의 Codex 자리(읽기 전용): 세션 칸에서 ‘Codex (읽기 전용)’ 묶음의 세션을 고르면 그 줄 아래에 한 줄로 알려요 */
.su-cxn{display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; font-size:12px}
@media (max-width:559px){ .su-rc-ms li{grid-template-columns:minmax(4em, 5.5em) minmax(0,1fr)} .su-rec{padding:12px} }
/* 총괄 만들기(설정 3단계 총괄 칸 아래, 사무실의 총괄 칸 아래) */
.su-bossmk{margin-top:10px; padding:10px 12px; border:1px dashed var(--line-2); border-radius:9px; background:var(--surface-2)}

.boss-mk{width:min(100%, 460px); border:1px dashed var(--line-2); border-radius:10px; background:var(--surface)}
.boss-mk > p{margin:0; padding:8px 11px 0; font-size:12.5px; color:var(--ink-2)}
.boss-mk .seat{border-top:0}
.meet-lead{margin-top:10px}
.meet-lead .seat{padding:6px 0 0; border-top:0}
.hq-node button.mk{margin-left:6px; padding:5px 10px; border:0; border-radius:5px; background:var(--gold); color:#1C2330; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap}
.live.alert{border-color:color-mix(in srgb, var(--work) 60%, var(--line)); color:var(--ink)}
button.live{font:inherit; font-size:12.5px; cursor:pointer}
/* 책상의 Codex 자리: 읽기 전용(말 걸기는 아직 안 돼요) */
.desk.is-cx .plate-row .when b{font-weight:600; color:var(--ink-2)}
.desk.is-cx .task{color:var(--ink-2)}
.desk-foot .cx-tag{flex:none; padding:2px 7px; border-radius:4px; background:var(--rack-2); color:var(--rack-ink); font-size:11px; font-weight:600}
/* 5단계: 팀 규칙 한 줄(CLAUDE.local.md) 넣기 */
.su-rl{margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.su-rl .su-check{align-items:flex-start; font-weight:600}
.su-rl .su-check input{margin-top:3px}
.su-rl ul{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.su-rl li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:13px}
.su-rl li code{font:500 12px var(--font-mono); overflow-wrap:anywhere}
.su-rl li .btn{margin-left:auto; padding:3px 10px; font-size:12.5px}
.su-rl .st{flex:1 1 100%; margin:0; font-size:12.5px; color:var(--ink-2)}
.su-rl .st.ok{color:var(--ink)}
.su-rl .st.ok::before{content:"✓ "; color:var(--ok)}
.su-rl .st.bad{color:var(--err-ink)}
.su-have-b{margin-left:auto; display:inline-flex; flex-wrap:wrap; gap:6px}
.su-have-h .su-have-b .su-to{margin-left:0}

  // edit: ✎를 보일 팀원 줄(예시 팀은 못 고쳐요. 역할 이름으로 못 쓰는 줄(shown_rows 밖)은 서버가 그 줄을 찾지 못하니 이름만 보여 줘요)
  const mine = API && !String(t.office || '').startsWith('examples/');   // 로컬 페이지의 내 층(예시 팀은 고치지도, 세션을 만들지도 않아요)
  const cx = { names: [d.team.team, t.name].filter(x => typeof x === 'string' && x), edit: mine ? new Set(shownRows(d.team.members).map(x => x.m)) : null, seat: mine };
  const working = ms.filter(m => (isCx(m) ? cxInfo(t.id, m).state === '일하는 중' : d.status[m.role] && d.status[m.role].state === '일하는 중')).length;
  const meeting = ms.filter(m => d.status[m.role] && d.status[m.role].state === '회의 중').length;
  const items = parseBoard(d.board);
  const open = items.filter(i => !i.done);
  const done = items.filter(i => i.done);
  const log = [...d.log].reverse().slice(0, 40);
  const boardHTML = items.length ? `<ul class="board">${[...open, ...done.slice(-4).reverse()].map(i => `<li class="${i.done ? 'done' : ''}"><span class="ck"></span><span class="bt">${esc(i.title)}</span><span class="bm"><code>${esc(i.id)}</code><span>${seatHTML(t.id, i.who)}</span>${i.st ? `<span class="chip${/결정 대기|막힘/.test(i.st) ? ' wait' : ''}">${esc(i.st)}</span>` : ''}</span></li>`).join('')}</ul>` : '<p class="empty">업무판이 비어 있어요.</p>';
  const feed = log.length ? `<ul class="feed">${log.map(e => `<li><time>${esc(hm(e.t))}</time><span><span class="k ${esc(e.kind)}">${esc(e.kind)}</span><span class="route"><b>${seatHTML(t.id, e.from)}</b> → <b>${seatHTML(t.id, e.to)}</b></span><br>${esc(e.text)}</span></li>`).join('')}</ul>` : '<p class="empty">아직 기록이 없어요.</p>';
  const reports = d.reports.length ? `<ul class="files">${[...d.reports].reverse().slice(0, 12).map(f => `<li><button type="button" data-file="${esc(d.base + 'reports/' + f)}">${esc(f)}</button></li>`).join('')}</ul>` : '<p class="empty">아직 보고서가 없어요.</p>';
  const meets = d.meetings.length ? `<ul class="files">${[...d.meetings].reverse().slice(0, 6).map(f => `<li><button type="button" data-file="${esc(d.base + 'meetings/' + f)}">${esc(f)}</button></li>`).join('')}</ul>` : '';
  const cmds = [
    `${t.name} 회의하자: (주제)`,
    ...ms.filter(m => m.role !== LEAD && !isCx(m)).slice(0, 6).map(m => `${t.name} ${m.role}한테 (할 일) 시켜`),
    `${t.name} 진행 상황 보고해`
  ];
  const am = (d.metas || []).find(m => m.status === '진행 중') || d.active;
  const amLast = am ? (d.activeChat || []).filter(l => !l.kind).slice(-3) : [];
  const leadGap = API ? leadGapHTML(t, d, 'e') : '';
  const meetPanel = am
    ? `<div class="meet-now"><b>${am.status === '정리 중' ? '회의록 정리 중' : am.mode === '참석' ? '대표와 회의 중' : '팀끼리 회의 중'}</b> · ${esc(am.topic)}
        ${amLast.length ? `<ol>${amLast.map(l => `<li>${seatHTML(t.id, l.from)}: ${esc(String(l.text).slice(0, 80))}</li>`).join('')}</ol>` : ''}</div>
       <div class="meet-actions"><button type="button" class="btn primary" data-meet-open="${esc(t.id)}" data-meet-id="${esc(am.id)}">회의실 들어가기</button>${API && am.status !== '진행 중' && !leadGap && !exampleTeam(t.id) ? `<button type="button" class="btn" data-meet-new="${esc(t.id)}">새 회의 시작</button>` : ''}</div>${am.status !== '진행 중' ? leadGap : ''}`
    : `${d.meeting ? `<div class="meet-state"><i class="sd ${meeting ? 'meet' : 'none'}"></i><b>${meeting ? '지금 회의 중' : '마지막 회의'}</b></div><button class="meet-file" type="button" data-file="${esc(d.base + 'meetings/' + d.meeting.file)}">${esc(d.meeting.file)}</button>` : '<p class="empty" style="margin-top:8px">아직 회의를 하지 않았어요.</p>'}
       ${API && exampleTeam(t.id) ? `<p class="hint" style="margin-top:8px">${EX_NO_MEET}</p>` : API ? leadGap || `<div class="meet-actions"><button type="button" class="btn primary" data-meet-new="${esc(t.id)}">회의 시작</button></div>` : '<p class="hint" style="margin-top:8px">회의는 대표만 열 수 있어요. 로컬 페이지에서 ‘회의 시작’을 눌러요.</p>'}`;
  return `<section class="room" data-team="${esc(t.id)}" data-tone="${toneOf(t)}" id="team-${esc(t.id)}" aria-label="${esc(t.name)} 팀 사무실">
    <div class="room-head">${t.floor ? `<span class="fl">${esc(floorLabel(t))}</span>` : ''}<span class="tn">${esc(t.name)}</span><span class="kind">${esc(t.state)}</span>
      <div class="meta"><span>일하는 중 <b>${working}</b></span><span>회의 중 <b>${meeting}</b></span><span>열린 업무 <b>${open.length}</b></span><code>${esc(t.folder || '')}</code>${t.notion ? `<a class="notion" href="${esc(t.notion)}" target="_blank" rel="noopener">노션 ${esc(floorLabel(t))} ↗</a>` : ''}${API && SU.st && !String(t.office || '').startsWith('examples/') ? `<button type="button" class="notion" data-act="edit-team" data-team="${esc(t.id)}">팀원 고치기</button>` : ''}${mine ? floorToolsHTML(t) : ''}</div></div>
    ${mine ? floorNoteHTML(t.id) : ''}
    <div class="room-grid">
      <div class="desks${ms.length > 4 ? ' many' : ''}">${ms.map(m => deskHTML(m, d.status[m.role], t.id, unread(d.base + 'chat/' + m.role + '.jsonl', d.lastChat && d.lastChat[m.role]), cx)).join('')}</div>
      <div class="side">
        <div class="panel"><h3>회의실 <span>${am ? esc(am.mode) + ' 회의' : meeting ? '회의 중' : '비어 있음'}</span></h3>${meetingSVG(ms, d.status, cx.names)}
          ${meetPanel}</div>
        <div class="panel"><h3>업무판 <span>열린 일 ${open.length}</span></h3>${boardHTML}</div>
      </div>
    </div>
    <div class="bottom">
      <div class="panel"><h3>활동 기록 <span>지시·업무·보고·회의</span></h3>${feed}</div>
      <div class="panel"><h3>보고서 <span>${d.reports.length}개</span></h3>${reports}${meets ? `<h3 style="margin-top:14px">회의록 <span>${d.meetings.length}개</span></h3>${meets}` : ''}
        ${(d.metas || []).length ? `<h3 style="margin-top:14px">사이트 회의 대화 <span>${d.metas.length}개</span></h3><ul class="past">${[...d.metas].reverse().map(m => `<li><button type="button" data-meet-open="${esc(t.id)}" data-meet-id="${esc(m.id)}">${esc(m.topic)} <small>· ${esc(m.id)} · ${esc(m.mode)} · ${esc(m.status)}</small></button></li>`).join('')}</ul>` : ''}</div>
    </div>
    ${API
      ? ''
      : `<div class="panel howto"><h3>총괄에게 이렇게 말하세요 <span>복사해서 총괄 대화창에 붙여 넣으면 돼요</span></h3>
          <div class="cmds">${cmds.map(c => `<div class="cmd"><code>${esc(c)}</code><button type="button" data-copy="${esc(c)}">복사</button></div>`).join('')}</div></div>`}
  </section>`;
}

/* ---------- 서랍 ---------- */
let lastFocus = null, lastKey = null, pending = false;
let NE = null;   // 책상에서 이름을 고치는 중: { tid, role, value, orig, err, busy }. 고치는 동안은 4초마다 다시 그리지 않아요(pending으로 미뤄 둬요)
// chat: 대화 서랍(제목은 맨 위, 작성창은 맨 아래에 붙고 그 사이만 스크롤해요). html은 <div class="d-head">제목</div><div class="d-main">…</div> 다음에 작성창을 둬요.
function openDrawer(html, team, chat) {
  if (NE) { NE = null; pending = true; }   // 서랍을 열면 책상의 이름 고치기는 접어요(서랍을 닫을 때 다시 그려요)
  $('#drawerBody').innerHTML = html;
  const p = $('.drawer-panel');
  p.classList.toggle('chat', !!chat);
  if (team) p.dataset.team = team; else delete p.dataset.team;
  const tt = team && state && state.org.teams.find(x => x.id === team);
  if (tt) p.dataset.tone = toneOf(tt); else delete p.dataset.tone;
  const dr = $('#drawer');
  if (dr.hidden) { lastFocus = document.activeElement; lastKey = focusKey(lastFocus); dr.hidden = false; }
  p.scrollTop = 0;
  restoreDrafts();
  armButtons();
  $('#drawerClose').focus();
}
function closeDrawer() {
  $('#drawer').hidden = true;
  live = null;
  if (pending) { pending = false; render(); }
  if (lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus(); else refocus(lastKey);
}
// 결정 버튼(결재 선택·회의에서 빠지기)은 서랍이 열리고 잠깐 뒤에 눌리게 해요(겹친 화면에서 실수로 눌리지 않게).
function armButtons() {
  const bs = $$('#drawerBody [data-arm]');
  bs.forEach(b => { b.disabled = true; });
  setTimeout(() => bs.forEach(b => { if (b.isConnected && !b.closest('form[data-busy]')) b.disabled = false; }), 600);
}

/* ---------- 책상에서 이름 고치기 ---------- */
// ✎를 누르면 책상의 이름 자리가 입력칸이 돼요(Enter 저장 · Esc 취소). 서버(/api/setup/member-name)가 그 팀원의 name 칸만 바꾸고, 역할·대화·상태 파일은 그대로예요.
// 한글을 조합하는 중의 Enter/Esc는 글자를 확정하는 키라 건드리지 않아요(isComposing, 맥 앱의 keyCode 229, 조합이 끝난 직후 IME_GAP 안의 Enter).
const nameClash = (v, taken) => (hit => (!hit ? '' : hit.what === 'name' ? `‘${v}’ 이름은 이 층의 ‘${hit.role}’ 자리가 이미 써요. 다른 이름을 써 주세요` : `‘${v}’ 이름은 이 층의 ‘${hit.role}’ 자리 역할 이름과 같아요. 다른 이름을 써 주세요`))(taken && taken.get(fold(v)));
const nameErr = (v, taken) => !v ? ''
  : glen(v) > NAME_MAX ? `이름은 ${NAME_MAX}자까지예요(지금 ${glen(v)}자)`
  : NAME_BAD.test(v) ? '이름에는 줄바꿈이나 눈에 보이지 않는 글자(제어·서식 문자)를 쓸 수 없어요'
  : ROLE_BAN.has(v) ? '‘대표’와 ‘총괄’은 이름으로 쓸 수 없어요'
  : nameClash(v, taken);
// 설정 화면의 줄: 이름 칸을 불러온 이름에서 바꿨는지(바꾼 이름만 서버로 보내요), 자리(역할)가 이번에 새로 생겼는지(새 자리·바꾼 역할)
const nameChanged = r => nameNorm(r.name) !== nameNorm(r.nameOrig);
const roleFresh = r => (r.was ? roleKey(r.role) !== roleKey(r.was) : !r.kept);
// 다른 줄들이 쓰는 이름·역할: fold(글) → { role: 그 줄의 역할, what: 'name'|'role' }. rows: [{ role, name }](지금 입력한 이름. 비었으면 기본 이름 ‘<팀 이름> <역할>’)
// fresh: 이번 고치기에서 새로 생긴 것만(바꾼 이름, 새 자리·바꾼 역할)
function takenNames(rows, self, tname, fresh) {
  const m = new Map();
  for (const x of rows) {
    if (x === self || !x || typeof x !== 'object') continue;
    const role = String(x.role == null ? '' : x.role), nm = nameNorm(x.name), n = nm || (role && tname ? `${tname} ${role}` : '');
    const rf = !fresh || roleFresh(x), nf = !fresh || nameChanged(x) || (!nm && rf);
    if (n && nf && !m.has(fold(n))) m.set(fold(n), { role, what: 'name' });
    if (role && rf && !m.has(fold(role))) m.set(fold(role), { role, what: 'role' });
  }
  return m;
}
// 한 줄의 이름 검사(서버도 같은 것을 다시 봐요). 바꾼 이름은 전부 봐요(길이·글자·대표/총괄·겹침).
// 바꾸지 않은 이름은 예전 규칙으로 지었을 수 있고 서버로도 안 보내서(그대로 둬요) 길이·글자는 보지 않고, 이번에 새로 생긴 이름·역할과 겹칠 때만 막아요.
function nameCheck(e, r, raw) {
  const v = nameNorm(raw === undefined ? r.name : raw);
  if (!v) return '';
  return v !== nameNorm(r.nameOrig) ? nameErr(v, takenNames(e.rows, r, tnameOf(e))) : nameClash(v, takenNames(e.rows, r, tnameOf(e), true));
}
const nmLive = t => { const el = $('#nmLive'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = t; }, 30); } };
function openNameEdit(tid, role) {
  const m = memberOf(tid, role);
  if (!m || !state) return;
  const v = customName(m, teamNames(tid));
  NE = { tid, role, value: v, orig: v, err: '', busy: false };
  render();
  const i = $('#nmIn');
  if (i) { i.focus(); i.select(); }
}
function closeNameEdit(focus) {
  const e = NE;
  if (!e) return;
  NE = null;
  pending = false;
  render();
  if (focus) { const b = $$('#rooms [data-nm-edit]').find(x => x.dataset.team === e.tid && x.dataset.role === e.role); if (b) b.focus(); }
}
function nameEditMsg(msg) {   // 입력칸은 다시 그리지 않고 오류 글만 바꿔요(쓰던 글·커서가 그대로 남게)
  if (NE) NE.err = msg;
  const i = $('#nmIn'), er = $('#nmErr');
  if (er) er.textContent = msg;
  if (i) i.setAttribute('aria-invalid', String(!!msg));
}
async function saveNameEdit() {
  const e = NE;
  if (!e || e.busy) return;
  const m = memberOf(e.tid, e.role), inp = $('#nmIn');
  if (!m) { closeNameEdit(false); return; }
  const v = nameNorm(inp ? inp.value : e.value);
  e.value = v;
  if (v === e.orig) { closeNameEdit(true); return; }   // 바뀐 게 없어요
  const d = state.teams[e.tid], err = nameErr(v, takenNames(d.team.members, m, teamNames(e.tid)[0] || ''));
  if (err) { nameEditMsg(err); if (inp) inp.focus(); return; }
  e.busy = true; nameEditMsg('');
  $$('.nm-edit input, .nm-edit button').forEach(x => { x.disabled = true; });
  try {
    const res = await sp('member-name', { team: e.tid, role: e.role, name: v });
    m.name = typeof res.name === 'string' ? res.name : v;   // 화면에 바로 반영(다시 불러오지 않아도 돼요)
    nmLive(`${e.role} 이름을 ${customName(m, teamNames(e.tid)) || '기본 이름'}(으)로 바꿨어요`);
  } catch (x) {
    e.busy = false;
    $$('.nm-edit input, .nm-edit button').forEach(el => { el.disabled = false; });
    nameEditMsg(x.message || '저장하지 못했어요');
    const i = $('#nmIn'); if (i) i.focus();
    return;
  }
  if (NE === e) closeNameEdit(true);
  if (SU.st) refreshSetup().catch(() => {});   // 설정 화면의 팀원 목록도 새 이름으로
  load();
}

/* ---------- 빈자리에 새 세션 앉히기(세션 만들기) ---------- */
// [세션 만들기]를 누르면 서버(/api/seat/link)가 자리 표시(AGC-…)를 넣은 첫 메시지와 층 폴더로 claude://code/new 링크를 만들어 줘요.
// 그 링크를 열면 Claude 앱이 폴더를 확인하는 창을 띄우고 작성창에 첫 메시지를 채워 둬요. 사람이 Enter를 누르면 서버가 새 세션 기록을 찾아 그 자리에 앉혀요.
// 기다리는 자리가 있는 동안 3초마다 /api/seat/pending을 물어 상태를 보여 줘요: 기다리는 중 → 앉힘 / 고르기(새 세션이 여럿이거나 첫 메시지에 자리 표시가 없으면 제목만 와요) / 시간 지남.
// 같은 상자(seatBoxHTML)가 책상의 빈자리, 설정의 팀원 고치기 줄, 층 만들기 결과에 보여요. 세션의 대화 내용은 오지도 보이지도 않아요.
const SEAT = new Map();   // '<층 id>|<역할>' → { team, role, state: ''(아직)|'waiting'|'pick'|'seated'|'expired'|'failed', fail, busy, err, url, marker, folder, started, expires, candidates, sessionId, doneAt, at }
const SEAT_OK_MS = 120e3;   // ‘자리에 앉혔어요 ✓’를 보여 주는 시간
const CLAUDE_NEW = /^claude:\/\/code\/new\?/;   // 서버가 준 링크가 이 모양일 때만 열어요
const seatKey = (tid, role) => `${tid}|${role}`;   // 층 id와 역할 이름에는 |가 들어가지 않아요
const seatSplit = k => { const s = String(k), i = s.indexOf('|'); return [s.slice(0, i), s.slice(i + 1)]; };
const seatSay = t => { const el = $('#seatLive'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = t; }, 30); } };
// [총괄 만들기]도 같은 자리 상자를 써요: /api/boss/link가 설치 폴더로 총괄 지시(docs/COORDINATOR.md)와 자리 표시를 채운 링크를 만들고,
// 서버가 세션 만들기와 같이 새 세션을 찾아 org.json의 총괄(boss.sessionId)로 정해요. 자리 표시가 없는 새 세션은 저절로 고르지 않고 대표가 골라요.
// 기다리는 상태는 /api/seat/pending 목록에 kind:"boss"(또는 boss:true) 항목으로 와요. 층 id에는 @가 들어갈 수 없어서 이 열쇠는 층과 겹치지 않아요.
const BOSS_T = '@hq', BOSS_ROLE = '총괄';
const isBossSeat = tid => tid === BOSS_T;
// 단추 이름(aria-label)·알림에 쓰는 자리 이름: ‘<층 이름> <자리>’(같은 역할이 여러 층에 있어도 구분돼요). 막 만든 층은 아직 state에 없어서 설정의 층 목록에서 찾아요
function seatWho(tid, role) {
  if (isBossSeat(tid)) return '총괄';
  const t = state && state.org && Array.isArray(state.org.teams) ? state.org.teams.find(x => x.id === tid) : null;
  const f = SU.st && Array.isArray(SU.st.floors) ? SU.st.floors.find(x => x.id === tid) : null;
  const n = String((t && t.name) || (f && f.name) || '').trim();
  return n ? `${n} ${seatText(tid, role)}` : seatText(tid, role);
}
const seatErr = (e, d) => (e instanceof TypeError ? '사무실 서버에 닿지 못했어요. 앱(또는 start.py)이 켜져 있는지 확인해 주세요' : (e && e.message) || d);
function seatGet(k) {   // 지금 보여 줄 상태(앉힌 지 오래됐으면 지우고, 기다릴 시간이 지났으면 서버가 알려 주기 전에도 ‘시간 지남’)
  const s = SEAT.get(k);

/* ---------- 층 머리: 섹션 맞추기 · 규칙 맞추기 ---------- */

  // 규칙 맞추기는 그 층 RULES.md에 ‘팀 간 대화’가 없을 때만(설정 상태를 모르면 늘). 눌러서 나온 알림이 떠 있는 동안은 그대로 둬요(키보드 자리)

// 층 안내 아래 한 줄: RULES.md에 ‘팀 간 대화’가 없는 층(0.5.x 이하로 만든 층)이 있으면 [모두 맞추기]로 그 층들에 규칙 맞추기를 차례로 해요.
// 맞춘 뒤에는 켜져 있는 팀장이 RULES.md를 다시 읽게 [팀장에게 보내기]로 팀장마다 한 줄을 보내요(바로 말 걸기와 같은 전달, outbox).
// 층마다 있는지는 설정 상태(/api/setup/state의 floors[].talkRules)로 알아요. 그 값을 모르는 서버면 보이지 않아요.
const RUL = { busy: false, done: null, sent: null, bad: [], err: '', at: 0 };   // done: 맞췄지만 아직 팀장에게 안 보낸 층들, sent: 보낸 팀장 수
// bad: 못 맞춘 층들 [{id, text}](아직 없는 층만 보여요, [다시 맞추기]), err: 못 보낸 층
const RULES_MS = 5 * 60e3, RULES_TELL = '[규칙] RULES.md를 다시 읽어 주세요';

function rulesNoteHTML() {
  if (RUL.busy) return `<span>${RUL.busy === 'tell' ? '팀장에게 보내는 중…' : '규칙을 맞추는 중…'}</span>`;
  if ((RUL.done || RUL.sent !== null || RUL.bad.length || RUL.err) && Date.now() - RUL.at > RULES_MS) Object.assign(RUL, { done: null, sent: null, bad: [], err: '' });

  if (RUL.sent) out.push(`<span>${esc(`팀장 ${RUL.sent}명에게 보냈어요.`)}</span>`);
  if (RUL.err) out.push(`<span class="bad">${esc(RUL.err)}</span>`);
  if (RUL.sent === null && done.length) out.push(`<span>${esc(`${done.length}개 층 규칙을 맞췄어요.${leads ? ' 켜져 있는 팀장은 RULES.md를 다시 읽어야 해요.' : ''}`)}</span>`);
  if (leads) out.push(tell);   // 보내기 전이거나, 못 보낸 팀장에게 다시
  const bad = RUL.bad.filter(b => miss.some(f => f.id === b.id));   // 그새 맞춘 층(층 머리글 단추)은 빼요
  if (bad.length) out.push(`<span class="bad">${esc(`못 맞춘 층: ${bad.map(b => b.text).join(' / ')}`)}</span><button type="button" class="btn" id="rulesAll" data-act="rules-all">다시 맞추기</button>`);
  else if (miss.length) out.push(`<span>${esc(`${miss.length}개 층 규칙에 팀 간 대화가 없어요`)}</span><button type="button" class="btn" id="rulesAll" data-act="rules-all">모두 맞추기</button>`);

function renderRules() {

  el.hidden = !html;
}

    try {

/* ---------- 팀 간 대화(hq/teams.jsonl) ---------- */
// 팀장이 bin/tell.sh로 남기고 SendMessage로 직접 보낸 [협업] 기록이에요. load()가 4초마다 다시 읽고, 새 줄만 아래에 덧붙여요
// (읽던 자리가 그대로고, 화면 읽기 프로그램은 새 줄만 읽어요). 가장 새 말이 맨 아래예요. 모든 글은 esc()를 거쳐요.
const TALK_FILE = 'hq/teams.jsonl', TALK_MAX = 60, TALK_KEY = 'agencity.talk';
const TALK = { html: null, liveT: 0 };
function talkOf(l) {   // {t, from:{floor, role, name, floorName?}, to:{floor, role, floorName?}, text}. 모양이 틀린 줄은 빼요
  if (!l || typeof l !== 'object' || !l.from || typeof l.from !== 'object' || !l.to || typeof l.to !== 'object') return null;
  const s = v => (typeof v === 'string' ? v : '');
  const text = s(l.text).trim();
  if (!text) return null;
  const who = x => ({ floor: s(x.floor), role: s(x.role) || LEAD, floorName: cut(s(x.floorName).trim(), 60) });   // floorName: 보낼 때의 층 이름(층이 없어졌을 때 써요)
  return { t: s(l.t), from: who(l.from), to: who(l.to), text: cut(text, 4000) };
}
function talkWho(x) {   // ‘<층 이름> 팀장’(팀원 이름을 따로 정했으면 이름 + 작은 역할)
  const t = state.org.teams.find(y => y.id === x.floor);
  return `<b>${esc(t ? t.name : x.floorName || x.floor || '알 수 없는 층')}</b> ${t ? seatHTML(x.floor, x.role) : esc(x.role)}`;
}
const KDAY = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric' });
function whenAt(iso) {   // 오늘이면 시각만, 아니면 날짜도
  const ms = Date.parse(iso);
  if (!isFinite(ms)) return '';
  const d = KDAY.format(new Date(ms));
  return d === KDAY.format(new Date()) ? hm(iso) : `${d} ${hm(iso)}`;
}
const talkItemHTML = x => `<li><p class="talk-who">${talkWho(x.from)} <span aria-hidden="true">→</span><span class="su-sr">, 받는 사람:</span> ${talkWho(x.to)}${x.t ? ` · <time datetime="${esc(x.t)}">${esc(whenAt(x.t))}</time>` : ''}</p><p class="talk-tx">${esc(x.text)}</p></li>`;
function renderTalk() {
  const sec = $('#talk'), box = $('#talkBox'), list = $('#talkList');
  const on = API && !!state && Array.isArray(state.talk) && (mode === 'live' || mode === 'lost');
  sec.hidden = !on;
  if (!on) return;
  const items = state.talk.map(talkOf).filter(Boolean).slice(-TALK_MAX), html = items.map(talkItemHTML), old = TALK.html;
  const atEnd = list.hidden || list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  // 앞의 몇 줄이 빠지고(오래된 줄) 뒤에 새 줄이 붙은 것뿐이면 그만큼만 바꿔요. 아니면 통째로 다시 그리되 읽어 주지는 않아요.
  let d = -1;
  if (old) for (let i = 0; i < old.length; i++) if (old.length - i <= html.length && old.slice(i).every((h, j) => h === html[j])) { d = i; break; }
  let grew = false;
  if (old && d >= 0) {
    for (let i = 0; i < d; i++) if (list.firstElementChild) list.firstElementChild.remove();
    const add = html.slice(old.length - d);
    if (add.length) { list.insertAdjacentHTML('beforeend', add.join('')); grew = true; }
  } else if (!old || old.join('') !== html.join('')) {
    list.setAttribute('aria-live', 'off');
    list.innerHTML = html.join('');
    grew = true;
    clearTimeout(TALK.liveT);
    TALK.liveT = setTimeout(() => list.setAttribute('aria-live', 'polite'), 1500);
  }
  TALK.html = html;
  list.hidden = !items.length;
  $('#talkEmpty').hidden = !!items.length;
  const last = items.length ? items[items.length - 1].t : '';
  if (box.open && last && document.visibilityState !== 'hidden') markSeen(TALK_FILE, last);   // 펼쳐서 보고 있으면 읽은 걸로
  const seen = seenMap()[TALK_FILE] || '', fresh = items.filter(x => x.t && (!seen || x.t > seen)).length;
  put($('#talkN'), items.length ? `최근 ${items.length}개${fresh ? `<span class="new-dot">새 ${fresh}</span>` : ''}` : '아직 없어요');
  if (grew && atEnd) list.scrollTop = list.scrollHeight;
}
$('#talkBox').addEventListener('toggle', () => {
  const box = $('#talkBox');
  try { localStorage.setItem(TALK_KEY, box.open ? '1' : '0'); } catch (e) {}
  if (box.open && state) { renderTalk(); const l = $('#talkList'); l.scrollTop = l.scrollHeight; }
});
try { if (localStorage.getItem(TALK_KEY) === '1') $('#talkBox').open = true; } catch (e) {}

/* ---------- 쓰던 글 보관 ---------- */
// 서랍을 닫거나 다시 그려도 쓰던 글이 남아요. 보내면 지워요.
const drafts = new Map();
const draftKey = ta => { const f = ta.form; return f ? `${f.dataset.form}|${f.dataset.key || ''}|${ta.name}` : ''; };
function restoreDrafts() { $$('#drawerBody form[data-form] textarea').forEach(ta => { const v = drafts.get(draftKey(ta)); if (v) ta.value = v; }); }
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('form[data-form] textarea')) drafts.set(draftKey(e.target), e.target.value); });

/* ---------- 대화(사이트 → 총괄 → 세션, 답은 대화 파일로) ---------- */

function threadHTML(lines, tid) {   // tid: 대화하는 층(있으면 보낸·받는 사람을 팀원 이름으로도 보여 줘요. 파일에는 역할 그대로 남아요)

  return lines.map(l => {

    const to = Array.isArray(l.to) && l.to.length ? ` → ${l.to.map(nm).join(', ')}` : '';
    return `<li class="msg${l.from === '대표' ? ' me' : ''}"><span class="who">${nm(l.from)}${to} · ${esc(hm(l.t))}</span>${esc(l.text)}</li>`;

async function refreshThread(force) {
  if (!live || $('#drawer').hidden) return;
  const el = $('#thread'), cur = live;
  if (!el) return;
  if (cur.tick) cur.tick();
  let text = null;
  if (!API) text = cur.fallback ? cur.fallback.map(l => JSON.stringify(l)).join('\n') : null;
  else {
    try { text = await getText(enc(cur.file)); }
    catch (e) { text = /404|not found/i.test(String(e && e.message)) || !cur.last ? '' : null; }
  }
  if (live !== cur) return;
  if (text === null) {   // 못 읽음(서버 재시작 등): 보이던 대화를 그대로 두고 알림만
    if (!API && !cur.fallback) el.innerHTML = '<li class="msg sys">대화는 이 맥의 로컬 페이지에서만 볼 수 있어요.</li>';
    return;
  }
  if (!force && text === cur.last) return;
  cur.last = text;
  const lines = jsonl(text);
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = threadHTML(lines, cur.tid);
  if (atBottom || force) el.scrollTop = el.scrollHeight;
  // 대화 서랍을 열거나 보낸 뒤: 위쪽(d-main)도 맨 아래로 내려서 마지막 말이 작성창 바로 위에 보이게 해요
  const main = force && el.closest('.d-main');
  if (main) main.scrollTop = main.scrollHeight;
  if (lines.length) markSeen(cur.file, lines[lines.length - 1].t);
}

function optionsOf(a) {
  const out = [];
  for (const o of Array.isArray(a.options) ? a.options : []) {
    if (o && typeof o === 'object' && String(o.key || '').trim()) out.push({ key: String(o.key).trim(), label: String(o.label || '') });
    else if ((typeof o === 'string' || typeof o === 'number') && String(o).trim()) out.push({ key: String(o).trim(), label: '' });
  }
  return out;
}
function reportPath(d, r) {

  return d.base + r.replace(/^\.?\/?(\.office\/)?/, '');
}

/* 지금 있는 층의 ‘팀원 고치기’: team.json의 팀원을 읽어 같은 편집기로 고치고 /api/setup/members로 바꿔요(팀장이 맨 앞). */
async function floorMembersOf(f) {   // team.json(세션 제목도 있어요)을 새로 읽고, 못 읽으면 서버가 알려 준 팀원 목록. { ms: 팀원 줄들, names: 기본 이름을 지을 때 썼을 팀 이름들 }

    if (!t) throw new Error('org.json에 이 층이 없어요');

// 보여 줄 수 있는 줄(shownRows)만 자리로 불러와요. 나머지 줄은 저장해도 서버가 그대로 둬요(editHTML이 알려 줘요).
function rowsFromMembers(ms, names) {
  const list = shownRows(ms);
  const sidOf = m => (typeof m.sessionId === 'string' && SID_RE.test(m.sessionId) ? m.sessionId : '');
  const lead = list.find(x => x.role === LEAD);
  const rows = [newRow(LEAD, lead ? sidOf(lead.m) : '', '', lead ? String(lead.m.title || '') : '')];
  rows[0].name = rows[0].nameOrig = lead ? customName(lead.m, names) : '';
  for (const x of list) if (x.role !== LEAD) {
    const r = newRow(x.role, sidOf(x.m), '', String(x.m.title || ''));
    if (!r.sid) r.cx = cxKey(x.m.codexId);   // Codex 자리(읽기 전용)는 그대로 이어요(저장할 때 codexId를 다시 보내요)
    r.name = r.nameOrig = customName(x.m, names); rows.push(r);
