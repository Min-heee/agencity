async function updGet(origin, ms) {   // 그 주소의 /api/state(에이전시티가 아니거나 못 읽으면 null). 다른 포트는 서버가 CORS로 허락해야 읽혀요
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, tm = ctl ? setTimeout(() => ctl.abort(), ms || 2500) : 0;
  try {
    const r = await fetch(origin ? `${origin}/api/state?t=${Date.now()}` : bust('api/state'), { cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined });
    if (!r.ok) return null;
    const j = await r.json();
    return j && typeof j === 'object' && j.ok === true ? j : null;
  } catch (e) { return null; } finally { clearTimeout(tm); }
}
function updPortList() {
  const cur = Number(location.port) || 80, r = UPD.st && UPD.st.ports, out = new Set();
  if (r) for (let p = r[0]; p <= r[1]; p++) out.add(p);
  else {   // start.py는 8765부터(또는 물려받은 OFFICE_PORT부터) 스무 개를 봐요
    for (let p = UPD_PORTS[0]; p <= UPD_PORTS[1]; p++) out.add(p);
    for (let p = cur; p <= Math.min(65535, cur + 19); p++) out.add(p);
  }
  out.delete(cur);
  return [...out];
}
const updHost = () => `${location.protocol}//${location.hostname}`;
async function updScan(ov) {   // 같은 설치 폴더(home)의 사무실을 다른 포트에서 찾아요. 새 버전이 켜진 곳이 먼저예요
  if (!ov.home) return '';
  const got = await Promise.all(updPortList().map(p => updGet(`${updHost()}:${p}`, 1500).then(j => (j ? { o: `${updHost()}:${p}`, j } : null))));
  const mine = [];
  for (const x of got) if (x) { if (x.j.home === ov.home) mine.push(x); else ov.others.add(x.o); }
  const hit = mine.find(x => sameVer(x.j.version, ov.to)) || mine[0];
  return hit ? hit.o : '';
}
async function updAlive(ov) {   // 읽지는 못해도(CORS 없음) 켜져 있는 포트: 직접 열어 볼 수 있게 주소만 보여 줘요
  const got = await Promise.all(updPortList().map(async p => {
    const o = `${updHost()}:${p}`, ctl = typeof AbortController === 'function' ? new AbortController() : null, tm = ctl ? setTimeout(() => ctl.abort(), 1500) : 0;
    if (ov.others.has(o)) return '';
    try { await fetch(`${o}/api/state?t=${Date.now()}`, { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined }); return o; }
    catch (e) { return ''; } finally { clearTimeout(tm); }

    if (!ov.home && here.home) ov.home = here.home;

      if (s.running) { ov.sawRun = true; ov.doneAt = 0; updStep(rs ? RS_STEP : '설치 스크립트를 받아 실행하는 중이에요'); }
      else if (fresh && last.state === 'failed') { updFail(last.message, '', last.installed); return; }

    }

  }

});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches) return;
  const t = e.target;
  if (t.matches('form[data-form] input')) { if (!e.isComposing) e.preventDefault(); return; }
  if (t.matches(SAY_BOX) && t.dataset.ho) { hoKey(e, t); return; }   // 일 맡기기 칸
  if (t.matches(SAY_BOX)) { sayKey(e, t); return; }
  if ((e.metaKey || e.ctrlKey) && !e.isComposing && !e.repeat && t.matches('form[data-form] textarea')) {
    e.preventDefault();
    const form = t.form, btn = form && form.querySelector('button[type="submit"]');
    if (btn && !btn.disabled && !form.dataset.busy && form.dataset.form !== 'decide') form.requestSubmit(btn);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SU.open && !e.isComposing) {   // 공개 확인이 떠 있으면 그것만 닫아요
    if (SU.confirm) { SU.confirm = false; renderSetup('#suPub'); } else suClose();
    return;
  }
  if (e.key === 'Escape' && !$('#drawer').hidden && !e.isComposing) { closeDrawer(); return; }
});
document.addEventListener('keydown', e => { if (e.target && e.target.matches && e.target.matches('#drawerBody [role="tab"]')) dTabKey(e); });
window.addEventListener('hashchange', () => {
  const id = hashFloor();
  if (!state || !hasFloor(state.org, id) || id === floor) return;
  if (!$('#drawer').hidden) closeDrawer();
  setFloor(id);
  render();
});
$('#drawerBg').addEventListener('click', closeDrawer);
$('#drawerClose').addEventListener('click', closeDrawer);

// 서랍이 열려 있어도 총괄 연결 상태는 계속 확인해서 탭 아래 띠(회의 열기는 안내 줄)에 알려요.
async function pollRelay() {
  if (!API || !state || document.visibilityState === 'hidden') return;
  try { state.relay = JSON.parse(await getText('api/state')); liveTake(state.relay); } catch (e) { return; }
  relayPaint();
  drawerPaint();
}

// 로컬 페이지면 처음 설정을 끝냈는지 먼저 물어요. 그동안 사무실을 잠깐 가려서 설정 화면 전에 번쩍이지 않게 해요(늦어도 2초 뒤엔 보여요).
if (API) { document.documentElement.classList.add('su-wait'); setTimeout(() => document.documentElement.classList.remove('su-wait'), 2000); }
load();
initSetup();
updInit();
seatPoll(true);   // 이 화면을 다시 불러오기 전에 시작한 ‘세션 만들기’가 있으면 이어서 보여 줘요
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && seatWaiting()) seatPoll(); });
setInterval(() => { if (document.visibilityState !== 'hidden' && ($('#drawer').hidden || STAGE.scene) && !UPD.ov) load(); }, 4000);   // 업데이트 중 화면 뒤에서는 쉬어요. 서랍이 열려 있어도 옆에 장면이 보이면 읽어요(글은 닫을 때 그려요)
setInterval(() => { if (document.visibilityState !== 'hidden') refreshThread(false); }, 3000);
setInterval(() => { if (!$('#drawer').hidden) pollRelay(); }, 5000);
// Codex 자리의 상태: 지금 보는 층에 Codex 자리가 있을 때만 10초마다 /api/codex/status를 물어요(그 주소를 모르는 서버면 20초마다 설정 상태를 새로 읽어요)
setInterval(async () => {
  if (!API || SU.open || !state || document.visibilityState === 'hidden' || UPD.ov || CXS.busy) return;
  const d = state.teams[shownFloor(state.org)];
  if (!d || !d.team || !Array.isArray(d.team.members) || !d.team.members.some(isCx) || Date.now() - CXS.at < (CXS.none ? 20e3 : 10e3)) return;
  CXS.busy = true; CXS.at = Date.now();
  try {
    if (CXS.none) { if (SU.st) await refreshSetup(); }
    else { const r = await post('api/codex/status', {}); CXS.seats = Array.isArray(r.seats) ? r.seats : []; }
    if ($('#drawer').hidden && !NE) render();
  } catch (e) { if (/없는 주소/.test(e.message || '')) CXS.none = true; }
  CXS.busy = false;
}, 3000);
})();
</script>
