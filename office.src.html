    const done = ok => { const o = cp.textContent; cp.textContent = ok ? '복사했어요' : '직접 선택해 복사하세요'; setTimeout(() => { cp.textContent = o; }, 1600); };
    try { navigator.clipboard.writeText(cp.dataset.copy).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    return;
  }
  const sb = e.target.closest('[data-seat]');   // 빈자리의 세션 만들기·다시 열기·고르기·취소(사무실 책상과 설정 화면 같이)
  if (sb) {
    if (sb.disabled || !API) return;
    const { team, role } = sb.dataset, k = seatKey(team, role);
    SEATF = { k, box: (sb.closest('[data-seat-box]') || {}).id || '' };
    if (sb.dataset.seat === 'link') seatLink(team, role);
    else if (sb.dataset.seat === 'retry') seatRetry(team, role);
    else if (sb.dataset.seat === 'pick') seatPick(team, role, sb.dataset.sid);
    else if (sb.dataset.seat === 'cancel') seatCancel(team, role);
    return;
  }
  const pen = e.target.closest('[data-nm-edit]');
  if (pen) { if (state && API) openNameEdit(pen.dataset.team, pen.dataset.role); return; }
  const nb = e.target.closest('[data-nm]');
  if (nb) { if (!nb.disabled) { if (nb.dataset.nm === 'save') saveNameEdit(); else closeNameEdit(true); } return; }
  if (e.target.closest('.nm-edit')) return;   // 이름 입력칸 안을 눌러도 서랍이 열리지 않게
  const f = e.target.closest('[data-file]');
  if (f) { fileDrawer(f.dataset.file); return; }
  const mv = e.target.closest('#orgTeams [data-move]');
  if (mv) { if (mv.getAttribute('aria-disabled') !== 'true') moveFloor(mv.dataset.team, mv.dataset.move === 'up' ? 1 : -1, 'office'); return; }
  if (e.target.closest('#orderBtn')) { orderMode = !orderMode; ORD.note = ''; ORD.err = false; render(); return; }
  const g = e.target.closest('[data-goto]');
  if (g) { goFloor(g.dataset.goto); return; }
  const act = e.target.closest('[data-act]');
  if (act && state) {
    if (act.dataset.act === 'boss-chat') { bossDrawer(); return; }
    if (act.dataset.act === 'boss-find') {   // 머리말의 ‘총괄 없음’: 층 안내의 총괄 만들기 상자로
      if (!$('#drawer').hidden) closeDrawer();
      const box = $('#orgTop [data-seat-box]'), t = box && ($('[data-seat]:not([disabled])', box) || box);
      if (t) { box.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); t.focus({ preventScroll: true }); }
      return;
    }
    if (act.dataset.act === 'appr-open') { apprDrawer(); return; }
    if (act.dataset.act === 'edit-team') { editTeam(act.dataset.team); return; }
    if (act.dataset.act === 'rules-all') { rulesAll(); return; }
    if (act.dataset.act === 'rules-tell') { rulesTell(); return; }
    if (act.dataset.act === 'floor-sidebar' || act.dataset.act === 'floor-rules') { if (act.dataset.act === 'floor-rules' && act.getAttribute('aria-disabled') === 'true') return; floorTool(act); return; }
    if (/^meet-(mode|end|close)$/.test(act.dataset.act)) { meetAction(act); return; }
  }
  const mo = e.target.closest('[data-meet-open]');
  if (mo && state) { meetDrawer(mo.dataset.meetOpen, mo.dataset.meetId); return; }
  const mn = e.target.closest('[data-meet-new]');
  if (mn && state) {
    const tid = mn.dataset.meetNew, aid = mn.dataset.approval;
    const a = aid && ((state.teams[tid] || {}).approvals || []).find(x => x.id === aid);
    meetStartDrawer(tid, a ? { topic: a.topic || a.title, mode: a.mode, participants: a.participants, note: a.summary, approval: a.id } : {});
    return;
  }
  const desk = e.target.closest('.desk[data-role]');
  if (desk) { memberDrawer(desk.dataset.team, desk.dataset.role); return; }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  // 진짜 버튼을 눌렀거나 아래 keydown이 보낼 때만 보내요(한 줄 입력칸에서 엔터만 눌렀을 때 저절로 보내지지 않게)
  if (!e.submitter || e.submitter.type !== 'submit') return;
  submitForm(form, e.submitter);
});
// 대화 작성창(총괄·팀원·회의)은 Enter로 보내고 Shift+Enter로 줄을 바꿔요. 결재 메모는 버튼으로만, 회의 열기 메모는 예전처럼 버튼(또는 ⌘/Ctrl+Enter)으로 보내요.
// 한글 입력: 조합 중인 키(isComposing, 또는 맥 앱의 WKWebView·Safari가 주는 keyCode 229)는 글자를 확정하는 키라 건드리지 않고,
// 조합이 끝난 바로 뒤(IME_GAP 안)에 오는 Enter도 보내지 않아요(그 Enter가 줄바꿈으로 들어가지도 않게 막아요). 빈 글은 보내지 않고, 보내는 중에는 다시 보내지 않아요.
const SAY_BOX = 'form[data-form="say"] textarea';
const IME_GAP = 100;
document.addEventListener('compositionend', e => { const t = e.target; if (t && t.matches && (t.matches(SAY_BOX) || t.id === 'nmIn')) t._imeEnd = performance.now(); }, true);
// 책상의 이름 입력칸: Enter 저장, Esc 취소(조합 중이면 건드리지 않아요). 다른 Enter·Esc 처리보다 먼저 받아서 서랍·설정이 같이 닫히지 않게 해요.
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t || t.id !== 'nmIn' || (e.key !== 'Enter' && e.key !== 'Escape')) return;
  if (e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (e.key === 'Escape') { closeNameEdit(true); return; }
  if (e.repeat || performance.now() - (t._imeEnd || -Infinity) < IME_GAP) return;
  saveNameEdit();
}, true);
// 입력칸을 떠났는데 고친 게 없으면 저절로 접어요(펼쳐 둔 채로 두면 책상이 새로 그려지지 않아서)
document.addEventListener('focusout', e => {
  if (!e.target || e.target.id !== 'nmIn') return;
  setTimeout(() => {
    const a = document.activeElement, i = $('#nmIn');
    if (NE && !NE.busy && i && !(a && a.closest && a.closest('.nm-edit')) && nameNorm(i.value) === NE.orig && !NE.err) closeNameEdit(false);
  }, 160);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches) return;
  const t = e.target;
  if (t.matches('form[data-form] input')) { if (!e.isComposing) e.preventDefault(); return; }
  if (t.matches(SAY_BOX)) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.shiftKey) return;   // 줄바꿈
    e.preventDefault();
    if (e.repeat || performance.now() - (t._imeEnd || -Infinity) < IME_GAP) return;
    const form = t.form, btn = form && form.querySelector('button[type="submit"]');
    if (!t.value.trim() || !btn || btn.disabled || form.dataset.busy) return;
    form.requestSubmit(btn);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && !e.isComposing && !e.repeat && t.matches('form[data-form] textarea')) {
    e.preventDefault();
    const form = t.form, btn = form && form.querySelector('button[type="submit"]');
    if (btn && !btn.disabled && !form.dataset.busy && form.dataset.form !== 'decide') form.requestSubmit(btn);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SU.open && !e.isComposing) {   // 공개 확인이 떠 있으면 그것만 닫아요
    if (SU.confirm) { SU.confirm = false; renderSetup('#suPub'); } else closeSetup();
    return;
  }
  if (e.key === 'Escape' && !$('#drawer').hidden && !e.isComposing) { closeDrawer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && !e.target.closest('a, button, input, textarea')) {
    const desk = e.target.closest('.desk[data-role]');
    if (desk) { e.preventDefault(); memberDrawer(desk.dataset.team, desk.dataset.role); }
  }
});
window.addEventListener('hashchange', () => {
  const id = hashFloor();
  if (!state || !hasFloor(state.org, id) || id === floor) return;
  if (!$('#drawer').hidden) closeDrawer();
  setFloor(id);
  render();
});
$('#drawerBg').addEventListener('click', closeDrawer);
$('#drawerClose').addEventListener('click', closeDrawer);

// 서랍이 열려 있어도 총괄 연결 상태는 계속 확인해서 작성창 아래에 알려요.
async function pollRelay() {
  if (!API || !state || document.visibilityState === 'hidden') return;
  try { state.relay = JSON.parse(await getText('api/state')); } catch (e) { return; }
  $$('#drawerBody .relay-note').forEach(n => { n.innerHTML = relayNote(); });
}

// 로컬 페이지면 처음 설정을 끝냈는지 먼저 물어요. 그동안 사무실을 잠깐 가려서 설정 화면 전에 번쩍이지 않게 해요(늦어도 2초 뒤엔 보여요).
if (API) { document.documentElement.classList.add('su-wait'); setTimeout(() => document.documentElement.classList.remove('su-wait'), 2000); }
load();
initSetup();
updInit();
seatPoll(true);   // 이 화면을 다시 불러오기 전에 시작한 ‘세션 만들기’가 있으면 이어서 보여 줘요
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && seatWaiting()) seatPoll(); });
setInterval(() => { if (document.visibilityState !== 'hidden' && $('#drawer').hidden && !UPD.ov) load(); }, 4000);   // 업데이트 중 화면 뒤에서는 쉬어요
setInterval(() => { if (document.visibilityState !== 'hidden') refreshThread(false); }, 3000);
setInterval(() => { if (!$('#drawer').hidden) pollRelay(); }, 5000);
// Codex 자리의 상태: 지금 보는 층에 Codex 자리가 있을 때만 10초마다 /api/codex/status를 물어요(그 주소를 모르는 서버면 20초마다 설정 상태를 새로 읽어요)
setInterval(async () => {
  if (!API || SU.open || !state || document.visibilityState === 'hidden' || UPD.ov || CXS.busy) return;
  const d = state.teams[shownFloor(state.org)];
  if (!d || !d.team || !Array.isArray(d.team.members) || !d.team.members.some(isCx) || Date.now() - CXS.at < (CXS.none ? 20e3 : 10e3)) return;
  CXS.busy = true; CXS.at = Date.now();
  try {
    if (CXS.none) { if (SU.st) await refreshSetup(); }
    else { const r = await post('api/codex/status', {}); CXS.seats = Array.isArray(r.seats) ? r.seats : []; }
    if ($('#drawer').hidden && !NE) render();
  } catch (e) { if (/없는 주소/.test(e.message || '')) CXS.none = true; }
  CXS.busy = false;
}, 3000);
})();
</script>
