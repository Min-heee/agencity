# 공개 도시: city.html을 GitHub Pages(https://min-heee.github.io/agencity/)에 올려요.
# 나가는 건 city.html(→ index.html), 예시 도시(examples/city/demo.json), 공유 그림(docs/city.jpg)뿐이에요.
# 저장소의 다른 파일은 올리지 않아요. Pages 설정의 Source는 "GitHub Actions"여야 해요.
name: 공개 도시

on:
  push:
    branches: [main]
    paths:
      - 'city.html'
      - 'examples/city/**'
      - 'docs/city.jpg'
      - '.github/workflows/city.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 돌고 있는 배포는 끊지 않아요.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 올릴 파일만 _site에 모으기
        run: |
          mkdir -p _site/examples/city
          cp city.html _site/index.html
          cp examples/city/demo.json _site/examples/city/demo.json
          cp docs/city.jpg _site/city.jpg
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
